<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BRENDAN — Nara's Room</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #180800; overflow: hidden; font-family: 'Courier New', monospace; }
  #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #cv { display: block; cursor: grab; }
  #cv:active { cursor: grabbing; }
  .name-block { position: absolute; top: 40px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  .char-name { font-size: clamp(32px, 6vw, 64px); font-weight: 900; letter-spacing: 0.12em; color: #FF6B35; text-shadow: 0 0 30px #FF6B3580, 0 0 60px #FF6B3540; }
  .char-role { font-size: clamp(12px, 2vw, 18px); letter-spacing: 0.3em; color: #FF9966; opacity: 0.85; margin-top: 4px; }
  .info-block { position: absolute; bottom: 48px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; }
  .ability { font-size: clamp(11px, 1.8vw, 15px); letter-spacing: 0.25em; color: #FF6B35; opacity: 0.75; }
  .controls { position: absolute; bottom: 80px; right: 28px; display: flex; flex-direction: column; gap: 10px; }
  .btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #FF6B3560; background: rgba(255,107,53,0.12); color: #FF9966; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; user-select: none; }
  .btn:hover { background: rgba(255,107,53,0.28); border-color: #FF6B35; }
  .back-btn { position: absolute; top: 36px; left: 28px; font-size: 13px; letter-spacing: 0.2em; color: #FF6B3580; text-decoration: none; transition: color 0.15s; }
  .back-btn:hover { color: #FF6B35; }
  .orbit-hint { position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.2em; color: #ffffff30; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="name-block">
    <div class="char-name">BRENDAN</div>
    <div class="char-role">DRUMS</div>
  </div>
  <canvas id="cv"></canvas>
  <div class="info-block">
    <div class="ability">💪 PAINT BEAST · IN THE PAINT</div>
  </div>
  <div class="controls">
    <div class="btn" id="zoomIn">+</div>
    <div class="btn" id="zoomOut">−</div>
  </div>
  <a class="back-btn" href="/">← BACK TO GAME</a>
  <div class="orbit-hint">DRAG TO ORBIT · SCROLL TO ZOOM</div>
</div>

<script>
const CHAR_ID    = 'brendan';
const SPRITE_SRC = '../assets/brendan_sprite.png';
const HUE        = '#FF6B35';

const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
let zoom = 1.0;
const MIN_ZOOM = 0.4, MAX_ZOOM = 3.0;
let orbitAngle = 0;
let orbitSpeed = 0.007;
let frame = 0;
let dragging = false, lastX = 0;
let orbitDragVel = 0;

const spr = new Image();
spr.src = SPRITE_SRC;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const sz = Math.min(window.innerWidth, window.innerHeight) * 0.72;
  canvas.width = sz * dpr; canvas.height = sz * dpr;
  canvas.style.width = sz + 'px'; canvas.style.height = sz + 'px';
  W = sz * dpr; H = sz * dpr;
}
window.addEventListener('resize', resize);
resize();

function drawOverlay() {
  // Full reddish beard
  ctx.fillStyle = '#C03A15';
  ctx.beginPath(); ctx.ellipse(0, -131, 14, 12, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -141, 11, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#E04A20';
  ctx.beginPath(); ctx.ellipse(0, -132, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#8A2510';
  ctx.beginPath(); ctx.ellipse(0, -122, 10, 5, 0, 0, Math.PI * 2); ctx.fill();

  // Curly hair — zigzag clusters before beanie
  ctx.fillStyle = '#0C0806';
  for (const [hx, hy, hr] of [
    [-15,-148,7],[-22,-144,6],[-17,-137,7],[-22,-131,6.5],[-16,-125,6.5],[-21,-119,6],
    [15,-148,7],[22,-144,6],[17,-137,7],[22,-131,6.5],[16,-125,6.5],[21,-119,6]
  ]) { ctx.beginPath(); ctx.arc(hx+1,hy+1,hr,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#1C0E09';
  for (const [hx, hy, hr] of [
    [-15,-148,7],[-22,-144,6],[-17,-137,7],[-22,-131,6.5],[-16,-125,6.5],[-21,-119,6],
    [15,-148,7],[22,-144,6],[17,-137,7],[22,-131,6.5],[16,-125,6.5],[21,-119,6]
  ]) { ctx.beginPath(); ctx.arc(hx,hy,hr,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle = '#3A1A0A';
  for (const [hx, hy, hr] of [
    [-15,-148,7],[-22,-144,6],[-17,-137,7],[-22,-131,6.5],[-16,-125,6.5],[-21,-119,6],
    [15,-148,7],[22,-144,6],[17,-137,7],[22,-131,6.5],[16,-125,6.5],[21,-119,6]
  ]) { ctx.beginPath(); ctx.arc(hx-hr*0.3,hy-hr*0.35,hr*0.45,0,Math.PI*2); ctx.fill(); }

  // Black beanie on top
  ctx.fillStyle = '#0F0F0F';
  ctx.beginPath(); ctx.ellipse(0, -163, 16, 13, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(-16, -165, 32, 13);
  ctx.fillStyle = '#0A0A0A';
  ctx.fillRect(-16, -154, 32, 5);
  ctx.strokeStyle = '#2A2A2A'; ctx.lineWidth = 0.8;
  for (let i = -14; i <= 14; i += 3) {
    ctx.beginPath(); ctx.moveTo(i, -155); ctx.lineTo(i, -150); ctx.stroke();
  }
}

function drawFrame() {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const sprH = H * 0.58;

  const grd = ctx.createRadialGradient(cx, cy + sprH * 0.1, 0, cx, cy, H * 0.55);
  grd.addColorStop(0, HUE + '18'); grd.addColorStop(0.5, HUE + '08'); grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd; ctx.fillRect(0, 0, W, H);

  const squish = Math.abs(Math.cos(orbitAngle));
  ctx.save();
  ctx.translate(cx, cy + sprH * 0.52);
  ctx.scale(squish * 0.9 + 0.1, 1);
  ctx.beginPath(); ctx.ellipse(0, 0, sprH * 0.22, sprH * 0.05, 0, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(0,0,0,${0.22 + 0.12 * squish})`; ctx.fill();
  ctx.restore();

  const bob = Math.sin(frame * 0.045) * (H * 0.012);
  const charY = cy + sprH * 0.5 + bob;
  const facing = Math.cos(orbitAngle) >= 0 ? 1 : -1;
  const xScale = Math.max(0.04, Math.abs(Math.cos(orbitAngle)));

  ctx.save();
  ctx.translate(cx, charY);
  ctx.scale(zoom * xScale * facing, zoom);
  if (spr.complete && spr.naturalWidth > 0) {
    const sH = sprH, sW = sH * spr.naturalWidth / spr.naturalHeight;
    ctx.drawImage(spr, -sW / 2, -sH, sW, sH);
  }
  drawOverlay();
  ctx.restore();
}

function tick() {
  frame++;
  if (!dragging) { orbitAngle += orbitSpeed + orbitDragVel; orbitDragVel *= 0.96; }
  drawFrame();
  requestAnimationFrame(tick);
}
tick();

document.getElementById('zoomIn').addEventListener('click', () => { zoom = Math.min(MAX_ZOOM, zoom * 1.2); });
document.getElementById('zoomOut').addEventListener('click', () => { zoom = Math.max(MIN_ZOOM, zoom / 1.2); });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  zoom = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoom * (e.deltaY > 0 ? 0.9 : 1.1)));
}, { passive: false });
canvas.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX;
  orbitAngle += dx * 0.012; orbitDragVel = dx * 0.012; lastX = e.clientX;
});
canvas.addEventListener('pointerup', () => { dragging = false; });
</script>
</body>
</html>
