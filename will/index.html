<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WILL — Nara's Room</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0d0018; overflow: hidden; touch-action: none; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; }
  .controls { position: absolute; bottom: 80px; right: 20px; display: flex; flex-direction: column; gap: 10px; }
  .btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #9B59B660; background: rgba(155,89,182,0.15); color: #C880FF; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; font-family: monospace; }
  .back-btn { position: absolute; top: 20px; left: 20px; font-size: 12px; letter-spacing: 0.2em; color: #9B59B670; text-decoration: none; font-family: 'Courier New', monospace; padding: 8px 12px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="controls">
  <div class="btn" id="zoomIn">+</div>
  <div class="btn" id="zoomOut">−</div>
</div>
<a class="back-btn" href="../characters/">← ALL</a>

<script>
const HUE    = '#9B59B6';
const NAME   = 'WILL';
const ROLE   = 'KEYS';
const ABIL   = '🔭  DEEP RANGE  ·  +8% THREE POINT';
const SPRITE = '../assets/james_sprite.png';

const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0, zoom = 1.0;
const MIN_ZOOM = 0.4, MAX_ZOOM = 4.0;
let orbitAngle = 0;
const orbitSpeed = 0.007;
let frame = 0;
let activePointers = new Map();
let pinchStartDist = 0, pinchStartZoom = 1, orbitDragVel = 0;

const spr = new Image(); spr.src = SPRITE;

function resize() {
  const dpr = window.devicePixelRatio||1;
  canvas.width=window.innerWidth*dpr; canvas.height=window.innerHeight*dpr;
  canvas.style.width=window.innerWidth+'px'; canvas.style.height=window.innerHeight+'px';
  W=canvas.width; H=canvas.height;
}
window.addEventListener('resize',resize); resize();

function drawOverlay() { /* features baked into sprite */ }

function drawFrame() {
  ctx.clearRect(0,0,W,H);
  const dpr=window.devicePixelRatio||1, cx=W/2, cy=H/2, sprH=H*0.60;
  const grd=ctx.createRadialGradient(cx,cy,0,cx,cy,H*0.5);
  grd.addColorStop(0,HUE+'20');grd.addColorStop(0.6,HUE+'08');grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
  const sq=Math.abs(Math.cos(orbitAngle));
  ctx.save();ctx.translate(cx,cy+sprH*0.53);ctx.scale((sq*0.85+0.15)*zoom,0.3*zoom);
  ctx.beginPath();ctx.arc(0,0,sprH*0.2,0,Math.PI*2);
  ctx.fillStyle=`rgba(0,0,0,${0.18+0.15*sq})`;ctx.fill();ctx.restore();
  const bob=Math.sin(frame*0.045)*(H*0.008), charY=cy+sprH*0.5+bob;
  const facing=Math.cos(orbitAngle)>=0?1:-1, xScale=Math.max(0.14,Math.abs(Math.cos(orbitAngle)));
  ctx.save();ctx.translate(cx,charY);ctx.scale(zoom*xScale*facing,zoom);
  if(spr.complete&&spr.naturalWidth>0){
    const sW=sprH*spr.naturalWidth/spr.naturalHeight;
    ctx.shadowColor=HUE;ctx.shadowBlur=18*dpr;
    ctx.drawImage(spr,-sW/2,-sprH,sW,sprH);ctx.shadowBlur=0;
  }
  ctx.save();ctx.scale(sprH/175,sprH/175);drawOverlay();ctx.restore();
  ctx.restore();
  ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';
  const ns=Math.min(W*0.12,H*0.065,52*dpr);
  ctx.font=`900 ${ns}px 'Courier New',monospace`;ctx.letterSpacing='0.1em';
  ctx.fillStyle=HUE;ctx.shadowColor=HUE;ctx.shadowBlur=20*dpr;
  ctx.fillText(NAME,cx,H*0.08);ctx.shadowBlur=0;
  ctx.font=`${ns*0.38}px 'Courier New',monospace`;ctx.letterSpacing='0.28em';
  ctx.fillStyle=HUE+'AA';ctx.fillText(ROLE,cx,H*0.08+ns*0.72);
  ctx.font=`${ns*0.3}px 'Courier New',monospace`;ctx.letterSpacing='0.18em';
  ctx.fillStyle=HUE+'90';ctx.fillText(ABIL,cx,H*0.93);
  ctx.font=`${ns*0.24}px 'Courier New',monospace`;ctx.letterSpacing='0.18em';
  ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillText('DRAG TO ORBIT  ·  PINCH TO ZOOM',cx,H*0.97);
  ctx.restore();
}

function tick(){frame++;if(activePointers.size<2){orbitAngle+=orbitSpeed+orbitDragVel;orbitDragVel*=0.95;}drawFrame();requestAnimationFrame(tick);}
tick();

document.getElementById('zoomIn').addEventListener('click',()=>{zoom=Math.min(MAX_ZOOM,zoom*1.2);});
document.getElementById('zoomOut').addEventListener('click',()=>{zoom=Math.max(MIN_ZOOM,zoom/1.2);});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,zoom*(e.deltaY>0?0.9:1.1)));},{passive:false});
function getPinchDist(){const pts=[...activePointers.values()];return Math.hypot(pts[1].x-pts[0].x,pts[1].y-pts[0].y);}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===2){pinchStartDist=getPinchDist();pinchStartZoom=zoom;}});
canvas.addEventListener('pointermove',e=>{if(!activePointers.has(e.pointerId))return;const prev=activePointers.get(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(activePointers.size===2){const d=getPinchDist();if(pinchStartDist>0)zoom=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,pinchStartZoom*d/pinchStartDist));}else{const dx=e.clientX-prev.x;orbitAngle+=dx*0.014;orbitDragVel=dx*0.014;}});
canvas.addEventListener('pointerup',e=>{activePointers.delete(e.pointerId);pinchStartDist=0;});
canvas.addEventListener('pointercancel',e=>{activePointers.delete(e.pointerId);});
</script>
</body>
</html>
