<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NARA'S ROOM — HALF COURT HERO</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #1a0a3e;
  overflow: hidden;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
}
canvas {
  display: block;
  position: fixed;
  image-rendering: pixelated;
}
</style>
</head>
<body>
<canvas id="g"></canvas>
<script>
/* ═══════════════════════════════════════════════════════════════
   NARA'S ROOM: HALF COURT HERO  |  bandmusicgames.party
   2v2 half-court basketball · Lizzy McGuire cartoon style
   ═══════════════════════════════════════════════════════════════ */

// ── Canvas ──────────────────────────────────────────────────────
const canvas = document.getElementById('g');
const ctx    = canvas.getContext('2d');
const GW = 390, GH = 750;
canvas.width = GW; canvas.height = GH;

// ── Background image ────────────────────────────────────────────
const courtBg = new Image();
courtBg.src = 'assets/court_env.png';

// ── Character sprites ───────────────────────────────────────────
const sprites = {};
for (const id of ['nara', 'ethan', 'brendan', 'james']) {
  sprites[id] = new Image();
  sprites[id].src = `assets/${id}_sprite.png`;
}

let _scale = 1, _rotated = false;

function fitCanvas() {
  const lw = window.innerWidth, lh = window.innerHeight;
  _rotated = false;
  _scale = Math.min(lw / GW, lh / GH);
  const cw = GW * _scale, ch = GH * _scale;
  canvas.style.width  = cw + 'px';
  canvas.style.height = ch + 'px';
  canvas.style.left   = ((lw - cw) / 2) + 'px';
  canvas.style.top    = ((lh - ch) / 2) + 'px';
  canvas.style.transform = '';
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ── Constants ───────────────────────────────────────────────────
const FLOOR_Y       = 510;
const COURT_FAR_Y   = FLOOR_Y - 8;    // back of court (smaller characters)
const COURT_NEAR_Y  = FLOOR_Y + 42;   // front of court (larger characters)
const HOOP_X        = 352;
const RIM_Y         = 258;
const RIM_R         = 19;
const WIN_SCORE     = 11;
const SHOT_RANGE_3  = 210;
const SHOT_RANGE_2  = 130;
const SHOT_RANGE_LAY = 55;
// Shoot power sweet-spot (0–100)
const POWER_GREEN_LO = 52;
const POWER_GREEN_HI = 76;

// ── Character Definitions ───────────────────────────────────────
const CHARS = {
  nara: {
    name: 'NARA', role: 'VOCALS · GUITAR',
    skin: '#FDBCB4', hair: '#1C0A00', shirt: '#222222',
    pants: '#3366DD', shoes: '#2A2A2A', brow: '#3D0000',
    hairStyle: 'bob', hue: '#FF1493',
    quips: ['✨ SWISH!', '💖 YES!', '🎸 LFG!', '⭐ MONEY!']
  },
  ethan: {
    name: 'ETHAN', role: 'BASS',
    skin: '#C68642', hair: '#3D2B1F', shirt: '#32CD32',
    pants: '#1C1C2E', shoes: '#FFFFFF', brow: '#3D2B1F',
    hairStyle: 'long', hue: '#32CD32',
    quips: ['🎸 YEAH!', '💪 LOW!', '🏀 NICE!', '🔥 FIRE!']
  },
  brendan: {
    name: 'BRENDAN', role: 'DRUMS',
    skin: '#FDBCB4', hair: '#CC2200', shirt: '#FF6B35',
    pants: '#2D5A27', shoes: '#222', brow: '#CC2200',
    hairStyle: 'beanie', hue: '#FF6B35',
    quips: ['🥁 BOOM!', '🔥 BLOCKED!', '😤 MINE!', '💥 DENIED!']
  },
  james: {
    name: 'JAMES', role: 'KEYS',
    skin: '#8D5524', hair: '#111', shirt: '#9B59B6',
    pants: '#2C2C2C', shoes: '#9B59B6', brow: '#111',
    hairStyle: 'glasses', hue: '#9B59B6',
    quips: ['🎹 NICE!', '😎 EZ!', '💜 YES!', '🎯 PERFECT!']
  }
};
const TEAM_A_IDS = ['nara', 'ethan'];
const TEAM_B_IDS = ['brendan', 'james'];

// ── Drawing Helpers ─────────────────────────────────────────────
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function fillRR(x, y, w, h, r, fill, stroke, lw) {
  rr(x, y, w, h, r);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function circle(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

// ── State ───────────────────────────────────────────────────────
let S = null;

function mkPlayer(id, team, x, facing) {
  return {
    id, team, x,
    y: COURT_FAR_Y + 20,
    vx: 0, vy: 0,
    jumpY: 0, _jumpVy: 0,
    anim: 'idle', facing,
    hasBall: false,
    ai: team === 'b',
    aiTimer: Math.random() * 60,
  };
}

function initState() {
  S = {
    screen: 'title',
    frame: 0,
    score: [0, 0],
    possession: 'a',

    ball: { x: 100, y: FLOOR_Y - 30, vx: 0, vy: 0, inAir: false, carrier: 'nara' },

    players: {
      nara:    mkPlayer('nara',    'a', 100,  1),
      ethan:   mkPlayer('ethan',   'a', 175,  1),
      brendan: mkPlayer('brendan', 'b', 260, -1),
      james:   mkPlayer('james',   'b', 320, -1),
    },

    activeHuman: 'nara',

    // Thoughts / popups
    thoughts: [],

    // Joystick
    joy: { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 },

    // Hold-to-shoot / hold-to-block
    shootHeld: false,
    shootPower: 0,          // 0–100 fills while held on offense
    blockHeld: false,
    blockPower: 0,          // 0–100 fills while held on defense

    // Steal mash
    stealTaps: 0,
    lastStealTapTime: 0,

    // Double-tap pass
    passDoubleTapPending: false,
    lastPassTapTime: 0,

    // Score flash
    scoreFlash: null,
    pauseTimer: 0,
    scored: false,
  };

  S.players.nara.hasBall = true;
  S.ball.carrier = 'nara';
}

// ── Court Drawing ───────────────────────────────────────────────
function drawSky() {
  const g = ctx.createLinearGradient(0, 55, 0, FLOOR_Y);
  g.addColorStop(0, '#4A90C0');
  g.addColorStop(0.5, '#87CEEA');
  g.addColorStop(1, '#A8D8EA');
  ctx.fillStyle = g;
  ctx.fillRect(0, 55, GW, FLOOR_Y - 55);
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  for (const [x, y, r] of [[72,120,22],[98,110,26],[122,118,20],[50,124,17]]) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  for (const [x, y, r] of [[272,138,20],[295,128,24],[318,136,18],[252,142,15]]) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
}

function drawCrowd() {
  const baseY = FLOOR_Y - 8;
  const trees = [
    [20, 55], [58, 70], [96, 52], [138, 65],
    [178, 58], [218, 72], [256, 55], [294, 68],
    [332, 60], [368, 74],
  ];
  for (const [x, h] of trees) {
    const trunkH  = Math.round(h * 0.38);
    const crownRX = Math.round(h * 0.33);
    const crownRY = Math.round(h * 0.58);
    const crownY  = baseY - trunkH;
    ctx.fillStyle = '#2E1C0E';
    ctx.fillRect(x - 4, baseY - trunkH, 8, trunkH);
    ctx.fillStyle = '#174A0F';
    ctx.beginPath(); ctx.ellipse(x, crownY, crownRX, crownRY, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0F3009';
    ctx.beginPath(); ctx.ellipse(x + 6, crownY + 5, crownRX * 0.7, crownRY * 0.7, 0, 0, Math.PI*2); ctx.fill();
  }
}

function drawFloor() {
  const g = ctx.createLinearGradient(0, FLOOR_Y - 12, 0, FLOOR_Y + 60);
  g.addColorStop(0, '#3A7BC8');
  g.addColorStop(1, '#2A5BA8');
  ctx.fillStyle = g;
  ctx.fillRect(0, FLOOR_Y - 12, GW, 80);

  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, FLOOR_Y - 12); ctx.lineTo(GW, FLOOR_Y - 12); ctx.stroke();

  ctx.save();
  ctx.lineCap = 'round';

  ctx.fillStyle = 'rgba(255, 200, 0, 0.65)';
  ctx.fillRect(210, FLOOR_Y - 12, HOOP_X + 12 - 210, 60);

  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(210, FLOOR_Y - 12); ctx.lineTo(HOOP_X + 12, FLOOR_Y - 12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(210, FLOOR_Y - 12); ctx.lineTo(210, FLOOR_Y + 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(HOOP_X + 12, FLOOR_Y - 12); ctx.lineTo(HOOP_X + 12, FLOOR_Y + 40); ctx.stroke();

  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(HOOP_X + 12, FLOOR_Y - 12, SHOT_RANGE_3, Math.PI * 0.52, Math.PI, false);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(35, FLOOR_Y - 12, 24, 0, Math.PI, true); ctx.stroke();

  ctx.restore();
}

function drawHoop() {
  const hx = HOOP_X, bx = HOOP_X + 14;

  ctx.fillStyle = '#999';
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 1;
  ctx.fillRect(bx + 2, RIM_Y - 2, 5, FLOOR_Y - RIM_Y + 8);
  ctx.strokeRect(bx + 2, RIM_Y - 2, 5, FLOOR_Y - RIM_Y + 8);

  fillRR(bx, RIM_Y - 62, 13, 58, 2, '#FFFFFFEE', '#CCC', 1.5);
  ctx.strokeStyle = '#FF6600'; ctx.lineWidth = 2;
  ctx.strokeRect(bx + 2, RIM_Y - 38, 9, 24);

  ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx + 2, RIM_Y - 4); ctx.lineTo(hx, RIM_Y); ctx.stroke();

  ctx.strokeStyle = '#FF6600'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(bx, RIM_Y); ctx.lineTo(hx - RIM_R, RIM_Y); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(hx, RIM_Y, RIM_R, RIM_R * 0.3, 0, 0, Math.PI * 2); ctx.stroke();

  ctx.strokeStyle = '#FFF'; ctx.lineWidth = 1.2;
  const segs = 8, nh = 22;
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(hx + Math.cos(a) * RIM_R, RIM_Y + Math.sin(a) * RIM_R * 0.3);
    ctx.lineTo(hx + Math.cos(a) * RIM_R * 0.38, RIM_Y + nh);
    ctx.stroke();
  }
  for (let j = 1; j < 4; j++) {
    const t = j / 4, nr = RIM_R * (1 - t * 0.65), ny = RIM_Y + t * nh;
    ctx.beginPath(); ctx.ellipse(hx, ny, nr, nr * 0.25, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

// ── Character Drawing ────────────────────────────────────────────
function drawChar(id, hasBall) {
  const p   = S.players[id];
  const f   = S.frame;
  const jy  = p.jumpY;
  const spr = sprites[id];
  const { anim } = p;

  ctx.save();
  ctx.translate(p.x, p.y + jy);

  // Depth scale: characters near the camera appear slightly larger
  const depth = Math.max(0, Math.min(1, (p.y - COURT_FAR_Y) / (COURT_NEAR_Y - COURT_FAR_Y)));
  const dsc = 0.85 + depth * 0.22;
  ctx.scale(dsc * (p.facing < 0 ? -1 : 1), dsc);

  let scX = 1, scY = 1, bobY = 0, lean = 0;
  if (anim === 'idle') {
    bobY = Math.sin(f * 0.045) * 2.5;
  } else if (anim === 'run') {
    bobY = Math.abs(Math.sin(f * 0.28)) * -3.5;
    lean = Math.sin(f * 0.28) * 0.08;
    scX  = 1 + Math.sin(f * 0.56) * 0.02;
  } else if (anim === 'jump') {
    scX = 0.87; scY = 1.14;
  } else if (anim === 'land') {
    scX = 1.2; scY = 0.82; bobY = 5;
  } else if (anim === 'celebrate') {
    bobY = Math.abs(Math.sin(f * 0.18)) * -14;
    scX  = 1 + Math.abs(Math.sin(f * 0.18)) * 0.05;
  } else if (anim === 'shoot') {
    bobY = -8;
  } else if (anim === 'sad') {
    bobY = 5; scY = 0.94;
  }

  // Shadow
  ctx.save();
  const shadowW = (24 - Math.abs(jy) * 0.1) * scX;
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 4 - jy * 0.12, shadowW, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  ctx.scale(scX, scY);
  ctx.translate(0, bobY);
  if (lean) ctx.rotate(lean);

  if (spr && spr.complete && spr.naturalWidth > 0) {
    const H = 175;
    const W = H * spr.naturalWidth / spr.naturalHeight;
    ctx.drawImage(spr, -W / 2, -H, W, H);
  }

  if (hasBall) {
    const bx = anim === 'shoot' ? 18 : 30;
    const by = anim === 'shoot' ? -175 : -78;
    drawBallAt(bx, by, 13);
  }

  ctx.restore();
}

function drawFace(d, anim, hy, f) {
  const ey = hy - 2;
  let eyeW = 5, eyeH = 7;
  if (anim === 'celebrate') { eyeW = 7; eyeH = 10; }
  if (anim === 'sad')       { eyeH = 4; eyeW = 5; }
  if (anim === 'run')       { eyeH = 6; }

  for (const ex of [-6, 6]) {
    ctx.beginPath(); ctx.ellipse(ex, ey, eyeW, eyeH, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFF'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  const pupilOff = anim === 'sad' ? 0 : 1.5;
  for (const ex of [-6, 6]) {
    circle(ex + pupilOff, ey + 1, 2.5, '#000');
    circle(ex + pupilOff + 1, ey - 1, 1, '#FFF');
  }
  ctx.strokeStyle = d.brow; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const browYOff = anim === 'celebrate' ? -4 : anim === 'sad' ? 0 : -2;
  const browSlant = anim === 'sad' ? 0.22 : anim === 'celebrate' ? -0.14 : 0;
  for (const [ex, sl] of [[-6, browSlant], [6, -browSlant]]) {
    ctx.save(); ctx.translate(ex, ey - eyeH - 2 + browYOff); ctx.rotate(sl);
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.stroke();
    ctx.restore();
  }
  if (d.hairStyle === 'glasses') {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    for (const ex of [-6, 6]) {
      ctx.beginPath(); ctx.arc(ex, ey, eyeW + 2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(-6 + eyeW + 2, ey); ctx.lineTo(6 - eyeW - 2, ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6 - eyeW - 2, ey); ctx.lineTo(-6 - eyeW - 7, ey - 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6 + eyeW + 2, ey); ctx.lineTo(6 + eyeW + 7, ey - 1); ctx.stroke();
  }
  const my = hy + 9;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (anim === 'celebrate') {
    ctx.beginPath(); ctx.arc(0, my - 3, 7, 0.12, Math.PI - 0.12, false); ctx.stroke();
    rr(-6, my - 3, 12, 5, 3); ctx.fillStyle = '#FFFFFAe'; ctx.fill();
  } else if (anim === 'sad') {
    ctx.beginPath(); ctx.arc(0, my + 5, 6, Math.PI + 0.15, -0.15, false); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, my - 2, 4, 0.18, Math.PI - 0.18, false); ctx.stroke();
  }
  if (anim === 'celebrate' || d.name === 'NARA') {
    ctx.fillStyle = 'rgba(255,100,120,0.28)';
    ctx.beginPath(); ctx.ellipse(-10, my - 4, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, my - 4, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// ── Ball ─────────────────────────────────────────────────────────
function drawBallAt(x, y, r) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#E8751A'; ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(1.5, r * 0.12); ctx.stroke();

  const sw = Math.max(2, r * 0.17);
  ctx.strokeStyle = '#111'; ctx.lineWidth = sw; ctx.lineCap = 'round';

  ctx.beginPath();
  for (let i = -r * 0.8; i <= r * 0.8; i += 2) {
    const wave = Math.sin(i * 0.4) * 3;
    const px = x - r * 0.3 + wave;
    const py = y + i;
    if (i === -r * 0.8) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.beginPath();
  for (let i = -r * 0.8; i <= r * 0.8; i += 2) {
    const wave = Math.sin(i * 0.4 + Math.PI) * 3;
    const px = x + r * 0.3 + wave;
    const py = y + i;
    if (i === -r * 0.8) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.beginPath();
  for (let i = -r; i <= r; i += 2) {
    const wave = Math.sin(i * 0.5) * 2;
    const px = x + i;
    const py = y + wave;
    if (i === -r) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function drawBall() {
  const b = S.ball;
  if (b.carrier) return;

  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(b.x, FLOOR_Y + 4, 12 - (FLOOR_Y - b.y) * 0.04, 4, 0, 0, Math.PI * 2); ctx.fill();

  drawBallAt(b.x, b.y, 12);
}

// ── Power Indicator (hoop ring shows green zone) ──────────────────
function drawPowerIndicator() {
  if (S.possession !== 'a') return;
  const power = S.shootPower;
  if (power < 1) return;
  const inGreen = power >= POWER_GREEN_LO && power <= POWER_GREEN_HI;
  const alpha = 0.35 + (power / 100) * 0.5;
  const color = inGreen ? `rgba(0,255,136,${alpha})` : `rgba(255,200,0,${alpha})`;

  ctx.beginPath(); ctx.arc(HOOP_X, RIM_Y, RIM_R + 10, 0, Math.PI * 2);
  ctx.strokeStyle = color; ctx.lineWidth = inGreen ? 4 : 2.5;
  ctx.stroke();

  if (inGreen) {
    ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(HOOP_X, RIM_Y, RIM_R + 16, 0, Math.PI * 2); ctx.stroke();
  }
}

// ── Thoughts / Popups ────────────────────────────────────────────
function spawnThought(id, text) {
  const p = S.players[id];
  S.thoughts.push({
    x: p.x, y: p.y + p.jumpY - 120,
    text, ttl: 90, maxTtl: 90,
    dx: (Math.random() - 0.5) * 0.5,
  });
}

function drawThoughts() {
  for (const th of S.thoughts) {
    const alpha = Math.min(1, th.ttl / 20);
    const sc    = 1 + (1 - th.ttl / th.maxTtl) * 0.18;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(th.x, th.y);
    ctx.scale(sc, sc);

    const tw = ctx.measureText(th.text).width + 18;
    const th2 = 28;
    fillRR(-tw / 2, -th2 / 2, tw, th2, 12, '#FFFFFAEE', '#000', 2);
    ctx.beginPath();
    ctx.moveTo(-5, th2 / 2); ctx.lineTo(5, th2 / 2); ctx.lineTo(0, th2 / 2 + 10);
    ctx.closePath(); ctx.fillStyle = '#FFFFFAEE'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = '#111'; ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(th.text, 0, 0);
    ctx.restore();
  }
}

// ── HUD / Score Bar ──────────────────────────────────────────────
function drawHUD() {
  ctx.fillStyle = '#1a0a3e';
  ctx.fillRect(0, 0, GW, 55);

  ctx.fillStyle = CHARS.nara.hue;
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(S.score[0], 80, 28);

  ctx.fillStyle = CHARS.brendan.hue;
  ctx.fillText(S.score[1], GW - 80, 28);

  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(GW / 2 - 1, 8, 2, 38);

  ctx.font = '9px monospace'; ctx.letterSpacing = '0.12em';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('NARA\'S ROOM', 80, 47);
  ctx.fillText('ALL-STARS', GW - 80, 47);
  ctx.fillText('FIRST TO ' + WIN_SCORE, GW / 2, 28);

  if (S.scoreFlash && S.scoreFlash.ttl > 0) {
    const pct = S.scoreFlash.ttl / 70;
    ctx.save();
    ctx.globalAlpha = pct;
    ctx.font = `bold ${36 + (1 - pct) * 20}px monospace`;
    ctx.fillStyle = S.scoreFlash.color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(S.scoreFlash.text, GW / 2, 130);
    ctx.restore();
  }
}

// ── Controls UI ──────────────────────────────────────────────────
function drawControls() {
  const isAttacking = S.possession === 'a';
  const power  = isAttacking ? S.shootPower : S.blockPower;
  const isHeld = isAttacking ? S.shootHeld  : S.blockHeld;

  // Joystick zone (left)
  if (!S.joy.active) {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.beginPath(); ctx.arc(90, 650, 55, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.font = '10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('MOVE', 90, 650);
  } else {
    circle(S.joy.ox, S.joy.oy, 55, 'rgba(255,255,255,0.06)', 'rgba(255,255,255,0.2)', 1.5);
    const kx = S.joy.ox + S.joy.dx, ky = S.joy.oy + S.joy.dy;
    circle(kx, ky, 26, 'rgba(255,255,255,0.2)', 'rgba(255,255,255,0.4)', 2);
  }

  // Main action button (SHOOT / BLOCK) — hold to charge
  const actionLabel = isAttacking ? 'SHOOT' : 'BLOCK';
  const actionColor = isAttacking ? CHARS.nara.hue : '#00BFFF';
  const inGreen = isAttacking && power >= POWER_GREEN_LO && power <= POWER_GREEN_HI;
  const btnAlpha = isHeld ? 0.6 : 0.35;

  circle(300, 640, 42, `rgba(0,0,0,${btnAlpha})`, actionColor, 2.5);

  // Power arc fills clockwise
  if (isHeld && power > 0) {
    const startA = -Math.PI / 2;
    const endA   = startA + (power / 100) * Math.PI * 2;

    // Green zone hint arc (always visible while held on offense)
    if (isAttacking) {
      const gsA = startA + (POWER_GREEN_LO / 100) * Math.PI * 2;
      const geA = startA + (POWER_GREEN_HI / 100) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(300, 640, 48, gsA, geA);
      ctx.strokeStyle = 'rgba(0,255,136,0.3)';
      ctx.lineWidth = 9;
      ctx.stroke();
    }

    // Fill arc
    ctx.beginPath();
    ctx.arc(300, 640, 48, startA, endA);
    ctx.strokeStyle = inGreen ? '#00FF88' : actionColor;
    ctx.lineWidth = 5;
    ctx.stroke();
  }

  ctx.fillStyle = inGreen ? '#00FF88' : actionColor;
  ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(actionLabel, 300, 640);

  // Pass / Steal button (below)
  const passLabel  = isAttacking ? 'PASS' : 'STEAL';
  const passColor  = '#FFD700';
  circle(300, 710, 28, 'rgba(0,0,0,0.25)', passColor, 2);
  ctx.fillStyle = passColor;
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(passLabel, 300, 710);

  // Double-tap pass pending hint
  if (isAttacking && S.passDoubleTapPending) {
    ctx.fillStyle = 'rgba(255,215,0,0.9)';
    ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
    ctx.fillText('AGAIN!', 300, 692);
  }

  // Steal tap counter
  if (!isAttacking && S.stealTaps > 0) {
    ctx.fillStyle = 'rgba(255,215,0,0.9)';
    ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center';
    ctx.fillText('×' + S.stealTaps, 300, 692);
  }

  // Hold hint when button not pressed
  if (!isHeld) {
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.font = '8px monospace'; ctx.textAlign = 'center';
    ctx.fillText(isAttacking ? 'HOLD' : 'HOLD', 300, 658);
  }
}

// ── Input ────────────────────────────────────────────────────────
function toGameCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  if (!_rotated) {
    return {
      x: (clientX - rect.left) / _scale,
      y: (clientY - rect.top)  / _scale,
    };
  }
  // Canvas rotated 90° CW: center is always at (lw/2, lh/2) since we positioned it that way
  const cx = window.innerWidth  / 2;
  const cy = window.innerHeight / 2;
  return {
    x: GW / 2 - (clientY - cy) / _scale,
    y: GH / 2 + (clientX - cx) / _scale,
  };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const { x, y } = toGameCoords(t.clientX, t.clientY);

    if (S.screen === 'title' || S.screen === 'gameover') {
      if (S.screen === 'gameover') initState();
      S.screen = 'playing';
      return;
    }
    if (S.screen !== 'playing') return;

    const dShoot = Math.hypot(x - 300, y - 640);
    const dPass  = Math.hypot(x - 300, y - 710);

    if (dShoot < 52) {
      if (S.possession === 'a') {
        S.shootHeld = true;
        S.shootPower = 0;
        const ap = S.players[S.activeHuman];
        if (ap.hasBall) ap.anim = 'shoot';
      } else {
        S.blockHeld = true;
        S.blockPower = 0;
      }
      continue;
    }
    if (dPass < 38) {
      if (S.possession === 'a') {
        const now = Date.now();
        if (S.passDoubleTapPending && now - S.lastPassTapTime < 400) {
          S.passDoubleTapPending = false;
          handlePassAction();
        } else {
          S.passDoubleTapPending = true;
          S.lastPassTapTime = now;
        }
      } else {
        S.stealTaps++;
        S.lastStealTapTime = Date.now();
        handleStealMash();
      }
      continue;
    }

    // Left+centre area → joystick
    if (x < GW * 0.65 && !S.joy.active) {
      S.joy = { active: true, id: t.identifier, ox: x, oy: y, dx: 0, dy: 0 };
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === S.joy.id) {
      const { x, y } = toGameCoords(t.clientX, t.clientY);
      const maxR = 55;
      let dx = x - S.joy.ox, dy = y - S.joy.oy;
      const len = Math.hypot(dx, dy);
      if (len > maxR) { dx = dx / len * maxR; dy = dy / len * maxR; }
      S.joy.dx = dx; S.joy.dy = dy;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === S.joy.id) {
      S.joy = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
    }
    const { x, y } = toGameCoords(t.clientX, t.clientY);
    if (Math.hypot(x - 300, y - 640) < 52) {
      if (S.possession === 'a' && S.shootHeld) releaseShoot();
      else if (S.possession === 'b' && S.blockHeld) releaseBlock();
      S.shootHeld = false;
      S.blockHeld = false;
    }
  }
}, { passive: false });

// ── Keyboard support ─────────────────────────────────────────────
const KEYS = {};
window.addEventListener('keydown', e => {
  const wasDown = KEYS[e.code];
  KEYS[e.code] = true;
  if (S.screen === 'title' || S.screen === 'gameover') {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (S.screen === 'gameover') initState();
      S.screen = 'playing';
    }
    return;
  }
  if (S.screen !== 'playing') return;

  if (e.code === 'Space' && !wasDown) {
    e.preventDefault();
    if (S.possession === 'a') {
      S.shootHeld = true; S.shootPower = 0;
      const ap = S.players[S.activeHuman];
      if (ap.hasBall) ap.anim = 'shoot';
    } else {
      S.blockHeld = true; S.blockPower = 0;
    }
  }
  if (e.code === 'Enter' && !wasDown) {
    if (S.possession === 'a') {
      const now = Date.now();
      if (S.passDoubleTapPending && now - S.lastPassTapTime < 400) {
        S.passDoubleTapPending = false;
        handlePassAction();
      } else {
        S.passDoubleTapPending = true;
        S.lastPassTapTime = now;
      }
    } else {
      S.stealTaps++;
      S.lastStealTapTime = Date.now();
      handleStealMash();
    }
  }
});

window.addEventListener('keyup', e => {
  KEYS[e.code] = false;
  if (e.code === 'Space') {
    if (S.possession === 'a' && S.shootHeld) releaseShoot();
    else if (S.possession === 'b' && S.blockHeld) releaseBlock();
    S.shootHeld = false;
    S.blockHeld = false;
  }
});

// Apply keyboard arrows to joystick each frame
function applyKeyboard() {
  if (S.screen !== 'playing' || S.joy.active) return;
  const left  = KEYS['ArrowLeft']  || KEYS['KeyA'];
  const right = KEYS['ArrowRight'] || KEYS['KeyD'];
  const up    = KEYS['ArrowUp']    || KEYS['KeyW'];
  const down  = KEYS['ArrowDown']  || KEYS['KeyS'];
  if (left || right || up || down) {
    S.joy = {
      active: true, id: -2,
      ox: 0, oy: 0,
      dx: right ? 55 : left ? -55 : 0,
      dy: down  ? 55 : up   ? -55 : 0
    };
  } else if (S.joy.id === -2) {
    S.joy = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
  }
}

// ── Action Functions ──────────────────────────────────────────────
function releaseShoot() {
  if (!S.shootHeld) return;
  S.shootHeld = false;
  const ap = S.players[S.activeHuman];
  if (!ap.hasBall) { S.shootPower = 0; return; }
  const power = S.shootPower;
  S.shootPower = 0;
  if (power < 8) { ap.anim = 'idle'; return; } // too light, abort

  const dist = Math.abs(ap.x - HOOP_X);
  if (dist > SHOT_RANGE_3 + 20) { ap.anim = 'idle'; return; }

  const inGreen = power >= POWER_GREEN_LO && power <= POWER_GREEN_HI;
  let acc;
  if (inGreen)       acc = 0.88;
  else if (power < 30) acc = 0.12;
  else if (power > 90) acc = 0.32; // overpowered
  else                 acc = 0.38 + (power / 100) * 0.30;

  const made = Math.random() < acc;
  ap.anim = 'shoot';
  ap.hasBall = false;
  S.ball.carrier = null;
  fireBallShot(ap.x, ap.y + ap.jumpY - 55, made, dist);
  S.ball._fromX = ap.x;
  setTimeout(() => {
    if (S.players[ap.id] && S.players[ap.id].anim === 'shoot')
      S.players[ap.id].anim = 'idle';
  }, 400);
}

function releaseBlock() {
  if (!S.blockHeld) return;
  S.blockHeld = false;
  const ap = S.players[S.activeHuman];
  const power = S.blockPower;
  S.blockPower = 0;
  if (power < 5) return;

  // Jump height proportional to hold duration
  ap._jumpVy = -(4.5 + power * 0.085);
  ap.jumpY = 0;
  ap.anim = 'jump';
  spawnThought(S.activeHuman, '✋');

  // Attempt block at jump peak
  setTimeout(() => { tryBlock(); }, 260);
}

function handlePassAction() {
  if (S.possession !== 'a') return;
  const ap = S.players[S.activeHuman];
  if (!ap.hasBall) return;
  const teammate = S.activeHuman === 'nara' ? 'ethan' : 'nara';
  const tp = S.players[teammate];

  ap.hasBall = false;
  ap.anim = 'idle';
  S.ball.carrier = null;
  S.ball.inAir = true;
  S.ball.x = ap.x; S.ball.y = ap.y - 50;
  const dx = tp.x - ap.x, dy = (tp.y - 55) - (ap.y - 50);
  S.ball.vx = dx / 16; S.ball.vy = dy / 16 - 3;
  S.ball._pass = true;
  S.ball._passTarget = teammate;

  S.activeHuman = teammate;
  spawnThought(teammate, '🏀');
}

function handleStealMash() {
  const ap = S.players[S.activeHuman];
  const carriers = TEAM_B_IDS.filter(id => S.players[id].hasBall);
  if (!carriers.length) return;
  const carrier = S.players[carriers[0]];
  const dist = Math.hypot(ap.x - carrier.x, ap.y - carrier.y);
  if (dist > 70) {
    if (S.stealTaps === 1) spawnThought(S.activeHuman, 'TOO FAR');
    return;
  }
  // Each consecutive tap within window boosts odds
  const tapBonus  = Math.min(S.stealTaps, 7) * 0.08;
  const success   = Math.random() < 0.15 + tapBonus;

  if (success) {
    carrier.hasBall = false; carrier.anim = 'sad';
    S.ball.carrier = S.activeHuman;
    S.players[S.activeHuman].hasBall = true;
    S.players[S.activeHuman].anim = 'celebrate';
    S.possession = 'a';
    S.stealTaps = 0;
    spawnThought(S.activeHuman, CHARS[S.activeHuman].quips[2]);
  } else if (S.stealTaps <= 2) {
    spawnThought(S.activeHuman, '🤚');
  }
}

function tryBlock() {
  const shooter = TEAM_B_IDS.find(id => S.players[id].anim === 'shoot');
  if (!shooter) return;
  const ap   = S.players[S.activeHuman];
  const bp   = S.players[shooter];
  const dist = Math.hypot(ap.x - bp.x, ap.y - bp.y);
  if (dist < 90) {
    if (S.ball.inAir) { S.ball.vx *= -0.5; S.ball.vy = -8; }
    spawnThought(S.activeHuman, '🛡 BLOCK!');
    bp.anim = 'sad';
  }
}

// ── Physics Update ────────────────────────────────────────────────
function updateBall() {
  const b = S.ball;
  if (b.carrier) {
    const cp = S.players[b.carrier];
    b.x = cp.x + cp.facing * 18;
    b.y = cp.y + cp.jumpY - 48;
    return;
  }
  if (!b.inAir) return;

  b.vy += 0.45;
  b.x += b.vx; b.y += b.vy;
  if (b._t !== undefined) b._t++;

  const distToRim = Math.hypot(b.x - HOOP_X, b.y - RIM_Y);
  if (distToRim < RIM_R + 10 && b.vy > 0 && b.y < RIM_Y + 20) {
    if (b._made && distToRim < RIM_R + 6) {
      scorePoint();
      return;
    } else if (distToRim < RIM_R + 3) {
      b.vx = (Math.random() - 0.5) * 6;
      b.vy = -5;
      b._made = false;
    }
  }

  // Pass target catch
  if (b._pass) {
    const target = S.players[b._passTarget];
    if (target && Math.hypot(b.x - target.x, b.y - (target.y - 50)) < 40) {
      b.carrier = b._passTarget;
      target.hasBall = true;
      target.anim = 'idle';
      b.inAir = false; b._pass = false; b._passTarget = null;
      return;
    }
  }

  if (b.y >= FLOOR_Y - 10) {
    b.y = FLOOR_Y - 10;
    if (b._made === false || !b._made) turnoverToCPU();
    b.vy = -b.vy * 0.45;
    b.vx *= 0.7;
    if (Math.abs(b.vy) < 1.5) {
      b.inAir = false; b.vy = 0; b.vx = 0;
      if (!b.carrier) turnoverToCPU();
    }
  }

  if (b.x < -30) turnoverToCPU();
}

function scorePoint() {
  const b = S.ball;
  const dist = Math.abs((b._fromX || S.players[S.activeHuman]?.x || 100) - HOOP_X);
  const pts  = dist > SHOT_RANGE_2 ? 3 : 2;
  const team = S.possession;

  S.score[team === 'a' ? 0 : 1] += pts;

  const scorer = team === 'a' ? S.activeHuman : TEAM_B_IDS.find(id => S.players[id].hasBall) || 'brendan';
  spawnThought(scorer, CHARS[scorer].quips[Math.floor(Math.random() * 4)]);

  S.scoreFlash = {
    text: pts + ' PTS!' + (pts === 3 ? ' 🔥' : ''),
    color: team === 'a' ? CHARS.nara.hue : CHARS.brendan.hue,
    ttl: 70
  };

  const teamIds = team === 'a' ? TEAM_A_IDS : TEAM_B_IDS;
  const loseIds = team === 'a' ? TEAM_B_IDS : TEAM_A_IDS;
  for (const id of teamIds) S.players[id].anim = 'celebrate';
  for (const id of loseIds) S.players[id].anim = 'sad';

  resetBallAfterScore(team === 'a' ? 'b' : 'a');

  if (S.score[0] >= WIN_SCORE || S.score[1] >= WIN_SCORE) {
    setTimeout(() => { S.screen = 'gameover'; }, 1500);
  }
}

function resetBallAfterScore(nextPossession) {
  S.possession = nextPossession;
  const carrier = nextPossession === 'a' ? 'nara' : 'brendan';

  // Reset hold state
  S.shootHeld = false; S.shootPower = 0;
  S.blockHeld = false; S.blockPower = 0;
  S.passDoubleTapPending = false;
  S.stealTaps = 0;

  for (const id of TEAM_A_IDS.concat(TEAM_B_IDS)) {
    if (S.players[id].anim === 'celebrate' || S.players[id].anim === 'sad') {
      setTimeout(() => { if (S.players[id]) S.players[id].anim = 'idle'; }, 1000);
    }
  }

  for (const id of TEAM_A_IDS.concat(TEAM_B_IDS)) {
    S.players[id].jumpY = 0; S.players[id]._jumpVy = 0;
    S.players[id].hasBall = false;
    S.players[id].y = COURT_FAR_Y + 20;
  }

  if (nextPossession === 'a') {
    S.players.nara.x = 80;    S.players.ethan.x   = 150;
    S.players.brendan.x = 230; S.players.james.x   = 300;
  } else {
    S.players.brendan.x = 80;  S.players.james.x   = 155;
    S.players.nara.x = 240;    S.players.ethan.x   = 305;
  }

  S.ball.inAir   = false;
  S.ball.x       = 80;
  S.ball.y       = FLOOR_Y - 30;
  S.ball.vx      = 0; S.ball.vy = 0;
  S.ball.carrier = carrier;
  S.ball._made   = undefined;
  S.players[carrier].hasBall = true;
  S.activeHuman = 'nara';
}

function turnoverToCPU() {
  if (S.possession === 'b') return;
  S.possession = 'b';
  S.ball.inAir = false;
  S.ball.vx = 0; S.ball.vy = 0;
  S.ball.carrier = 'brendan';
  S.players.brendan.hasBall = true;
  S.players.nara.hasBall = false;
  S.players.ethan.hasBall = false;
  S.ball._made = undefined;
  S.shootHeld = false; S.shootPower = 0;
  S.passDoubleTapPending = false;
}

// ── Player Movement Update ────────────────────────────────────────
function updatePlayers() {
  // Expire double-tap and steal-mash windows
  const now = Date.now();
  if (S.passDoubleTapPending && now - S.lastPassTapTime > 500) {
    S.passDoubleTapPending = false;
  }
  if (S.stealTaps > 0 && now - S.lastStealTapTime > 700) {
    S.stealTaps = 0;
  }

  // Jump physics for all players
  for (const id of TEAM_A_IDS.concat(TEAM_B_IDS)) {
    const p = S.players[id];
    if (p._jumpVy !== 0) {
      p.jumpY   += p._jumpVy;
      p._jumpVy += 0.65;
      if (p.jumpY >= 0) {
        p.jumpY = 0; p._jumpVy = 0;
        if (p.anim === 'jump') {
          p.anim = 'land';
          const pid = id;
          setTimeout(() => {
            if (S.players[pid] && S.players[pid].anim === 'land')
              S.players[pid].anim = 'idle';
          }, 200);
        }
      }
    }
  }

  if (S.possession === 'a') {
    updateAIDefense();
    const ap  = S.players[S.activeHuman];
    const spd = 3.5;

    if (S.joy.active) {
      const jNorm = Math.hypot(S.joy.dx, S.joy.dy);
      if (jNorm > 8) {
        ap.vx = (S.joy.dx / 55) * spd;
        ap.vy = (S.joy.dy / 55) * spd * 0.6; // y-axis (depth)
        if (Math.abs(S.joy.dx) > 6) ap.facing = S.joy.dx > 0 ? 1 : -1;
        ap.anim = 'run';
      } else {
        ap.vx = 0; ap.vy = 0;
        ap.anim = 'idle';
      }
    } else {
      ap.vx = 0; ap.vy = 0;
      ap.anim = 'idle';
    }

    ap.x = Math.max(20, Math.min(300, ap.x + ap.vx));
    ap.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, ap.y + ap.vy));

    // Teammate auto-positions for support
    const teammate = S.activeHuman === 'nara' ? 'ethan' : 'nara';
    const tp = S.players[teammate];
    const targetX = ap.hasBall ? ap.x + 65 : ap.x - 55;
    const tdx = targetX - tp.x;
    if (Math.abs(tdx) > 8) {
      tp.x += Math.sign(tdx) * 2;
      tp.anim = 'run';
      tp.facing = tdx > 0 ? 1 : -1;
    } else {
      tp.anim = 'idle';
    }
    tp.x = Math.max(20, Math.min(300, tp.x));

  } else {
    // CPU offense
    updateAI();
    // Human defends — full 2D movement
    const ap  = S.players[S.activeHuman];
    const spd = 3;
    if (S.joy.active) {
      const jNorm = Math.hypot(S.joy.dx, S.joy.dy);
      if (jNorm > 8) {
        ap.vx = (S.joy.dx / 55) * spd;
        ap.vy = (S.joy.dy / 55) * spd * 0.6;
        if (Math.abs(S.joy.dx) > 6) ap.facing = S.joy.dx > 0 ? 1 : -1;
        ap.anim = 'run';
      } else { ap.vx = 0; ap.vy = 0; ap.anim = 'idle'; }
    } else { ap.vx = 0; ap.vy = 0; ap.anim = 'idle'; }
    ap.x = Math.max(20, Math.min(350, ap.x + ap.vx));
    ap.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, ap.y + ap.vy));

    // Second team A player auto-defends near paint
    const teammate = S.activeHuman === 'nara' ? 'ethan' : 'nara';
    const tp2 = S.players[teammate];
    const rimGuard = Math.max(20, HOOP_X - 80);
    const td2 = rimGuard - tp2.x;
    if (Math.abs(td2) > 8) { tp2.x += Math.sign(td2) * 1.5; tp2.anim = 'run'; tp2.facing = td2 > 0 ? 1 : -1; }
    else tp2.anim = 'idle';
    tp2.x = Math.max(20, Math.min(350, tp2.x));
  }

  // Always face hoop when on offense and not actively steering
  if (S.possession === 'a') {
    const ap = S.players[S.activeHuman];
    if (!S.joy.active) ap.facing = 1;
  }
}

// ── AI Logic ──────────────────────────────────────────────────────
function updateAIDefense() {
  // CPU team B defends while human has the ball
  const brendan = S.players.brendan;
  const james   = S.players.james;
  const carrier = S.players[S.activeHuman];

  brendan.aiTimer++;
  james.aiTimer++;

  // Brendan pressures the ball carrier (pick + steal threat)
  const targetBX = Math.min(carrier.x - 35, HOOP_X - 45);
  const bDx = targetBX - brendan.x;
  const bDy = carrier.y - brendan.y;
  if (Math.abs(bDx) > 8) {
    brendan.x += Math.sign(bDx) * 2.0;
    brendan.anim = 'run';
    brendan.facing = bDx > 0 ? 1 : -1;
  } else {
    brendan.anim = 'idle';
  }
  if (Math.abs(bDy) > 8) brendan.y += Math.sign(bDy) * 1.2;
  brendan.x = Math.max(20, Math.min(340, brendan.x));
  brendan.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, brendan.y));

  // Pick behavior: if carrier walks into Brendan, push them back slightly
  const distToBrendan = Math.hypot(carrier.x - brendan.x, carrier.y - brendan.y);
  if (distToBrendan < 32 && carrier.vx !== 0) {
    carrier.x -= carrier.vx * 0.55;
  }

  // James guards the paint
  const targetJX = HOOP_X - 65;
  const jDx = targetJX - james.x;
  if (Math.abs(jDx) > 8) {
    james.x += Math.sign(jDx) * 1.6;
    james.anim = 'run';
    james.facing = jDx > 0 ? 1 : -1;
  } else {
    james.anim = 'idle';
  }

  // AI jump-block when human is charging shot
  if (S.shootHeld && S.shootPower > 25) {
    const distJ = Math.hypot(carrier.x - james.x, carrier.y - james.y);
    const nearest = distToBrendan < distJ ? brendan : james;
    if (nearest._jumpVy === 0 && nearest.jumpY === 0 && nearest.aiTimer > 30) {
      nearest.aiTimer = 0;
      nearest._jumpVy = -9;
      nearest.anim = 'jump';
    }
  }

  // AI steal attempt when Brendan is close
  if (distToBrendan < 55 && brendan.aiTimer > 60) {
    brendan.aiTimer = 0;
    const success = Math.random() < 0.20;
    if (success && carrier.hasBall) {
      carrier.hasBall = false;
      S.ball.carrier = 'brendan';
      brendan.hasBall = true;
      S.possession = 'b';
      S.shootHeld = false; S.shootPower = 0;
      S.passDoubleTapPending = false;
      spawnThought('brendan', '😤 STEAL!');
    }
  }
}

function updateAI() {
  const brendan = S.players.brendan;
  const james   = S.players.james;

  brendan.aiTimer++;
  james.aiTimer++;

  if (brendan.hasBall) {
    brendan.facing = brendan.x < HOOP_X ? 1 : -1;
    // Drive and then pass to James
    const targetX = HOOP_X - 80;
    const dx = targetX - brendan.x;
    if (Math.abs(dx) > 10) {
      brendan.x += Math.sign(dx) * 2.2;
      brendan.anim = 'run';
    } else {
      brendan.anim = 'idle';
    }
    brendan.x = Math.max(20, Math.min(295, brendan.x));

    // Pass to James after a short drive
    if (brendan.aiTimer > 45 + Math.random() * 30) {
      brendan.aiTimer = 0;
      brendan.hasBall = false;
      S.ball.carrier = null;
      S.ball.inAir = true;
      S.ball.x = brendan.x; S.ball.y = brendan.y - 50;
      const pdx = james.x - brendan.x;
      const pdy = (james.y - 55) - (brendan.y - 50);
      S.ball.vx = pdx / 16; S.ball.vy = pdy / 16 - 3;
      S.ball._pass = true;
      S.ball._passTarget = 'james';
      spawnThought('james', '🏀');
    }

  } else if (james.hasBall) {
    james.facing = james.x < HOOP_X ? 1 : -1;
    const targetX = HOOP_X - 55;
    const dx = targetX - james.x;
    if (Math.abs(dx) > 10) {
      james.x += Math.sign(dx) * 2.0;
      james.anim = 'run';
    } else {
      james.anim = 'idle';
      // James shoots after positioning
      if (james.aiTimer > 55 + Math.random() * 40) {
        james.aiTimer = 0;
        aiShoot(james);
      }
    }
    james.x = Math.max(20, Math.min(295, james.x));

  } else {
    // No one has the ball — support positions
    const target_b = HOOP_X - 120;
    const target_j = HOOP_X - 160;
    if (Math.abs(brendan.x - target_b) > 8) {
      brendan.x += Math.sign(target_b - brendan.x) * 1.5;
      brendan.anim = 'run'; brendan.facing = target_b > brendan.x ? 1 : -1;
    } else brendan.anim = 'idle';
    if (Math.abs(james.x - target_j) > 8) {
      james.x += Math.sign(target_j - james.x) * 1.5;
      james.anim = 'run'; james.facing = target_j > james.x ? 1 : -1;
    } else james.anim = 'idle';
  }
}

function aiShoot(p) {
  const dist = Math.abs(p.x - HOOP_X);
  const acc  = dist < SHOT_RANGE_LAY ? 0.75 : dist < SHOT_RANGE_2 ? 0.55 : 0.35;
  const made = Math.random() < acc;

  p.anim = 'shoot';
  p.hasBall = false;
  S.ball.carrier = null;
  fireBallShot(p.x, p.y - 55, made, dist);
  S.ball._fromX = p.x;

  const pid = p.id;
  setTimeout(() => {
    if (S.players[pid] && S.players[pid].anim === 'shoot') S.players[pid].anim = 'idle';
  }, 600);

  if (!made) {
    setTimeout(() => {
      if (S.possession === 'b' && !S.ball.carrier) {
        S.possession = 'a';
        S.ball.carrier = 'nara';
        S.players.nara.hasBall = true;
        S.players.brendan.hasBall = false;
        S.players.james.hasBall = false;
        S.ball.inAir = false;
        S.ball.x = S.players.nara.x;
        S.ball.y = FLOOR_Y - 30;
        spawnThought('nara', '🏀 REBOUND!');
      }
    }, 1800);
  }
}

function fireBallShot(fromX, fromY, made, dist) {
  const b = S.ball;
  b.inAir = true;
  b.carrier = null;

  const dx    = HOOP_X - fromX;
  const dy    = RIM_Y - fromY;
  const tFly  = 35 + dist * 0.08;
  const drift = made ? 0 : (Math.random() - 0.5) * 35;

  b.x   = fromX; b.y = fromY;
  b.vx  = (dx + drift) / tFly;
  b.vy  = (dy - 140) / tFly;
  b._tFly  = tFly;
  b._t     = 0;
  b._made  = made;
  b._fromX = fromX;
  b._dy    = dy;
  b._dx    = dx + drift;
}

// ── Shoot Power Update ────────────────────────────────────────────
function updateShootPower() {
  if (S.possession === 'a' && S.shootHeld) {
    S.shootPower = Math.min(100, S.shootPower + 1.5);
    if (S.shootPower >= 100) releaseShoot();
  } else if (S.possession === 'b' && S.blockHeld) {
    S.blockPower = Math.min(100, S.blockPower + 2.5);
    if (S.blockPower >= 100) releaseBlock();
  }
}

// ── Thoughts Update ───────────────────────────────────────────────
function updateThoughts() {
  for (let i = S.thoughts.length - 1; i >= 0; i--) {
    S.thoughts[i].ttl--;
    S.thoughts[i].x += S.thoughts[i].dx;
    S.thoughts[i].y -= 0.4;
    if (S.thoughts[i].ttl <= 0) S.thoughts.splice(i, 1);
  }
}

// ── Score Flash Update ────────────────────────────────────────────
function updateScoreFlash() {
  if (S.scoreFlash && S.scoreFlash.ttl > 0) S.scoreFlash.ttl--;
}

// ── Main Game Loop ────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  S.frame++;

  ctx.clearRect(0, 0, GW, GH);

  if (S.screen === 'title') {
    drawTitle();
    return;
  }

  if (S.screen === 'gameover') {
    drawGameOver();
    return;
  }

  // ── Update ──────────────────────────────────────────────────────
  applyKeyboard();
  updatePlayers();
  updateBall();
  updateShootPower();
  updateThoughts();
  updateScoreFlash();

  // ── Draw ────────────────────────────────────────────────────────
  if (courtBg.complete && courtBg.naturalWidth > 0) {
    ctx.drawImage(courtBg, 0, 0, GW, FLOOR_Y + 30);
  } else {
    drawSky();
    drawCrowd();
  }
  drawFloor();
  drawHoop();

  // Draw characters back-to-front by court depth
  const allIds = [...TEAM_A_IDS, ...TEAM_B_IDS];
  allIds.sort((a, b) => S.players[a].y - S.players[b].y);
  for (const id of allIds) {
    drawChar(id, S.players[id].hasBall);
  }

  drawBall();
  drawPowerIndicator();
  drawThoughts();
  drawHUD();
  drawControls();

  // Possession indicator
  if (S.possession === 'a') {
    ctx.fillStyle = CHARS.nara.hue;
    ctx.font = '9px monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('▶ YOUR BALL', 10, 42);
  } else {
    ctx.fillStyle = CHARS.brendan.hue;
    ctx.font = '9px monospace'; ctx.textAlign = 'right';
    ctx.fillText('CPU BALL ◀', GW - 10, 42);
  }
}

// ── Boot ─────────────────────────────────────────────────────────
initState();
loop();
</script>
