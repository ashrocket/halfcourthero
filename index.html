  const carriers = TEAM_B_IDS.filter(id => S.players[id].hasBall);
  if (!carriers.length) return;
  const carrier = S.players[carriers[0]];
  const dist = Math.hypot(ap.x - carrier.x, ap.y - carrier.y);
  
  ap.anim = 'jump';
  ap._stealCooldown = 45; // ~0.75s
  ap._stealRing = 12; // visual ring frames

  // Ethan's lockdown ability gives wider steal range
  const stealRange = 60 * (1 + (CHARS[S.activeHuman]._stealBonus || 0));
  if (dist < stealRange) {
    // Catch-up boost: easier to steal when losing
    const catchup = (S.score[1] - S.score[0]) >= 3 ? 1.18 : 1.0;
    const success = Math.random() < 0.45 * catchup;
    if (success) {
      carrier.hasBall = false; carrier.anim = 'sad';
      S.ball.carrier = S.activeHuman;
      S.players[S.activeHuman].hasBall = true;
      S.players[S.activeHuman].anim = 'celebrate';
      S.possession = 'a';
      spawnThought(S.activeHuman, CHARS[S.activeHuman].quips[2]);
      sfxSteal();
      S.stats.steals++;
      S._fastBreak = 150;
    } else {
      spawnThought(S.activeHuman, '❌ MISS');
      sfxMiss();
    }
  } else if (dist < stealRange + 20) {
    spawnThought(S.activeHuman, 'TOO FAR');
  }
}

function tryBlock() {
  const shooter = TEAM_B_IDS.find(id => S.players[id].anim === 'shoot');
  if (!shooter) return;
  const bp = S.players[shooter];
  // Either active player OR teammate can block if close enough
  const blocker = TEAM_A_IDS
    .map(id => ({ id, dist: Math.hypot(S.players[id].x - bp.x, S.players[id].y - bp.y) }))
    .sort((a, b) => a.dist - b.dist)[0];
  const ap = S.players[blocker.id];
  const dist = blocker.dist;
  if (dist < 90) {
    if (S.ball.inAir) {
      S.ball.vx = (Math.random() - 0.5) * 8;
      S.ball.vy = -10;
      S.ball._made = false;
    }
    spawnThought(blocker.id, '🛡 BLOCK!');
    sfxSteal();
    S.stats.blocks++;
    S.shake = 8;
    bp.anim = 'sad';
    S.scoreFlash = { text: '🛡 BLOCKED!', color: CHARS[blocker.id].hue, ttl: 55 };
    if (navigator.vibrate) navigator.vibrate([20, 10, 40]);
    // Confetti burst for the block
    for (let i = 0; i < 15; i++) {
      S.confetti.push({
        x: ap.x + (Math.random() - 0.5) * 20,
        y: ap.y - 80,
        vx: (Math.random() - 0.5) * 8, vy: -Math.random() * 6 - 2,
        color: CHARS[ap.id].hue, size: 5 + Math.random() * 4,
        ttl: 35 + Math.floor(Math.random() * 20),
        rot: Math.random() * Math.PI * 2, dRot: (Math.random() - 0.5) * 0.4,
      });
    }
  }
}

// ── Physics Update ────────────────────────────────────────────────
function updateBall() {
  const b = S.ball;
  if (b.carrier) {
    const cp = S.players[b.carrier];
    const dribble = cp.anim === 'run' ? Math.abs(Math.sin(S.frame * 0.28)) * 18 : 8;
    b.x = cp.x + cp.facing * 18;
    b.y = cp.y + cp.jumpY - 48 + dribble;
    return;
  }
  if (!b.inAir) return;

  // Slight slow-mo near rim on perfect shots for drama
  const nearRim = Math.hypot(b.x - HOOP_X, b.y - RIM_Y) < 60;
  const slowFactor = (b._perfect && nearRim) ? 0.65 : 1;
  b.vy += 0.45 * slowFactor;
  b.x += b.vx * slowFactor; b.y += b.vy * slowFactor;
  b.rot = (b.rot || 0) + b.vx * 0.07;
  S.ballTrail.push({ x: b.x, y: b.y });
  if (S.ballTrail.length > 8) S.ballTrail.shift();
  if (b._t !== undefined) b._t++;

  const distToRim = Math.hypot(b.x - HOOP_X, b.y - RIM_Y);
  if (distToRim < RIM_R + 10 && b.vy > 0 && b.y < RIM_Y + 20) {
    if (b._made && distToRim < RIM_R + 6) {
      if (!b._rimHit) sfxSwish();
      scorePoint();
      return;
    } else if (distToRim < RIM_R + 3) {
      b.vx = (Math.random() - 0.5) * 6;
      b.vy = -5;
      b._made = false;
      b._rimHit = true;
      sfxRimHit();
      if (S.possession === 'a') {
        setTimeout(() => sfxCrowdOoh(), 200);
        S.shake = Math.max(S.shake, 4);
        if (Math.random() < 0.55) setTimeout(() => spawnThought(S.activeHuman, '😤 SO CLOSE!'), 160);
      }
      // Rim spark particles
      for (let i = 0; i < 5; i++) {
        S.confetti.push({ x: HOOP_X, y: RIM_Y, vx: (Math.random()-0.5)*5, vy: -Math.random()*4-1, color: '#FF8800', size: 2.5, ttl: 18, rot: 0, dRot: 0.2 });
      }
    }
  }

  // Pass target catch
  if (b._pass) {
    const target = S.players[b._passTarget];
    if (target && Math.hypot(b.x - target.x, b.y - (target.y - 50)) < 55) {
      // Alley-oop catch — auto-dunk!
      if (b._alleyOop && target.x > HOOP_X - 75) {
        const aloopId = b._passTarget;
        const dist = Math.abs(target.x - HOOP_X);
        b._pass = false; b._alleyOop = false; b._passTarget = null; b.carrier = null;
        target.anim = 'shoot'; target._jumpVy = -10;
        fireBallShot(target.x, target.y - 70, true, dist);
        S.ball._fromX = target.x;
        S.stats.shots++;
        S.scoreFlash = { text: '🙌 ALLEY-OOP!', color: CHARS[aloopId].hue, ttl: 90 };
        spawnThought(aloopId, '💥 DUNK!');
        sfxAlleyOop();
        spawnCrowdBurst([CHARS[TEAM_A_IDS[0]].hue, CHARS[TEAM_A_IDS[1]].hue, '#FFD700', '#FF8C00', '#FFF']);
        if (navigator.vibrate) navigator.vibrate([30, 20, 60]);
        return;
      }
      b.carrier = b._passTarget;
      target.hasBall = true;
      target.anim = 'idle';
      b.inAir = false; b._pass = false; b._passTarget = null;
      // Catch-and-shoot window: brief frame counter for accuracy bonus
      if (TEAM_A_IDS.includes(b._passTarget || b.carrier)) {
        target._catchFrame = S.frame;
      }
      return;
    }
    // Defenders can intercept passes that fly close to them
    const defTeam = S.possession === 'a' ? TEAM_B_IDS : TEAM_A_IDS;
    for (const def of defTeam) {
      if (def === b._passTarget) continue;
      const dp = S.players[def];
      const distToPass = Math.hypot(b.x - dp.x, b.y - (dp.y - 35));
      if (distToPass < 42) {
        const pickRate = S._difficulty === 'easy' ? 0.007 : S._difficulty === 'hard' ? 0.022 : 0.013;
        if (Math.random() < pickRate) {
          b.inAir = false; b._pass = false; b._passTarget = null;
          b.carrier = def; dp.hasBall = true;
          S.possession = S.possession === 'a' ? 'b' : 'a';
          spawnThought(def, '😤 PICK!');
          sfxSteal();
          if (S.possession === 'a') S._fastBreak = 120;
          return;
        }
      } else if (distToPass < 65 && S.possession === 'b' && TEAM_A_IDS.includes(def)) {
        // Visual interception opportunity hint
        if (S.frame % 8 === 0) {
          S.confetti.push({ x: dp.x, y: dp.y - 20, vx: 0, vy: -0.8, color: '#FFD700', size: 2, ttl: 8, rot: 0, dRot: 0 });
        }
      }
    }
  }

  if (b.y >= FLOOR_Y - 10) {
    b.y = FLOOR_Y - 10;
    b.vy = -b.vy * 0.45;
    b.vx *= 0.7;
    if (Math.abs(b.vy) < 1.5) {
      b.inAir = false; b.vy = 0; b.vx = 0;
      if (!b.carrier) {
        // Contested rebound: closest player to ball gets it
        const all = TEAM_A_IDS.concat(TEAM_B_IDS)
          .map(id => ({ id, dist: Math.hypot(S.players[id].x - b.x, S.players[id].y - b.y) }))
          .sort((a, c) => a.dist - c.dist);
        const closest = all[0];
        // If human missed, track cold streak and reset hot hand
        if (S.possession === 'a' && !b._made && b._fromX !== undefined) {
          S._coldStreak = (S._coldStreak || 0) + 1;
          if (S._coldStreak >= 3) {
            spawnThought(S.activeHuman, '🥶 COLD!');
            S._coldStreak = 0;
          }
          S._hotHand = 0;
          if (S._fireMode) {
            S._fireMode = false;
            S._fireModeFrames = 0;
          }
        }
        if (TEAM_A_IDS.includes(closest.id) && closest.dist < 120) {
          S.possession = 'a';
          S.ball.carrier = closest.id;
          S.players[closest.id].hasBall = true;
          S.activeHuman = closest.id;
          // Offensive rebound: human missed own shot and got it back
          const isOffReb = b._fromX !== undefined && !b._pass;
          if (isOffReb && closest.dist < 80) {
            S.players[closest.id]._putbackBonus = true; // flagged for next shot
            spawnThought(closest.id, '🔃 OFF REBOUND!');
            S._possessionMoves = (S._possessionMoves || 0) + 1;
          } else {
            S._fastBreak = 100;
            spawnThought(closest.id, '🏀 REBOUND!');
          }
        } else {
          turnoverToCPU();
        }
      }
    }
  }

  if (b.x < -30) {
    if (S.possession === 'a') {
      spawnThought(S.activeHuman, '😬 AIR BALL!');
      sfxMiss();
      // CPU reacts to air ball
      const taunt = ['😂 AIR BALL!', '💨 BRICKS!', '😏 AIR!'][Math.floor(Math.random()*3)];
      setTimeout(() => spawnThought(TEAM_B_IDS[0], taunt), 400);
    }
    turnoverToCPU();
  }
}

function scorePoint() {
  const b = S.ball;
  const dist = Math.abs((b._fromX || S.players[S.activeHuman]?.x || 100) - HOOP_X);
  const pts  = dist > SHOT_RANGE_2 ? 3 : 2;
  const team = S.possession;

  const prevDeficit = S.score[1] - S.score[0]; // how far human was behind before this
  S.score[team === 'a' ? 0 : 1] += pts;

  const scorer = team === 'a' ? S.activeHuman : TEAM_B_IDS.find(id => S.players[id].hasBall) || TEAM_B_IDS[0];
  spawnThought(scorer, CHARS[scorer].quips[Math.floor(Math.random() * 4)]);

  // Character signature celebrations
  if (scorer === 'nara') {
    const notes = ['♪','♩','♫','🎸'];
    for (let ni = 0; ni < 5; ni++) {
      S.thoughts.push({
        x: S.players[scorer].x + (Math.random()-0.5)*40,
        y: S.players[scorer].y - 60 - Math.random()*60,
        text: notes[ni % notes.length],
        ttl: 40 + Math.random()*25,
        maxTtl: 65,
        dx: (Math.random()-0.5)*1.5,
      });
    }
  } else if (scorer === TEAM_B_IDS[0] && dist < SHOT_RANGE_LAY) {
    for (let di = 0; di < 8; di++) {
      const ang = (di / 8) * Math.PI * 2;
      S.confetti.push({ x: S.players[TEAM_B_IDS[0]].x, y: S.players[TEAM_B_IDS[0]].y - 40, vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4 - 3, color: di % 2 === 0 ? '#FF6B35' : '#FFD700', size: 4, ttl: 22, rot: 0, dRot: 0.3 });
    }
  } else if (scorer === TEAM_B_IDS[1] && pts === 3) {
    const keys = ['♩', '🎹', '♪', '💜'];
    for (let ki = 0; ki < 4; ki++) {
      S.thoughts.push({
        x: S.players[TEAM_B_IDS[1]].x + (ki - 2) * 14,
        y: S.players[TEAM_B_IDS[1]].y - 50 - Math.random()*30,
        text: keys[ki], ttl: 35, maxTtl: 35, dx: (ki - 1.5) * 0.4,
      });
    }
  }

  // Assist tracking: passer gets credit if they passed within last 4 seconds
  if (team === 'a' && S._lastPasser && S._lastPasser !== scorer) {
    S.stats.assists++;
    if (pts === 3) spawnThought(S._lastPasser, '🎯 ASSIST!');
    else spawnThought(S._lastPasser, '🤝 ASSIST!');
  }
  S._lastPasser = null; // reset

  // Buzzer beater bonus
  const isBuzzer = S.possession === 'a' && S.shotClock <= 55;
  const isSwish = !b._rimHit;
  const swishTag = isSwish ? (pts === 3 ? ' SWISH!' : ' SWISH!') : '';
  const flashText = isBuzzer ? '🚨 BUZZER BEATER!' : pts === 3 ? `3️⃣ THREE!${swishTag}` : `${pts} PTS!${swishTag}`;
  S.scoreFlash = {
    text: flashText,
    color: team === 'a' ? CHARS.nara.hue : CHARS.brendan.hue,
    ttl: isBuzzer ? 100 : 70
  };
  if (isSwish && team === 'a') {
    setTimeout(() => { if (S.screen === 'playing') S.scoreFlash = { text: '🌊 NOTHING BUT NET!', color: '#00CFFF', ttl: 55 }; }, 650);
  }

  sfxScore(pts);
  const deuceBonus = S._deuceActive ? 0.3 : 0;
  const crowdIntensity = Math.min(1.0, (isBuzzer ? 1 : pts === 3 ? 0.7 : 0.4) + deuceBonus);
  setTimeout(() => sfxCrowd(crowdIntensity), 350);
  S.shake = isBuzzer ? 20 : 12;
  // Crowd burst particles on big plays
  if (pts === 3 || isBuzzer) {
    const burstColors = team === 'a'
      ? [CHARS[TEAM_A_IDS[0]].hue, CHARS[TEAM_A_IDS[1]].hue, '#FFD700', '#FFF']
      : [CHARS[TEAM_B_IDS[0]].hue, '#FF4444', '#FFF'];
    spawnCrowdBurst(burstColors);
  }
  S.hoopFlash = 25;
  if (navigator.vibrate) navigator.vibrate(isBuzzer ? [80, 40, 80] : pts === 3 ? [30, 20, 50] : 45);
  // Boost crowd energy
  const energyBoost = isBuzzer ? 40 : pts === 3 ? 25 : team === 'a' ? 15 : 8;
  S._crowdEnergy = Math.min(100, (S._crowdEnergy || 0) + energyBoost);
  if (team === 'a') S.stats.made++;
  if (team === 'a') {
    // Add hot spot at shot origin
    const shotOriginX = b._fromX || S.players[S.activeHuman]?.x || 100;
    S._hotSpots = S._hotSpots || [];
    S._hotSpots.push({ x: shotOriginX, ttl: 1200 });
    if (S._hotSpots.length > 8) S._hotSpots.shift(); // keep last 8
  }
  if (team === 'a') S._coldStreak = 0; // reset cold streak on score
  const brokenRun = team === 'a' && (S._cpuStreak || 0) >= 3;
  if (brokenRun) {
    S._stoppedRun = true;
    setTimeout(() => {
      if (S.screen === 'playing') {
        S.scoreFlash = { text: '🛑 RUN STOPPER!', color: '#00FF88', ttl: 90 };
        sfxCrowd(0.9);
        spawnCrowdBurst([CHARS.nara.hue, '#00FF88', '#FFD700', '#FFF']);
      }
    }, 1100);
  }
  if (team === 'a') S._cpuStreak = 0;  // break CPU run
  if (team === 'a') {
    S._playerScores = S._playerScores || { nara: 0, ethan: 0 };
    S._playerScores[scorer] = (S._playerScores[scorer] || 0) + pts;
  }
  if (team === 'a' && pts === 2) S.stats.twos = (S.stats.twos || 0) + 1;
  if (team === 'a' && pts === 3) {
    S.stats.threes++;
    S._human3ptStreak = (S._human3ptStreak || 0) + 1;
    // Nara's signature guitar strum on 3pt
    if (scorer === 'nara') setTimeout(() => sfxGuitarStrum(), 300);
    // CHEF CURRY: 3 3s in a row = special bonus mode
    if (S._human3ptStreak === 3) {
      setTimeout(() => { S.scoreFlash = { text: '🍳 CHEF CURRY MODE!', color: '#FFD700', ttl: 100 }; }, 1000);
      spawnThought(scorer, '🍳 COOKING!');
    }
  } else if (team === 'a') {
    S._human3ptStreak = 0;
  }
  if (team === 'a' && S.scoreFlash && S.scoreFlash.text.includes('ALLEY')) S.stats.alleyOops++;

  // AND ONE: defender very close at shot origin → chance for bonus point
  if (team === 'a') {
    const shotX = b._fromX || S.players[S.activeHuman]?.x || 100;
    const defNear = TEAM_B_IDS.some(id => Math.hypot(S.players[id].x - shotX, 0) < 40);
    if (defNear && pts === 2 && Math.random() < 0.22) {
      setTimeout(() => {
        if (S.screen === 'playing') {
          S.score[0] += 1;
          const andScorer = S.activeHuman;
          spawnThought(andScorer, '🤙 AND ONE!');
          S.scoreFlash = { text: '🤙 AND ONE! +1', color: '#FFD700', ttl: 80 };
          sfxAndOne();
          if (navigator.vibrate) navigator.vibrate(25);
        }
      }, 1100);
    }
  }
  if (team === 'a') {
    const bonus = isBuzzer ? 2 : 1;
    S.streak = (S.streak || 0) + bonus;
    if (S.streak >= 5) {
      setTimeout(() => { S.scoreFlash = { text: '🔥🔥 CROWD GOES WILD!', color: '#FF4500', ttl: 100 }; }, 900);
    } else if (S.streak >= 2) {
      spawnThought(scorer, isBuzzer ? '🚨🔥 CLUTCH!' : `🔥 x${S.streak}!`);
    }
    // Comeback message when scoring while trailing
    if (prevDeficit >= 3) {
      setTimeout(() => { S.scoreFlash = { text: '💪 COMEBACK!', color: CHARS.nara.hue, ttl: 80 }; }, 800);
    }
    // Highlight reel: 3+ fancy moves in one possession
    if ((S._possessionMoves || 0) >= 3) {
      setTimeout(() => { S.scoreFlash = { text: '🎬 HIGHLIGHT REEL!', color: '#FF69B4', ttl: 90 }; }, 1000);
      sfxCrowd(0.9);
    }
    S._possessionMoves = 0;
    // Hot hand tracking
    S._hotHand = (S._hotHand || 0) + 1;
    if (!S._fireMode && S._hotHand >= 3) {
      S._fireMode = true;
      S._fireModeFrames = 480; // 8 seconds
      setTimeout(() => {
        if (S.screen === 'playing') {
          S.scoreFlash = { text: '🔥 ON FIRE! 🔥', color: '#FF4500', ttl: 90 };
          sfxCrowd(0.85);
        }
      }, 900);
    } else if (S._fireMode) {
      S._fireModeFrames = Math.min(S._fireModeFrames + 180, 600); // extend on each make
    }
  } else {
    S.streak = 0;
    S._cpuStreak = (S._cpuStreak || 0) + 1;
    if (S._cpuStreak === 3) {
      setTimeout(() => { if (S.screen === 'playing') S.scoreFlash = { text: '💀 CPU ON A 3-0 RUN!', color: CHARS.brendan.hue, ttl: 85 }; }, 1200);
    } else if (S._cpuStreak === 5) {
      setTimeout(() => { if (S.screen === 'playing') S.scoreFlash = { text: '🚨 5-0 RUN — CALL TIMEOUT!', color: '#FF2222', ttl: 100 }; }, 1200);
    }
    const cpuLead = S.score[1] - S.score[0];
    let taunts;
    if (cpuLead >= 3)       taunts = ['😤 TOO EASY!', '🎯 LOCK IN!', '💀 OVER!', '😂 YIKES!'];
    else if (cpuLead <= -3) taunts = ['💪 BACK!', '😤 NOT TODAY!', '🔥 MY HOUSE!', '⚡ WAKE UP!'];
    else if (S._deuceActive) taunts = ['😤 DEUCE ME!', '🥁 PRESSURE!', '🎯 BOOM!', '💪 DEUCE!'];
    else taunts = ['😤 TOO EASY!', '🥁 BOOM!', '💪 SIT DOWN!', '😎 NIGHT NIGHT!'];
    setTimeout(() => spawnThought(scorer, taunts[Math.floor(Math.random() * taunts.length)]), 600);
    // Double taunt on 3pt by CPU
    if (pts === 3) setTimeout(() => spawnThought(scorer === 'brendan' ? 'james' : 'brendan', '🔥 FIRE!'), 900);
  }

  // Milestone announcements (first team to 5, first team to 8)
  const newScore = S.score[team === 'a' ? 0 : 1];
  const oppScore = S.score[team === 'a' ? 1 : 0];
  if ((newScore === 5 || newScore === 8) && oppScore < newScore) {
    const mText = team === 'a' ? `🎸 FIRST TO ${newScore}!` : `💀 THEY HIT ${newScore}`;
    const mColor = team === 'a' ? CHARS.nara.hue : CHARS.brendan.hue;
    setTimeout(() => { if (S.screen === 'playing') S.scoreFlash = { text: mText, color: mColor, ttl: 65 }; }, 1600);
  }
  // Halftime when both teams reach 5
  if (!S._halftimeDone && S.score[0] >= 5 && S.score[1] >= 5) {
    S._halftimeDone = true;
    setTimeout(() => { if (S.screen === 'playing') S.scoreFlash = { text: '🏟 HALFTIME — 5-5!', color: '#FFFFFF', ttl: 90 }; }, 1400);
    setTimeout(() => sfxCrowd(0.55), 1600);
  }

  const teamIds = team === 'a' ? TEAM_A_IDS : TEAM_B_IDS;
  const loseIds = team === 'a' ? TEAM_B_IDS : TEAM_A_IDS;
  for (const id of teamIds) S.players[id].anim = 'celebrate';
  for (const id of loseIds) S.players[id].anim = 'sad';
  // Scorer jumps on 3pt or buzzer
  if ((pts === 3 || isBuzzer) && S.players[scorer]) {
    S.players[scorer]._jumpVy = -10;
    S.players[scorer].anim = 'jump';
  }

  // Spawn confetti burst
  const colors = team === 'a' ? [CHARS[TEAM_A_IDS[0]].hue, CHARS[TEAM_A_IDS[1]].hue, '#FFD700', '#FFF'] : [CHARS[TEAM_B_IDS[0]].hue, CHARS[TEAM_B_IDS[1]].hue, '#FFD700', '#FFF'];
  for (let i = 0; i < 40; i++) {
    S.confetti.push({
      x: HOOP_X + (Math.random() - 0.5) * 30,
      y: RIM_Y,
      vx: (Math.random() - 0.5) * 7,
      vy: -Math.random() * 10 - 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 4 + Math.random() * 5,
      ttl: 60 + Math.floor(Math.random() * 40),
      rot: Math.random() * Math.PI * 2,
      dRot: (Math.random() - 0.5) * 0.3,
    });
  }

  // Deuce rule: activates only when BOTH teams are exactly tied at WIN_SCORE-1
  if (!S._deuceActive && S.score[0] === WIN_SCORE - 1 && S.score[1] === WIN_SCORE - 1) {
    S._deuceActive = true;
    S._arenaFlicker = 40; // brief darkness
    setTimeout(() => { S.scoreFlash = { text: '🔄 DEUCE — WIN BY 2!', color: '#FFD700', ttl: 100 }; }, 1000);
    setTimeout(() => sfxDeuceTension(), 1100);
  }

  // Tie game drama
  if (S.score[0] === S.score[1] && S.score[0] > 0) {
    if (!S._deuceActive) {
      setTimeout(() => { S.scoreFlash = { text: '⚖️ TIE GAME!', color: '#FFFFFF', ttl: 80 }; }, 1200);
    } else {
      setTimeout(() => { S.scoreFlash = { text: '⚖️ DEUCE!', color: '#FFD700', ttl: 90 }; }, 1200);
    }
  }
  // Game point / advantage
  else if (!S._deuceActive && S.score[0] === WIN_SCORE - 1 && team === 'a') {
    setTimeout(() => { S.scoreFlash = { text: '🏀 GAME POINT!', color: CHARS.nara.hue, ttl: 90 }; }, 1200);
  } else if (!S._deuceActive && S.score[1] === WIN_SCORE - 1 && team === 'b') {
    setTimeout(() => { S.scoreFlash = { text: '⚠️ GAME POINT!', color: CHARS.brendan.hue, ttl: 90 }; }, 1200);
  } else if (S._deuceActive && S.score[0] - S.score[1] === 1) {
    setTimeout(() => { S.scoreFlash = { text: '💛 ADVANTAGE NARA\'S ROOM!', color: CHARS.nara.hue, ttl: 90 }; }, 1200);
  } else if (S._deuceActive && S.score[1] - S.score[0] === 1) {
    setTimeout(() => { S.scoreFlash = { text: '⚠️ ADVANTAGE ALL-STARS!', color: CHARS.brendan.hue, ttl: 90 }; }, 1200);
  }

  // CPU timeout when losing big
  const cpuDeficit = S.score[0] - S.score[1];
  if (!S._cpuTimeoutUsed && cpuDeficit >= 4 && S.screen === 'playing') {
    S._cpuTimeoutUsed = true;
    setTimeout(() => {
      if (S.screen === 'playing') {
        S.paused = true;
        S.scoreFlash = { text: '⏸ CPU TIMEOUT', color: CHARS.brendan.hue, ttl: 180 };
        spawnThought(TEAM_B_IDS[0], '🧠 REGROUP!');
        setTimeout(() => { S.paused = false; }, 2200);
      }
    }, 800);
  }

  resetBallAfterScore(team === 'a' ? 'b' : 'a');

  const aWins = S._deuceActive
    ? S.score[0] > S.score[1] && S.score[0] - S.score[1] >= 2
    : S.score[0] >= WIN_SCORE;
  const bWins = S._deuceActive
    ? S.score[1] > S.score[0] && S.score[1] - S.score[0] >= 2
    : S.score[1] >= WIN_SCORE;

  if (aWins || bWins) {
    // Full mega celebration for any human win
    if (aWins) {
      S.scoreFlash = { text: S._deuceActive ? '🏆 GAME WINNER!!!' : '🏆 NARA\'S ROOM WINS!', color: '#FFD700', ttl: 150 };
      sfxVictoryFanfare();
      S.shake = 22;
      // Mega confetti burst
      for (let ci = 0; ci < 90; ci++) {
        S.confetti.push({ x: Math.random() * GW, y: GH * 0.25 + Math.random() * GH * 0.45, vx: (Math.random()-0.5)*11, vy: -Math.random()*13 - 4, color: ['#FFD700','#FF69B4',CHARS[TEAM_A_IDS[0]].hue,'#FFF','#00CFFF',CHARS[TEAM_A_IDS[1]].hue][ci % 6], size: 5 + Math.random()*7, ttl: 100 + Math.random()*60, rot: Math.random()*Math.PI*2, dRot: (Math.random()-0.5)*0.4 });
      }
      spawnCrowdBurst([CHARS[TEAM_A_IDS[0]].hue, '#FFD700', '#FFF', CHARS[TEAM_A_IDS[1]].hue, '#FF69B4']);
    }
    // Scorer-specific game-winner callout
    if (aWins) {
      if (scorer === 'nara') { setTimeout(() => sfxGuitarStrum(), 250); setTimeout(() => sfxGuitarStrum(), 600); }
      spawnThought(scorer, scorer === 'nara' ? '🎸 GAME WINNER!' : `🏆 ${CHARS[scorer].name} WINS IT!`);
    }
    setTimeout(() => {
      S.screen = 'gameover';
      if (aWins && !S._deuceActive) sfxVictoryFanfare();
      try {
        const best = JSON.parse(localStorage.getItem('hch_best') || '{}');
        if (!best.streak || S.streak > best.streak) best.streak = S.streak;
        const pct = S.stats.shots > 0 ? Math.round(S.stats.made / S.stats.shots * 100) : 0;
        if (!best.fgPct || pct > best.fgPct) best.fgPct = pct;
        if (aWins) {
          best.wins = (best.wins || 0) + 1;
          // Track comeback wins
          if ((S._maxDeficit || 0) >= 3) best.comebacks = (best.comebacks || 0) + 1;
          if (S._deuceActive) best.deuceWins = (best.deuceWins || 0) + 1;
        } else {
          best.losses = (best.losses || 0) + 1;
        }
        if ((S._maxDeficit || 0) > (best.maxComeback || 0)) best.maxComeback = S._maxDeficit;
        localStorage.setItem('hch_best', JSON.stringify(best));
      } catch(e) {}
    }, 1500);
  }
}

function resetBallAfterScore(nextPossession) {
  S.possession = nextPossession;
  const carrier = nextPossession === 'a' ? S.activeHuman : TEAM_B_IDS[0];
  S.shotClock = 600;

  // Reset hold state
  S.shootHeld = false; S.shootPower = 0;
  S.blockHeld = false; S.blockPower = 0;

  for (const id of TEAM_A_IDS.concat(TEAM_B_IDS)) {
    if (S.players[id].anim === 'celebrate' || S.players[id].anim === 'sad') {
      setTimeout(() => { if (S.players[id]) S.players[id].anim = 'idle'; }, 1000);
    }
  }

  S._fastBreak = 0;
  S._possessionMoves = 0;
  S.ball._alleyOop = false;
  S.ball._fromX = undefined;
  S.ball._rimHit = false;
  S.ball._floater = false;

  for (const id of TEAM_A_IDS.concat(TEAM_B_IDS)) {
    S.players[id].jumpY = 0; S.players[id]._jumpVy = 0;
    S.players[id].hasBall = false;
    S.players[id].y = COURT_FAR_Y + 20;
    S.players[id]._cutting = false;
    S.players[id]._willShoot = false;
    S.players[id]._willThree = false;
    S.players[id]._goingThree = false;
    S.players[id]._driving = false;
    S.players[id]._faked = false;
    S.players[id]._givingAndGoing = false;
    S.players[id]._postUp = false;
    S.players[id]._putbackBonus = false;
  }

  if (nextPossession === 'a') {
    S.players[TEAM_A_IDS[0]].x = 80;  S.players[TEAM_A_IDS[1]].x = 150;
    S.players[TEAM_B_IDS[0]].x = 230; S.players[TEAM_B_IDS[1]].x = 300;
  } else {
    S.players[TEAM_B_IDS[0]].x = 80;  S.players[TEAM_B_IDS[1]].x = 155;
    S.players[TEAM_A_IDS[0]].x = 240; S.players[TEAM_A_IDS[1]].x = 305;
  }

  S.ball.inAir   = false;
  S.ball.x       = 80;
  S.ball.y       = FLOOR_Y - 30;
  S.ball.vx      = 0; S.ball.vy = 0;
  S.ball.carrier = carrier;
  S.ball._made   = undefined;
  S.players[carrier].hasBall = true;
  if (nextPossession === 'a') S.activeHuman = S._selectedPlayer || TEAM_A_IDS[0];
}

function turnoverToCPU() {
  if (S.possession === 'b') return;
  S.possession = 'b';
  S._fastBreak = 0;
  S.ball.inAir = false;
  S.ball.vx = 0; S.ball.vy = 0;
  S.ball.carrier = TEAM_B_IDS[0];
  S.ball._pass = false; S.ball._alleyOop = false; S.ball._passTarget = null;
  S.ball._fromX = undefined;
  S.players[TEAM_B_IDS[0]].hasBall = true;
  for (const _id of TEAM_A_IDS) S.players[_id].hasBall = false;
  S.ball._made = undefined;
  S.shootHeld = false; S.shootPower = 0;
  S.players[TEAM_B_IDS[0]]._givingAndGoing = false;
  S.players[TEAM_B_IDS[1]]._postUp = false;
}

// ── Player Movement Update ────────────────────────────────────────
function updatePlayers() {
  // Update cooldowns
  for (const id of TEAM_A_IDS.concat(TEAM_B_IDS)) {
    const p = S.players[id];
    if (p._stealCooldown > 0) p._stealCooldown--;
  }

  // Jump physics for all players
  for (const id of TEAM_A_IDS.concat(TEAM_B_IDS)) {
    const p = S.players[id];
    if (p._jumpVy !== 0) {
      p.jumpY   += p._jumpVy;
      p._jumpVy += 0.65;
      if (p.jumpY >= 0) {
        p.jumpY = 0; p._jumpVy = 0;
        if (p.anim === 'jump') {
          p.anim = 'land';
          p.landStartFrame = S.frame;
          const pid = id;
          setTimeout(() => {
            if (S.players[pid] && S.players[pid].anim === 'land')
              S.players[pid].anim = 'idle';
          }, 280);
        }
      }
    }
  }

  if (S.possession === 'a') {
    updateAIDefense();
    const ap  = S.players[S.activeHuman];
    if (S._fastBreak > 0) S._fastBreak--;

    // Double-team detection
    const bothDefs = TEAM_B_IDS.filter(id => Math.hypot(S.players[id].x - ap.x, S.players[id].y - ap.y) < 50);
    const isDoubleTeamed = bothDefs.length >= 2 && ap.hasBall;
    if (isDoubleTeamed && S.frame % 90 === 0) spawnThought(ap.id, '🔥 DOUBLE TEAM!');

    // Alley-oop opportunity hint during fast break
    if (S._fastBreak > 80 && ap.hasBall && S.frame % 90 === 0) {
      const tmId = TEAM_A_IDS.find(id => id !== S.activeHuman);
      const tm = S.players[tmId];
      const tmNearBasket = tm.x > HOOP_X - 65;
      const defFar = TEAM_B_IDS.every(id => Math.hypot(S.players[id].x - tm.x, S.players[id].y - tm.y) > 60);
      if (tmNearBasket && defFar) spawnThought(ap.id, '🙌 LOB IT!');
    }
    // Breakaway indicator: fast break, carrier near paint, no defenders close
    const breakawayAvail = S._fastBreak > 60 && ap.hasBall && Math.abs(ap.x - HOOP_X) < 100 &&
      TEAM_B_IDS.every(id => Math.hypot(S.players[id].x - ap.x, S.players[id].y - ap.y) > 100);
    if (breakawayAvail && S.frame % 120 === 0) spawnThought(ap.id, '🚀 GO DUNK!');

    const fastBreakBoost = S._fastBreak > 80 ? 0.8 : S._fastBreak > 30 ? 0.3 : 0;
    const spd = isDoubleTeamed ? 2.8 : 3.5 + fastBreakBoost; // slowed in double team, boosted on fast break

    if (S.joy.active) {
      const jNorm = Math.hypot(S.joy.dx, S.joy.dy);
      if (jNorm > 8) {
        const prevVx = ap.vx;
        const targetVx = (S.joy.dx / 55) * spd;
        const targetVy = (S.joy.dy / 55) * spd * 0.6;
        ap.vx += (targetVx - ap.vx) * 0.28; // inertia ramp-up
        ap.vy += (targetVy - ap.vy) * 0.28;
        // Crossover: direction flipped sharply while moving
        if (prevVx * targetVx < -2.5 && Math.abs(prevVx) > 1.5 && ap.hasBall) {
          for (let i = 0; i < 4; i++) {
            S.confetti.push({ x: ap.x + (Math.random()-0.5)*10, y: ap.y + 4, vx: (Math.random()-0.5)*2.5, vy: -0.5 - Math.random(), color: 'rgba(255,220,80,0.55)', size: 2 + Math.random()*2, ttl: 12, rot: 0, dRot: 0.3 });
          }
          // Ankle-breaker: nearby defender stumbles
          const stumbled = TEAM_B_IDS.find(id => Math.hypot(S.players[id].x - ap.x, S.players[id].y - ap.y) < 55 && S.players[id].jumpY === 0);
          if (stumbled) {
            spawnThought(ap.id, '🔥 ANKLE BREAKER!');
            S._possessionMoves = (S._possessionMoves || 0) + 2; // ankle breaker = 2 moves
            spawnThought(stumbled, '😵 BROKEN!');
            S.players[stumbled]._stealCooldown = 110;
            S.players[stumbled].anim = 'land';
            S.players[stumbled].landStartFrame = S.frame;
            S.players[stumbled]._ankleStun = 90; // prevent movement
            S.scoreFlash = { text: '💥 ANKLE BREAKER!', color: CHARS[ap.id].hue, ttl: 55 };
            sfxCrowd(0.45);
            // Gold sparks at stumbler's feet
            for (let si = 0; si < 8; si++) {
              S.confetti.push({ x: S.players[stumbled].x + (Math.random()-0.5)*16, y: S.players[stumbled].y, vx: (Math.random()-0.5)*4, vy: -2 - Math.random()*3, color: '#FFD700', size: 3 + Math.random()*2, ttl: 20, rot: 0, dRot: 0.4 });
            }
            setTimeout(() => { if (S.players[stumbled]) { S.players[stumbled].anim = 'idle'; S.players[stumbled]._ankleStun = 0; } }, 900);
          } else {
            spawnThought(ap.id, '✨ CROSSOVER!');
          }
        }
        if (Math.abs(ap.vx) > 0.4 || Math.abs(ap.vy) > 0.4) {
          if (Math.abs(S.joy.dx) > 6) ap.facing = S.joy.dx > 0 ? 1 : -1;
          ap.anim = 'run';
        }
      } else {
        ap.vx *= 0.72; ap.vy *= 0.72; // deceleration slide
        if (Math.hypot(ap.vx, ap.vy) < 0.3) { ap.vx = 0; ap.vy = 0; ap.anim = 'idle'; }
      }
    } else {
      ap.vx *= 0.72; ap.vy *= 0.72;
      if (Math.hypot(ap.vx, ap.vy) < 0.3) { ap.vx = 0; ap.vy = 0; ap.anim = 'idle'; }
    }

    ap.x = Math.max(20, Math.min(300, ap.x + ap.vx));
    ap.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, ap.y + ap.vy));

    // Footstep dust when sprinting
    const spd2 = Math.hypot(ap.vx, ap.vy);
    if (spd2 > 2.8 && S.frame % 4 === 0) {
      S.confetti.push({
        x: ap.x + (Math.random() - 0.5) * 14,
        y: ap.y + 5,
        vx: -ap.vx * 0.25 + (Math.random() - 0.5) * 0.6,
        vy: -0.3 - Math.random() * 0.5,
        color: 'rgba(160,130,90,0.3)',
        size: 2.5 + Math.random() * 2,
        ttl: 10 + Math.floor(Math.random() * 6),
        rot: 0, dRot: 0,
      });
    }

    // 3pt zone entry notification
    if (ap.hasBall) {
      const now3 = Math.abs(ap.x - HOOP_X) > SHOT_RANGE_2;
      if (now3 && !ap._was3) spawnThought(ap.id, '3️⃣');
      ap._was3 = now3;
    }

    // Teammate movement: post-pass cut or spacing
    const teammate = TEAM_A_IDS.find(id => id !== S.activeHuman);
    const tp = S.players[teammate];

    // Cancel cut once player gets the ball back
    if (tp._cutting && tp.hasBall) tp._cutting = false;

    let targetX, targetY;
    if (tp._cutting && tp._cutTarget) {
      // Run hard to the cut target
      targetX = tp._cutTarget.x;
      targetY = tp._cutTarget.y;
      const tdx = targetX - tp.x, tdy = targetY - tp.y;
      if (Math.hypot(tdx, tdy) < 12) tp._cutting = false;
      tp.x += Math.sign(tdx) * 3.2;
      tp.y += Math.sign(tdy) * 2.0;
      tp.anim = 'run';
      tp.facing = tdx > 0 ? 1 : -1;
    } else {
      // Weak-side positioning: teammate stays on opposite side from ball handler
      const apZone = ap.x < 185 ? 'left' : 'right';
      if (S._fastBreak > 0) {
        // Fast break — sprint straight to basket
        targetX = HOOP_X - 38;
        targetY = COURT_FAR_Y + 12;
      } else if (apZone === 'left') {
        // Ball handler on left → teammate takes right wing near basket
        targetX = HOOP_X - 52;
        targetY = COURT_FAR_Y + 16;
      } else {
        // Ball handler on right → teammate takes left elbow/wing
        targetX = 110;
        targetY = COURT_FAR_Y + 10;
      }
      // If still too close to active player, push further away
      if (Math.abs(targetX - ap.x) < 60) targetX = apZone === 'left' ? 80 : HOOP_X - 42;
      const tdx = targetX - tp.x, tdy = targetY - tp.y;
      if (Math.abs(tdx) > 8 || Math.abs(tdy) > 8) {
        tp.x += Math.sign(tdx) * 2.5;
        tp.y += Math.sign(tdy) * 1.5;
        tp.anim = 'run';
        tp.facing = tdx > 0 ? 1 : -1;
      } else {
        tp.anim = 'idle';
        tp.facing = 1; // always look toward hoop
      }
    }
    tp.x = Math.max(20, Math.min(320, tp.x));
    tp.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, tp.y));

  } else {
    // CPU offense
    updateAI();
    // Human defends — inertia movement (same feel as offense)
    const ap  = S.players[S.activeHuman];
    const spd = 3.2;
    if (S.joy.active) {
      const jNorm = Math.hypot(S.joy.dx, S.joy.dy);
      if (jNorm > 8) {
        const targetVx = (S.joy.dx / 55) * spd;
        const targetVy = (S.joy.dy / 55) * spd * 0.6;
        ap.vx += (targetVx - ap.vx) * 0.3;
        ap.vy += (targetVy - ap.vy) * 0.3;
        if (Math.abs(ap.vx) > 0.35 || Math.abs(ap.vy) > 0.35) {
          if (Math.abs(S.joy.dx) > 6) ap.facing = S.joy.dx > 0 ? 1 : -1;
          ap.anim = 'run';
        }
      } else {
        ap.vx *= 0.72; ap.vy *= 0.72;
        if (Math.hypot(ap.vx, ap.vy) < 0.3) { ap.vx = 0; ap.vy = 0; ap.anim = 'idle'; }
      }
    } else {
      ap.vx *= 0.72; ap.vy *= 0.72;
      if (Math.hypot(ap.vx, ap.vy) < 0.3) { ap.vx = 0; ap.vy = 0; ap.anim = 'idle'; }
    }
    ap.x = Math.max(20, Math.min(350, ap.x + ap.vx));
    ap.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, ap.y + ap.vy));

    // Second defender marks the non-ball CPU player
    const teammate = TEAM_A_IDS.find(id => id !== S.activeHuman);
    const tp2 = S.players[teammate];
    const cpuNoBall = TEAM_B_IDS.find(id => !S.players[id].hasBall);
    const markTarget = cpuNoBall ? S.players[cpuNoBall] : null;
    const guardX = markTarget ? Math.max(HOOP_X - 85, markTarget.x + 38) : HOOP_X - 80;
    const guardY = markTarget ? markTarget.y : (COURT_FAR_Y + COURT_NEAR_Y) / 2;
    const td2x = guardX - tp2.x, td2y = guardY - tp2.y;
    if (Math.abs(td2x) > 8 || Math.abs(td2y) > 8) {
      tp2.x += Math.sign(td2x) * 1.8; tp2.y += Math.sign(td2y) * 1.2;
      tp2.anim = 'run'; tp2.facing = td2x > 0 ? 1 : -1;
    } else tp2.anim = 'idle';
    tp2.x = Math.max(20, Math.min(350, tp2.x));
    tp2.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, tp2.y));
  }

  // Always face hoop when on offense and not actively steering
  if (S.possession === 'a') {
    const ap = S.players[S.activeHuman];
    if (!S.joy.active) ap.facing = 1;
  }
}

// ── AI Logic ──────────────────────────────────────────────────────
function updateAIDefense() {
  // CPU team B defends while human has the ball
  const brendan = S.players[TEAM_B_IDS[0]];
  const james   = S.players[TEAM_B_IDS[1]];
  const carrier = S.players[S.activeHuman];

  brendan.aiTimer++;
  james.aiTimer++;

  // Ankle stun: frozen after ankle-breaker
  if (brendan._ankleStun > 0) { brendan._ankleStun--; return; }
  if (james._ankleStun > 0) { james._ankleStun--; return; }

  // Pressure defense: CPU gets tighter when human is near game point or on hot streak
  const humanNearWin = S._deuceActive && S.score[0] > S.score[1];
  const humanHot = S.streak >= 3;
  const pressMult = humanNearWin ? 1.25 : humanHot ? 1.1 : 1.0;

  // Zone defense: CPU switches to 2-3 zone when losing by 3+
  const cpuDeficit = S.score[0] - S.score[1]; // positive = CPU losing
  const inZone = cpuDeficit >= 3;
  if (inZone !== (S._cpuInZone || false)) {
    S._cpuInZone = inZone;
    if (inZone) {
      setTimeout(() => { if (S.screen === 'playing') S.scoreFlash = { text: '🔒 CPU SWITCHES TO ZONE!', color: CHARS.brendan.hue, ttl: 70 }; }, 400);
    }
  }

  if (inZone) {
    // 2-3 zone: Brendan guards paint, Will guards perimeter/high post
    const zoneTargetBX = HOOP_X - 58; // Brendan stays in the paint
    const zoneTargetBY = (COURT_FAR_Y + COURT_NEAR_Y) / 2;
    // Will slides toward carrier on perimeter to contest
    const carrierFarFromBasket = carrier.x < HOOP_X - 120;
    const zoneTargetWX = carrierFarFromBasket ? Math.max(carrier.x + 18, HOOP_X - 165) : HOOP_X - 100;
    const zoneTargetWY = carrier.y - 5;

    const zbDx = zoneTargetBX - brendan.x, zbDy = zoneTargetBY - brendan.y;
    if (Math.abs(zbDx) > 8) { brendan.x += Math.sign(zbDx) * 1.8; brendan.anim = 'run'; brendan.facing = zbDx < 0 ? 1 : -1; }
    else { brendan.anim = 'idle'; brendan.facing = -1; }
    if (Math.abs(zbDy) > 6) brendan.y += Math.sign(zbDy) * 1.2;
    brendan.x = Math.max(20, Math.min(340, brendan.x));
    brendan.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, brendan.y));

    const zwDx = zoneTargetWX - james.x, zwDy = zoneTargetWY - james.y;
    if (Math.abs(zwDx) > 8) { james.x += Math.sign(zwDx) * 2.0; james.anim = 'run'; james.facing = zwDx < 0 ? 1 : -1; }
    else { james.anim = 'idle'; james.facing = -1; }
    if (Math.abs(zwDy) > 6) james.y += Math.sign(zwDy) * 1.3;
    james.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, james.y));

    // Jump block logic still applies
    if (S.shootHeld && S.shootPower > 25) {
      const distJ = Math.hypot(carrier.x - james.x, carrier.y - james.y);
      const distB = Math.hypot(carrier.x - brendan.x, carrier.y - brendan.y);
      const nearest = distB < distJ ? brendan : james;
      if (Math.hypot(carrier.x - nearest.x, carrier.y - nearest.y) < 55 && nearest.jumpY === 0) {
        nearest._jumpVy = -7;
      }
    }
    return; // skip man-to-man logic
  }

  // When human is on Chef Curry mode, Brendan overplays the 3pt line
  const brendanOverplays3 = (S._human3ptStreak || 0) >= 3;

  // Brendan pressures the carrier — stays close, between carrier and basket
  // Tighten perimeter if human is shooting a lot of 3s
  const backoffB = brendanOverplays3 ? 5 : (S._human3ptStreak >= 2) ? 16 : (humanNearWin ? 14 : 28);
  const targetBX = Math.max(carrier.x + backoffB, HOOP_X - 35);
  const bDx = targetBX - brendan.x;
  const bDy = (carrier.y - 8) - brendan.y;
  const cpuRubberSpd = (S.score[0] - S.score[1]) >= 4 ? 1.15 : 1.0;
  const bSpeed = (carrier.vx !== 0 ? 3.0 : 2.2) * cpuRubberSpd * pressMult;
  if (Math.abs(bDx) > 8) {
    brendan.x += Math.sign(bDx) * bSpeed;
    brendan.anim = 'run';
    brendan.facing = bDx < 0 ? 1 : -1; // face the carrier (toward left = toward hoop side)
  } else {
    brendan.anim = 'idle';
    brendan.facing = -1; // always face the carrier
  }
  if (Math.abs(bDy) > 8) brendan.y += Math.sign(bDy) * 1.9;
  brendan.x = Math.max(20, Math.min(340, brendan.x));
  brendan.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, brendan.y));

  // Screen / pick: if the off-ball human is close to Brendan, screen happens
  const screenerIds = TEAM_A_IDS.filter(id => id !== S.activeHuman);
  for (const sid of screenerIds) {
    const screenerDist = Math.hypot(S.players[sid].x - brendan.x, S.players[sid].y - brendan.y);
    if (screenerDist < 35 && brendan.jumpY === 0) {
      brendan.x -= Math.sign(bDx) * 0.8; // Brendan slowed/pushed back
      if (screenerDist < 25 && S.frame % 90 === 0) spawnThought(sid, '🧱 SCREEN!');
    }
  }

  // Pick behavior: if carrier walks into Brendan, push them back slightly
  const distToBrendan = Math.hypot(carrier.x - brendan.x, carrier.y - brendan.y);
  if (distToBrendan < 32 && carrier.vx !== 0) {
    carrier.x -= carrier.vx * 0.55;
  }

  // James plays back — protects the paint and slides toward carrier when they drive inside
  const driveDepth = carrier.x > HOOP_X - 130; // carrier has driven into the lane
  const targetJX = driveDepth ? Math.min(carrier.x + 30, HOOP_X - 25) : HOOP_X - 60;
  const targetJY = driveDepth ? carrier.y : (COURT_FAR_Y + COURT_NEAR_Y) / 2;
  const jDx = targetJX - james.x;
  const jDy = targetJY - james.y;
  if (Math.abs(jDx) > 8) {
    james.x += Math.sign(jDx) * 1.8;
    james.anim = 'run';
    james.facing = jDx < 0 ? 1 : -1;
  } else {
    james.anim = 'idle';
    james.facing = -1;
  }
  if (Math.abs(jDy) > 8) james.y += Math.sign(jDy) * 1.2;
  james.y = Math.max(COURT_FAR_Y, Math.min(COURT_NEAR_Y, james.y));

  // AI jump-block when human is charging shot
  if (S.shootHeld && S.shootPower > 25) {
    const distJ = Math.hypot(carrier.x - james.x, carrier.y - james.y);
    const nearest = distToBrendan < distJ ? brendan : james;
    if (nearest._jumpVy === 0 && nearest.jumpY === 0 && nearest.aiTimer > 30) {
      nearest.aiTimer = 0;
      nearest._jumpVy = -9;
      nearest.anim = 'jump';
    }
  }

  // AI steal attempt when Brendan is close — higher rate when double-teaming
  const bothNear = distToBrendan < 55 && Math.hypot(carrier.x - james.x, carrier.y - james.y) < 60;
  if (distToBrendan < 55 && brendan.aiTimer > 60) {
    brendan.aiTimer = 0;
    const baseRate = S._difficulty === 'easy' ? 0.10 : S._difficulty === 'hard' ? 0.32 : 0.20;
    const stealRate = bothNear ? Math.min(baseRate * 1.5, 0.60) : baseRate; // double-team = easier steal
    const success = Math.random() < stealRate;
    if (success && carrier.hasBall) {
      carrier.hasBall = false;
      S.ball.carrier = TEAM_B_IDS[0];
      brendan.hasBall = true;
      S.possession = 'b';
      S.shootHeld = false; S.shootPower = 0;
      spawnThought(TEAM_B_IDS[0], '😤 STEAL!');
    }
  }

  // James swipe attempt when carrier drives into paint
  const distToJames = Math.hypot(carrier.x - james.x, carrier.y - james.y);
  if (distToJames < 48 && james.aiTimer > 75 && carrier.x > HOOP_X - 100 && carrier.hasBall) {
    james.aiTimer = 0;
    const jStealRate = S._difficulty === 'easy' ? 0.05 : S._difficulty === 'hard' ? 0.18 : 0.10;
    if (Math.random() < jStealRate) {
      carrier.hasBall = false;
      S.ball.carrier = TEAM_B_IDS[1];
      james.hasBall = true;
      S.possession = 'b';
      S.shootHeld = false; S.shootPower = 0;
      spawnThought(TEAM_B_IDS[1], '🖐 STRIP!');
    }
  }
}

function updateAI() {
  const brendan = S.players[TEAM_B_IDS[0]];
  const james   = S.players[TEAM_B_IDS[1]];

  brendan.aiTimer++;
  james.aiTimer++;

  if (brendan.hasBall) {
    brendan.facing = brendan.x < HOOP_X ? 1 : -1;
    const diff = S._difficulty || 'normal';
    // Fast break: Brendan rushes if he got the ball in the open court
    const onFastBreak = brendan.x < 150 && !S.ball.inAir;
    const driveProb = onFastBreak ? 0.08 : diff === 'hard' ? 0.006 : diff === 'easy' ? 0.001 : 0.003;
    const threeProb = diff === 'hard' ? 0.004 : 0;
    const shootChance = Math.random() < driveProb;
    if (shootChance && brendan.aiTimer > 20) { brendan._willShoot = true; brendan._willThree = false; }
    if (!brendan._willShoot && Math.random() < threeProb && brendan.aiTimer > 20) {
      brendan._willShoot = true; brendan._willThree = true;
    }
    const targetX = brendan._willThree ? HOOP_X - 215 : brendan._willShoot ? HOOP_X - 30 : HOOP_X - 80;
    const brendanSpeed = diff === 'hard' ? 2.8 : diff === 'easy' ? 1.6 : 2.2;
    const dx = targetX - brendan.x;
    if (Math.abs(dx) > 10) {
      brendan.x += Math.sign(dx) * brendanSpeed;
      brendan.anim = 'run';
    } else {
      brendan.anim = 'idle';
    }
    brendan.x = Math.max(20, Math.min(340, brendan.x));
    const bOffY = brendan._willShoot ? COURT_FAR_Y + 4 : COURT_FAR_Y + 18;
    if (Math.abs(brendan.y - bOffY) > 6) brendan.y += Math.sign(bOffY - brendan.y) * 1.2;

    if (brendan._willShoot && (Math.abs(brendan.x - targetX) < 15 || brendan.aiTimer > 80)) {
      brendan._willShoot = false;
      brendan._willThree = false;
      brendan.aiTimer = 0;
      aiShoot(brendan);
    } else if (!brendan._willShoot && brendan.aiTimer > 45 + Math.random() * 30) {
      brendan.aiTimer = 0;
      // CPU alley-oop: James near basket, no human defenders in paint
      const jamesNearBasket = james.x > HOOP_X - 55;
      const humanInPaint = TEAM_A_IDS.some(id => S.players[id].x > HOOP_X - 60);
      const cpuAlleyOop = jamesNearBasket && !humanInPaint && Math.random() < 0.3;
      if (cpuAlleyOop) {
        // Lob pass to James for alley-oop
        brendan.hasBall = false;
        S.ball.carrier = null; S.ball.inAir = true;
        S.ball.x = brendan.x; S.ball.y = brendan.y - 50;
        const lpdx = james.x - brendan.x;
        const lpdy = (james.y - 70) - (brendan.y - 50);
        const lt = Math.max(12, Math.hypot(lpdx, lpdy) / 12);
        S.ball.vx = lpdx / lt;
        S.ball.vy = (lpdy - 0.225 * lt * lt) / lt - 4; // extra loft for lob
        S.ball._pass = true; S.ball._passTarget = TEAM_B_IDS[1]; S.ball._alleyOop = true;
        spawnThought(TEAM_B_IDS[1], '🙌');
        spawnThought(TEAM_B_IDS[0], '🎳 LOB!');
      } else {
        // Normal give-and-go pass
        brendan.hasBall = false;
        S.ball.carrier = null; S.ball.inAir = true;
        S.ball.x = brendan.x; S.ball.y = brendan.y - 50;
        const pdx = james.x - brendan.x;
        const pdy = (james.y - 55) - (brendan.y - 50);
        const tPass2 = Math.max(10, Math.hypot(pdx, pdy) / 14);
        S.ball.vx = pdx / tPass2;
        S.ball.vy = (pdy - 0.225 * tPass2 * tPass2) / tPass2 - 1;
        S.ball._pass = true; S.ball._passTarget = TEAM_B_IDS[1];
        spawnThought(TEAM_B_IDS[1], '🏀');
        brendan._givingAndGoing = true;
      }
    }

  } else if (james.hasBall) {
    james.facing = james.x < HOOP_X ? 1 : -1;
    const diff = S._difficulty || 'normal';
    // James sometimes steps back for a 3, drives, or posts up
    if (!james._driving && !james._goingThree && !james._postUp && james.aiTimer > 20) {
      const threeChance = diff === 'hard' ? 0.007 : diff === 'easy' ? 0.001 : 0.003;
      if (Math.random() < threeChance) james._goingThree = true;
      else if (Math.random() < 0.004) james._driving = true;
      else if (diff !== 'easy' && Math.random() < 0.003) { james._postUp = true; spawnThought(TEAM_B_IDS[1], '💪 POST!'); }
    }
    const targetX = james._goingThree ? HOOP_X - 215 : james._driving ? HOOP_X - 25 : james._postUp ? HOOP_X - 40 : HOOP_X - 55;
    const ddx = targetX - james.x;
    if (Math.abs(ddx) > 10) {
      james.x += Math.sign(ddx) * (james._driving ? 2.8 : 2.0);
      james.anim = 'run';
    } else {
      james.anim = 'idle';
      james._driving = false;
      // James shoots after positioning — sometimes pump fakes first; post-up has lower timer
      const jTimer = james._postUp ? 35 : 55 + Math.random() * 40;
      if (james.aiTimer > jTimer) {
        if (!james._faked && !james._goingThree && !james._postUp && Math.random() < 0.35) {
          james._faked = true;
          james.anim = 'shoot';
          james.aiTimer = 30;
          spawnThought(TEAM_B_IDS[1], '😏');
        } else {
          james._faked = false;
          james._goingThree = false;
          james._postUp = false;
          james.aiTimer = 0;
          aiShoot(james);
        }
      }
    }
    james.x = Math.max(20, Math.min(340, james.x));

  } else {
    // No one has the ball — support positions
    // Brendan: cut to basket on give-and-go, otherwise hold wing
    if (brendan._givingAndGoing) {
      const gTarget = HOOP_X - 28;
      const gdx = gTarget - brendan.x;
      if (Math.abs(gdx) > 10) {
        brendan.x += Math.sign(gdx) * 3.0;
        brendan.anim = 'run'; brendan.facing = gdx > 0 ? 1 : -1;
      } else {
        brendan._givingAndGoing = false;
        brendan.anim = 'idle';
      }
    } else {
      const target_b = HOOP_X - 120;
      if (Math.abs(brendan.x - target_b) > 8) {
        brendan.x += Math.sign(target_b - brendan.x) * 1.5;
        brendan.anim = 'run'; brendan.facing = target_b > brendan.x ? 1 : -1;
      } else brendan.anim = 'idle';
    }
    const target_j = HOOP_X - 160;
    if (Math.abs(james.x - target_j) > 8) {
      james.x += Math.sign(target_j - james.x) * 1.5;
      james.anim = 'run'; james.facing = target_j > james.x ? 1 : -1;
    } else james.anim = 'idle';
  }
}

function aiShoot(p) {
  const dist = Math.abs(p.x - HOOP_X);
  const diffMult = S._difficulty === 'easy' ? 0.55 : S._difficulty === 'hard' ? 1.35 : 1.0;
  // Mercy mode: ease off when CPU leads by 5+
  const mercyMult = (S.score[1] - S.score[0]) >= 5 ? 0.72 : 1.0;
  // Rubber-band: CPU gets boost when trailing by 4+ (desperation mode)
  const deficit = S.score[0] - S.score[1];
  const rubberMult = deficit >= 4 ? (1 + deficit * 0.04) : 1.0;
  const charBonus3 = (dist > SHOT_RANGE_2 && CHARS[p.id]._3ptBonus) ? CHARS[p.id]._3ptBonus : 0;
  const acc  = (dist < SHOT_RANGE_LAY ? 0.75 : dist < SHOT_RANGE_2 ? 0.55 : 0.35 + charBonus3) * diffMult * mercyMult * rubberMult;
  const made = Math.random() < Math.min(0.96, acc);

  p.anim = 'shoot';
  p.hasBall = false;
  S.ball.carrier = null;
  fireBallShot(p.x, p.y - 55, made, dist);
  S.ball._fromX = p.x;

  const pid = p.id;
  setTimeout(() => {
    if (S.players[pid] && S.players[pid].anim === 'shoot') S.players[pid].anim = 'idle';
  }, 600);

  if (!made) {
    setTimeout(() => {
      if (S.possession === 'b' && !S.ball.carrier) {
        S.possession = 'a';
        const _rebounder = S.activeHuman;
        S.ball.carrier = _rebounder;
        S.players[_rebounder].hasBall = true;
        for (const _id of TEAM_B_IDS) S.players[_id].hasBall = false;
        S.ball.inAir = false;
        S.ball.x = S.players[_rebounder].x;
        S.ball.y = FLOOR_Y - 30;
        S._fastBreak = 120;
        spawnThought(_rebounder, S._deuceActive ? '🔥 DEUCE BOARD!' : '🏀 REBOUND!');
        if (S._deuceActive) setTimeout(() => sfxCrowd(0.5), 200);
      }
    }, 1800);
  }
}

function fireBallShot(fromX, fromY, made, dist, isFloater) {
  const b = S.ball;
  b.inAir = true;
  b.carrier = null;
  b._floater = !!isFloater;

  const dx    = HOOP_X - fromX;
  const dy    = RIM_Y - fromY;
  // 3pt shots get extra arc; floaters loft high to scoop over defenders
  const arcBonus = dist > SHOT_RANGE_2 ? 8 : dist > SHOT_RANGE_LAY ? 3 : 0;
  const floaterExtra = isFloater ? 14 : 0;
  const tFly  = 35 + dist * 0.08 + arcBonus + floaterExtra;
  const drift = made ? 0 : (Math.random() - 0.5) * 35;

  b.x   = fromX; b.y = fromY;
  b.vx  = (dx + drift) / tFly;
  b.vy  = (dy - 0.225 * tFly * tFly) / tFly;
  b._tFly  = tFly;
  b._t     = 0;
  b._made  = made;
  b._fromX = fromX;
  b._dy    = dy;
  b._dx    = dx + drift;
}

// ── Shoot Power Update ────────────────────────────────────────────
function updateShootPower() {
  if (S.possession === 'a' && S.shootHeld) {
    S.shootPower = Math.min(100, S.shootPower + 1.5);
    if (S.shootPower >= 100) releaseShoot();
  } else if (S.possession === 'b' && S.blockHeld) {
    S.blockPower = Math.min(100, S.blockPower + 2.5);
    if (S.blockPower >= 100) releaseBlock();
  }
}

// ── Thoughts Update ───────────────────────────────────────────────
function updateThoughts() {
  for (let i = S.thoughts.length - 1; i >= 0; i--) {
    S.thoughts[i].ttl--;
    S.thoughts[i].x += S.thoughts[i].dx;
    S.thoughts[i].y -= 0.4;
    if (S.thoughts[i].ttl <= 0) S.thoughts.splice(i, 1);
  }
}

// ── Score Flash Update ────────────────────────────────────────────
function updateScoreFlash() {
  if (S.scoreFlash && S.scoreFlash.ttl > 0) S.scoreFlash.ttl--;
}

// ── Main Game Loop ────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  S.frame++;

  ctx.clearRect(0, 0, GW, GH);

  if (S.screen === 'title') {
    drawTitle();
    return;
  }

  if (S.screen === 'charselect') {
    drawCharSelect();
    return;
  }

  if (S.screen === 'gameover') {
    drawGameOver();
    return;
  }

  // ── Pause overlay ───────────────────────────────────────────────
  if (S.paused) {
    ctx.fillStyle = 'rgba(15,5,40,0.88)';
    ctx.fillRect(0, 0, GW, GH);
    const isTimeout = (S._humanTimeouts || 0) === 0 || S.scoreFlash?.text?.includes('TIMEOUT');
    ctx.fillStyle = '#FFF'; ctx.font = 'bold 28px monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(isTimeout ? '⏸ TIMEOUT' : '⏸ PAUSED', GW / 2, GH / 2 - 20);
    if (isTimeout) {
      // Show a quick tip during timeout
      const tips = [
        'Hold shoot to charge power',
        'Pass to cut to basket 🙌',
        'Time the green zone for PERFECT!',
        'Drive in for a floater 🎩',
        'Step back 3 for bonus acc!',
        'Crossover to break ankles 🔥',
        'Catch & shoot within 1.5s ⚡',
      ];
      const tip = tips[(S.frame >> 4) % tips.length];
      ctx.font = '11px monospace'; ctx.fillStyle = 'rgba(255,215,0,0.85)';
      ctx.fillText('💡 TIP: ' + tip, GW / 2, GH / 2 + 20);
    }
    ctx.font = '13px monospace'; ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fillText('tap to resume', GW / 2, GH / 2 + (isTimeout ? 55 : 24));
    drawHUD();
    return;
  }

  // ── Update ──────────────────────────────────────────────────────
  applyKeyboard();
  updatePlayers();
  updateBall();
  updateShootPower();
  updateThoughts();
  updateScoreFlash();
  if (S.onboardingTimer > 0) S.onboardingTimer--;
  if (S.shake > 0) S.shake--;

  // Crowd energy decay (slow fade unless something exciting happens)
  if (S.frame % 60 === 0) S._crowdEnergy = Math.max(0, (S._crowdEnergy || 0) - 3);

  // Heat check callout when on fire and charging shot
  if (S.shootHeld && S.streak >= 3 && S.frame % 120 === 0) {
    spawnThought(S.activeHuman, '🔥 HEAT CHECK!');
  }

  // Ambient room notes: musical notes float up from sides occasionally
  if (S.frame % 180 === 0 && Math.random() < 0.6) {
    const noteChars = ['♪','♩','♫','🎵','🎸'];
    const side = Math.random() < 0.5 ? 8 + Math.random() * 15 : GW - 8 - Math.random() * 15;
    const noteColor = [CHARS.nara.hue, '#FFD700', '#FF69B4', '#00CFFF'][Math.floor(Math.random() * 4)];
    S.thoughts.push({
      x: side, y: FLOOR_Y - 20 - Math.random() * 80,
      text: noteChars[Math.floor(Math.random() * noteChars.length)],
      ttl: 60 + Math.random() * 40, maxTtl: 100,
      dx: (Math.random() - 0.5) * 0.4,
    });
  }

  // Hot streak sparkle particles — more intense at higher streaks
  const streakInterval = S.streak >= 5 ? 2 : 4;
  if (S.streak >= 3 && S.frame % streakInterval === 0) {
    const hp = S.players[S.activeHuman];
    const count = S.streak >= 5 ? 2 : 1;
    for (let si = 0; si < count; si++) {
      const hue = S.streak >= 5 ? (S.frame * 8 + si * 60) % 360 : null;
      const sparkColor = S.streak >= 5
        ? `hsl(${hue},100%,60%)`
        : '#FF9900';
      S.confetti.push({
        x: hp.x + (Math.random() - 0.5) * 30,
        y: hp.y + hp.jumpY - 20 - Math.random() * 140,
        vx: (Math.random() - 0.5) * 3,
        vy: -1.5 - Math.random() * 2.5,
        color: sparkColor,
        size: (S.streak >= 5 ? 3 : 2) + Math.random() * 3,
        ttl: 20 + Math.random() * 15,
        rot: 0, dRot: 0.2
      });
    }
  }

  // Shot clock
  if (S.possession === 'a' && !S.ball.inAir && S.pauseTimer <= 0) {
    S.shotClock = Math.max(0, S.shotClock - 1);
    if (S.shotClock === 0) {
      sfxClock(); sfxClock();
      spawnThought(S.activeHuman, '⏰ SHOT CLOCK!');
      setTimeout(() => { if (S.possession === 'a') turnoverToCPU(); }, 600);
      S.shotClock = 600;
    } else if (S.shotClock % 60 === 0 && S.shotClock <= 180) {
      sfxClock();
    }
  } else if (S.possession !== 'a') {
    S.shotClock = 600; // reset when CPU has ball
  }

  // Fire mode countdown
  if (S._fireMode) {
    S._fireModeFrames = Math.max(0, S._fireModeFrames - 1);
    if (S._fireModeFrames === 0) {
      S._fireMode = false;
      spawnThought(S.activeHuman, '❄️ COOLED OFF');
    }
    // Fire particles on active human while in fire mode
    if (S.frame % 3 === 0) {
      const hp = S.players[S.activeHuman];
      const fireColors = ['#FF4500', '#FF6A00', '#FFD700', '#FF2222'];
      S.confetti.push({
        x: hp.x + (Math.random() - 0.5) * 20,
        y: hp.y + hp.jumpY - 30 - Math.random() * 30,
        vx: (Math.random() - 0.5) * 1.5,
        vy: -1.5 - Math.random() * 2,
        color: fireColors[Math.floor(Math.random() * fireColors.length)],
        size: 3 + Math.random() * 3,
        ttl: 14 + Math.floor(Math.random() * 8),
        rot: 0, dRot: 0.3
      });
    }
  }

  // Track max deficit and lead
  const curDeficit = S.score[1] - S.score[0];
  if (curDeficit > 0) S._maxDeficit = Math.max(S._maxDeficit || 0, curDeficit);
  const curLead = S.score[0] - S.score[1];
  if (curLead > 0) S._maxLead = Math.max(S._maxLead || 0, curLead);

  // ── Draw ────────────────────────────────────────────────────────
  ctx.save();
  if (S.shake > 0) {
    const s = S.shake * 0.4;
    ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
  }
  if (courtBg.complete && courtBg.naturalWidth > 0) {
    ctx.drawImage(courtBg, 0, 0, GW, FLOOR_Y + 30);
  } else {
    drawSky();
    drawCrowd();
  }
  drawAnimatedCrowd();
  drawFloor();
  drawHoop();

  // Hot spot glows on floor — where human has scored
  if (S._hotSpots && S._hotSpots.length > 0) {
    for (let hi = S._hotSpots.length - 1; hi >= 0; hi--) {
      const hs = S._hotSpots[hi];
      hs.ttl--;
      if (hs.ttl <= 0) { S._hotSpots.splice(hi, 1); continue; }
      const alpha = Math.min(0.22, (hs.ttl / 1200) * 0.3);
      const rg = ctx.createRadialGradient(hs.x, FLOOR_Y - 4, 0, hs.x, FLOOR_Y - 4, 32);
      rg.addColorStop(0, `rgba(255,215,0,${alpha})`);
      rg.addColorStop(1, 'rgba(255,215,0,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(hs.x - 32, FLOOR_Y - 36, 64, 40);
    }
  }

  // Draw characters back-to-front by court depth
  const allIds = [...TEAM_A_IDS, ...TEAM_B_IDS];
  allIds.sort((a, b) => S.players[a].y - S.players[b].y);
  for (const id of allIds) {
    drawChar(id, S.players[id].hasBall);
  }

  // Speed lines during fast break — horizontal motion streaks behind ball carrier
  if (S._fastBreak > 60 && S.possession === 'a') {
    const ap = S.players[S.activeHuman];
    if (ap.hasBall && ap.anim === 'run') {
      const fbAlpha = Math.min(0.22, (S._fastBreak / 150) * 0.28);
      ctx.save();
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const yOff = (i - 2.5) * 18 + Math.sin(S.frame * 0.25 + i * 1.1) * 5;
        const len = 28 + i * 4;
        const x0 = ap.x + (ap.vx > 0 ? -10 : 10);
        const x1 = ap.x + (ap.vx > 0 ? -(10 + len) : (10 + len));
        ctx.globalAlpha = fbAlpha * (1 - i * 0.12);
        ctx.lineWidth = 1 + (5 - i) * 0.2;
        ctx.beginPath();
        ctx.moveTo(x0, ap.y - 80 + yOff);
        ctx.lineTo(x1, ap.y - 80 + yOff);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  // Pass direction indicator — subtle arrow toward teammate when human has ball
  if (S.possession === 'a' && !S.shootHeld) {
    const ap = S.players[S.activeHuman];
    if (ap.hasBall) {
      const tmId = TEAM_A_IDS.find(id => id !== S.activeHuman);
      const tm = S.players[tmId];
      const dx = tm.x - ap.x, dy = (tm.y - 20) - (ap.y - 120);
      const ang = Math.atan2(dy, dx);
      const arrowDist = 40;
      const ax = ap.x + Math.cos(ang) * arrowDist;
      const ay = (ap.y - 120) + Math.sin(ang) * arrowDist;
      const pulse = 0.2 + Math.sin(S.frame * 0.18) * 0.12;
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.translate(ax, ay);
      ctx.rotate(ang);
      ctx.fillStyle = CHARS[tmId].hue;
      ctx.beginPath();
      ctx.moveTo(8, 0); ctx.lineTo(-5, -5); ctx.lineTo(-5, 5);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  drawShotTrajectory();
  drawShotTypeLabel();
  drawBallTrail();
  drawBall();
  updateAndDrawConfetti();
  drawPowerIndicator();
  drawThoughts();
  drawSwitchFlash();

  // Mini shot power bar above active player when charging
  if (S.shootHeld && S.possession === 'a') {
    const ap = S.players[S.activeHuman];
    if (ap.hasBall) {
      const t = S.shootPower / 100;
      const inGreen = S.shootPower >= POWER_GREEN_LO && S.shootPower <= POWER_GREEN_HI;
      const barW = 36, barH = 5;
      const bx = ap.x - barW / 2, by = ap.y - ap.jumpY - 218;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.roundRect(bx, by, barW, barH, 2); ctx.fill();
      ctx.fillStyle = inGreen ? '#00FF88' : S.shootPower < POWER_GREEN_LO ? '#FF8C00' : '#FF4444';
      ctx.beginPath(); ctx.roundRect(bx + 1, by + 1, (barW - 2) * t, barH - 2, 1); ctx.fill();
    }
  }

  ctx.restore(); // end shake transform

  // CPU run ominous pulse: low red wash when on a 5-0 run
  if ((S._cpuStreak || 0) >= 5) {
    const runPulse = 0.04 + Math.sin(S.frame * 0.12) * 0.025;
    ctx.save();
    ctx.globalAlpha = runPulse;
    ctx.fillStyle = 'rgba(180,0,0,1)';
    ctx.fillRect(0, 0, GW, GH);
    ctx.restore();
  }

  // Hard mode: persistent dark vignette
  if (S._difficulty === 'hard') {
    const hv = ctx.createRadialGradient(GW / 2, GH / 2, GH * 0.25, GW / 2, GH / 2, GH * 0.85);
    hv.addColorStop(0, 'rgba(0,0,0,0)');
    hv.addColorStop(1, 'rgba(0,0,20,0.18)');
    ctx.fillStyle = hv;
    ctx.fillRect(0, 0, GW, GH);
  }

  // Game-point vignette intensity
  const humanGP = S.score[0] >= WIN_SCORE - 1;
  const cpuGP   = S.score[1] >= WIN_SCORE - 1;
  if (humanGP || cpuGP) {
    const clutch = humanGP && cpuGP; // both on game point = maximum drama
    const intensity = clutch
      ? 0.12 + Math.sin(S.frame * 0.1) * 0.07
      : 0.07 + Math.sin(S.frame * 0.07) * 0.04;
    const vg = ctx.createRadialGradient(GW / 2, GH / 2, GH * 0.28, GW / 2, GH / 2, GH * 0.82);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, `rgba(${humanGP ? '40,0,80' : '80,10,0'},${intensity})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, GW, GH);
    // Deuce: gold border pulses around entire screen
    if (S._deuceActive) {
      const dp = 0.04 + Math.sin(S.frame * 0.12) * 0.03;
      ctx.save();
      ctx.globalAlpha = dp;
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, GW - 8, GH - 8);
      ctx.restore();
    }
    // Clutch banner when both on game point
    if (clutch && S.frame % 180 < 90) {
      const cp = S.frame % 180 / 90;
      const ca = cp < 0.3 ? cp / 0.3 : cp > 0.7 ? (1 - cp) / 0.3 : 1;
      ctx.save();
      ctx.globalAlpha = ca * 0.75;
      ctx.fillStyle = S._deuceActive ? '#FFD700' : '#FF2244';
      ctx.font = 'bold 12px monospace'; ctx.letterSpacing = '0.2em';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(S._deuceActive ? '⚖️ DEUCE — WIN BY 2 ⚖️' : '🔥 CLUTCH TIME 🔥', GW / 2, 72);
      ctx.restore();
    }
  }

  // Arena flicker: brief darkness when deuce activates
  if (S._arenaFlicker > 0) {
    const fl = S._arenaFlicker / 40;
    const flAlpha = fl < 0.5 ? fl * 2 * 0.65 : (1 - fl) * 2 * 0.65;
    ctx.save();
    ctx.globalAlpha = flAlpha;
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, GW, GH);
    ctx.restore();
    S._arenaFlicker--;
  }

  // Perfect timing flash overlay
  if (S._perfectFlash && S._perfectFlash.alpha > 0) {
    ctx.save();
    ctx.globalAlpha = S._perfectFlash.alpha;
    ctx.fillStyle = S._perfectFlash.color;
    ctx.fillRect(0, 0, GW, GH);
    ctx.restore();
    S._perfectFlash.alpha -= 0.015;
    if (S._perfectFlash.alpha <= 0) S._perfectFlash = null;
  }

  // Zone glow under player based on position
  if (S.possession === 'a') {
    const ap = S.players[S.activeHuman];
    const d = Math.abs(ap.x - HOOP_X);
    if (d > SHOT_RANGE_2) {
      // 3pt zone — golden glow
      ctx.save();
      ctx.globalAlpha = 0.18 + Math.sin(S.frame * 0.1) * 0.05;
      ctx.fillStyle = '#FFD700';
      ctx.beginPath(); ctx.ellipse(ap.x, ap.y + 6, 22, 7, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    } else if (d < SHOT_RANGE_LAY && ap.hasBall) {
      // In the paint — red zone glow
      ctx.save();
      ctx.globalAlpha = 0.12 + Math.sin(S.frame * 0.18) * 0.06;
      ctx.fillStyle = '#FF4444';
      ctx.beginPath(); ctx.ellipse(ap.x, ap.y + 6, 26, 9, 0, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.restore();
    }
  }

  drawHUD();

  // Pause button (top-left)
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(8, 6, 20, 16);
  ctx.fillRect(8, 6, 6, 16); ctx.fillRect(22, 6, 6, 16);
  ctx.fillStyle = 'rgba(255,255,255,0.25)';

  drawControls();
  drawOnboarding();

  // Pass arrow + OPEN/LOBB indicator when teammate is unguarded
  if (S.possession === 'a') {
    const ap = S.players[S.activeHuman];
    const tmId = TEAM_A_IDS.find(id => id !== S.activeHuman);
    const tm = S.players[tmId];
    const closestDef = Math.min(...TEAM_B_IDS.map(id => Math.hypot(S.players[id].x - tm.x, S.players[id].y - tm.y)));
    const isOpen = closestDef > 70;
    const nearBasket = tm.x > HOOP_X - 75;
    const alleyOopReady = nearBasket && !TEAM_B_IDS.some(id => Math.hypot(S.players[id].x - tm.x, S.players[id].y - tm.y) < 55);
    if (ap.hasBall) {
      ctx.save();
      ctx.setLineDash([5, 8]);
      const lineColor = alleyOopReady ? 'rgba(255,100,0,0.6)' : isOpen ? 'rgba(255,215,0,0.45)' : 'rgba(255,215,0,0.2)';
      ctx.strokeStyle = lineColor;
      ctx.lineWidth = (alleyOopReady || isOpen) ? 2 : 1.5;
      ctx.beginPath(); ctx.moveTo(ap.x, ap.y); ctx.lineTo(tm.x, tm.y); ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }
    if ((isOpen || alleyOopReady) && ap.hasBall) {
      const pulse = 0.6 + Math.sin(S.frame * 0.22) * 0.3;
      ctx.save();
      // Subtle pulsing ring around open teammate
      ctx.globalAlpha = pulse * 0.5;
      ctx.strokeStyle = alleyOopReady ? '#FF8C00' : '#FFD700';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([4, 6]);
      ctx.beginPath(); ctx.ellipse(tm.x, tm.y + 4, 24 + Math.sin(S.frame * 0.22) * 3, 9, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = pulse;
      const label = alleyOopReady ? '🙌 LOBB!' : 'OPEN!';
      const labelColor = alleyOopReady ? '#FF8C00' : '#FFD700';
      ctx.fillStyle = labelColor;
      ctx.font = `bold ${alleyOopReady ? 10 : 9}px monospace`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.letterSpacing = '0';
      ctx.fillText(label, tm.x, tm.y - 195);
      ctx.restore();
    }
  }

  // Defense: pulse indicator on inactive defender (tap to switch)
  if (S.possession === 'b') {
    const defId = TEAM_A_IDS.find(id => id !== S.activeHuman);
    const defP = S.players[defId];
    const pulse = 0.25 + Math.sin(S.frame * 0.12) * 0.15;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = CHARS[defId].hue;
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.ellipse(defP.x, defP.y + 4, 22, 8, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = CHARS[defId].hue;
    ctx.font = '7px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText('TAP', defP.x, defP.y - 15);
    ctx.restore();
  }

  // Possession arrow — a small animated ball+arrow near the score
  const posX = S.possession === 'a' ? 148 : GW - 148;
  const posColor = S.possession === 'a' ? CHARS.nara.hue : CHARS.brendan.hue;
  const bounce = Math.sin(S.frame * 0.18) * 2;
  ctx.save();
  ctx.translate(posX, 28 + bounce);
  const dir = S.possession === 'a' ? 1 : -1;
  ctx.fillStyle = posColor;
  ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(S.possession === 'a' ? '▶' : '◀', 0, 0);
  circle(dir * 13, 0, 5, posColor);
  ctx.restore();
}

// ── Boot ─────────────────────────────────────────────────────────
initState();
loop();
</script>
</body>
</html>
