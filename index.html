// ── Audio ────────────────────────────────────────────────────────
let _audioCtx = null;
function getAudio() {
  if (!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return _audioCtx;
}
function playTone(freq, dur, type = 'sine', gain = 0.18, decay = true) {
  try {
    const ac = getAudio();
    const o = ac.createOscillator(), g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(gain, ac.currentTime);
    if (decay) g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.start(); o.stop(ac.currentTime + dur);
  } catch(e) {}
}
function sfxShoot() { playTone(220, 0.12, 'square', 0.1); }
function sfxSwish() {
  // Pure swish sound: soft descending tone
  playTone(1200, 0.06, 'sine', 0.12);
  setTimeout(() => playTone(900, 0.08, 'sine', 0.10), 55);
  setTimeout(() => playTone(700, 0.1, 'sine', 0.08), 110);
}
function sfxScore(pts) {
  const notes = pts === 3
    ? [523, 784, 1047, 1319, 1047] // rising + extra note for 3pt
    : [523, 659, 784, 1047];
  notes.forEach((f, i) => { setTimeout(() => playTone(f, 0.18, 'sine', 0.2), i * 75); });
}
function sfxDunk() {
  playTone(110, 0.18, 'square', 0.25);
  setTimeout(() => playTone(220, 0.15, 'sine', 0.2), 60);
  setTimeout(() => playTone(440, 0.12, 'sine', 0.18), 140);
}
function sfxAlleyOop() {
  [330, 494, 659, 880].forEach((f, i) => { setTimeout(() => playTone(f, 0.15, 'sine', 0.22), i * 60); });
}
function sfxMiss()  { playTone(180, 0.2, 'sawtooth', 0.08); }
function sfxSteal() { playTone(440, 0.08, 'square', 0.12); setTimeout(() => playTone(660, 0.08, 'square', 0.12), 80); }
function sfxClock() { playTone(880, 0.06, 'square', 0.15); }
function sfxRimHit() { playTone(320, 0.06, 'square', 0.06); }
function sfxCrowdOoh() {
  try {
    const ac = getAudio();
    const dur = 0.5;
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      const t = i / ac.sampleRate;
      data[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * t / dur) * 0.05;
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    src.connect(ac.destination); src.start();
  } catch(e) {}
}
function sfxCrowd(intensity) {
  try {
    const ac = getAudio();
    const dur = 0.35 + intensity * 0.3;
    const bufSize = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, bufSize, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) {
      data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 0.6) * (0.05 + intensity * 0.07);
    }
    const src = ac.createBufferSource();
    src.buffer = buf;
    src.connect(ac.destination);
    src.start();
  } catch(e) {}
}

function sfxAndOne() {
  playTone(330, 0.12, 'square', 0.10);
  setTimeout(() => playTone(494, 0.14, 'square', 0.12), 80);

function sfxPullUp3() {

function sfxGuitarStrum() {

  });

}

function sfxDeuceTension() {
  // Low sustained drone that plays once when deuce activates
  try {
    const ac = getAudio();
    const dur = 1.2;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(55, ac.currentTime);
    osc.frequency.linearRampToValueAtTime(80, ac.currentTime + dur);
    gain.gain.setValueAtTime(0, ac.currentTime);
    gain.gain.linearRampToValueAtTime(0.06, ac.currentTime + 0.2);
    gain.gain.linearRampToValueAtTime(0, ac.currentTime + dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + dur);
  } catch(e) {}
}
function sfxVictoryFanfare() {
  [[523,0],[784,80],[1047,160],[1319,240],[1047,340],[1319,420],[1568,500]].forEach(([f, t]) => {

}

// True touch/mobile device (not a desktop with a wide window)
const _isMobile = window.matchMedia('(pointer: coarse)').matches;

function fitCanvas() {
  const lw = window.innerWidth, lh = window.innerHeight;
  // Only rotate for landscape on actual touch/mobile devices, not desktop browsers
  const isLandscape = lw > lh && _isMobile;
  if (isLandscape) {
    _rotated = true;
    // Scale so portrait canvas (GW×GH) fits rotated in landscape (lw×lh)
    _scale = Math.min(lh / GW, lw / GH);
    const cw = GW * _scale, ch = GH * _scale;
    canvas.style.width  = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.style.left   = (lw / 2 - cw / 2) + 'px';
    canvas.style.top    = (lh / 2 - ch / 2) + 'px';
    canvas.style.transformOrigin = '50% 50%';
    canvas.style.transform = 'rotate(90deg)';
  } else {
    _rotated = false;
    _scale = Math.min(lw / GW, lh / GH);
    const cw = GW * _scale, ch = GH * _scale;
    canvas.style.width  = cw + 'px';
    canvas.style.height = ch + 'px';
    canvas.style.left   = ((lw - cw) / 2) + 'px';
    canvas.style.top    = ((lh - ch) / 2) + 'px';
    canvas.style.transform = '';
  }
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ── Drawing Helpers ─────────────────────────────────────────────
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function fillRR(x, y, w, h, r, fill, stroke, lw) {
  rr(x, y, w, h, r);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function circle(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

// ── Court Drawing ───────────────────────────────────────────────
function drawSky() {
  const g = ctx.createLinearGradient(0, 55, 0, FLOOR_Y);
  g.addColorStop(0, '#4A90C0');
  g.addColorStop(0.5, '#87CEEA');
  g.addColorStop(1, '#A8D8EA');
  ctx.fillStyle = g;
  ctx.fillRect(0, 55, GW, FLOOR_Y - 55);
  ctx.fillStyle = 'rgba(255,255,255,0.88)';
  for (const [x, y, r] of [[72,120,22],[98,110,26],[122,118,20],[50,124,17]]) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  for (const [x, y, r] of [[272,138,20],[295,128,24],[318,136,18],[252,142,15]]) {
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
}

function drawCrowd() {
  const baseY = FLOOR_Y - 8;
  const trees = [
    [20, 55], [58, 70], [96, 52], [138, 65],
    [178, 58], [218, 72], [256, 55], [294, 68],
    [332, 60], [368, 74],
  ];
  for (const [x, h] of trees) {
    const trunkH  = Math.round(h * 0.38);
    const crownRX = Math.round(h * 0.33);
    const crownRY = Math.round(h * 0.58);
    const crownY  = baseY - trunkH;
    ctx.fillStyle = '#2E1C0E';
    ctx.fillRect(x - 4, baseY - trunkH, 8, trunkH);
    ctx.fillStyle = '#174A0F';
    ctx.beginPath(); ctx.ellipse(x, crownY, crownRX, crownRY, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0F3009';
    ctx.beginPath(); ctx.ellipse(x + 6, crownY + 5, crownRX * 0.7, crownRY * 0.7, 0, 0, Math.PI*2); ctx.fill();
  }
}

function drawFloor() {
  const g = ctx.createLinearGradient(0, FLOOR_Y - 12, 0, FLOOR_Y + 60);
  g.addColorStop(0, '#3A7BC8');
  g.addColorStop(1, '#2A5BA8');
  ctx.fillStyle = g;
  ctx.fillRect(0, FLOOR_Y - 12, GW, 80);

  ctx.strokeStyle = 'rgba(0,0,0,0.35)';
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, FLOOR_Y - 12); ctx.lineTo(GW, FLOOR_Y - 12); ctx.stroke();

  ctx.save();
  ctx.lineCap = 'round';

  ctx.fillStyle = 'rgba(255, 200, 0, 0.65)';
  ctx.fillRect(210, FLOOR_Y - 12, HOOP_X + 12 - 210, 60);

  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(210, FLOOR_Y - 12); ctx.lineTo(HOOP_X + 12, FLOOR_Y - 12); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(210, FLOOR_Y - 12); ctx.lineTo(210, FLOOR_Y + 30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(HOOP_X + 12, FLOOR_Y - 12); ctx.lineTo(HOOP_X + 12, FLOOR_Y + 40); ctx.stroke();

  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(HOOP_X + 12, FLOOR_Y - 12, SHOT_RANGE_3, Math.PI * 0.52, Math.PI, false);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(35, FLOOR_Y - 12, 24, 0, Math.PI, true); ctx.stroke();

  ctx.restore();
}

function drawHoop() {
  const hx = HOOP_X, bx = HOOP_X + 14;

  ctx.fillStyle = '#999';
  ctx.strokeStyle = '#777';
  ctx.lineWidth = 1;
  ctx.fillRect(bx + 2, RIM_Y - 2, 5, FLOOR_Y - RIM_Y + 8);
  ctx.strokeRect(bx + 2, RIM_Y - 2, 5, FLOOR_Y - RIM_Y + 8);

  fillRR(bx, RIM_Y - 62, 13, 58, 2, '#FFFFFFEE', '#CCC', 1.5);
  ctx.strokeStyle = '#FF6600'; ctx.lineWidth = 2;
  ctx.strokeRect(bx + 2, RIM_Y - 38, 9, 24);

  ctx.strokeStyle = '#888'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx + 2, RIM_Y - 4); ctx.lineTo(hx, RIM_Y); ctx.stroke();

  ctx.strokeStyle = '#FF6600'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(bx, RIM_Y); ctx.lineTo(hx - RIM_R, RIM_Y); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(hx, RIM_Y, RIM_R, RIM_R * 0.3, 0, 0, Math.PI * 2); ctx.stroke();

  // Net — glows yellow-white on score
  const flash = S && S.hoopFlash ? S.hoopFlash : 0;
  const netColor = flash > 0 ? `rgba(255,240,${Math.floor(flash * 10)},${0.6 + flash / 25 * 0.4})` : '#FFF';
  ctx.strokeStyle = netColor; ctx.lineWidth = flash > 0 ? 2 : 1.2;
  if (flash > 0) {
    // Expanding swoosh ring on score
    const age = 25 - flash;
    const rExp = RIM_R + age * 3.5;
    const ringAlpha = flash / 25 * 0.55;
    ctx.save();
    ctx.globalAlpha = ringAlpha;
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 3 - age * 0.1;
    ctx.beginPath(); ctx.ellipse(hx, RIM_Y, rExp, rExp * 0.28, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    S.hoopFlash--;
  }
  const segs = 8, nh = 22;
  for (let i = 0; i <= segs; i++) {
    const a = (i / segs) * Math.PI * 2;
    ctx.beginPath();
    ctx.moveTo(hx + Math.cos(a) * RIM_R, RIM_Y + Math.sin(a) * RIM_R * 0.3);
    ctx.lineTo(hx + Math.cos(a) * RIM_R * 0.38, RIM_Y + nh);
    ctx.stroke();
  }
  for (let j = 1; j < 4; j++) {
    const t = j / 4, nr = RIM_R * (1 - t * 0.65), ny = RIM_Y + t * nh;
    ctx.beginPath(); ctx.ellipse(hx, ny, nr, nr * 0.25, 0, 0, Math.PI * 2); ctx.stroke();
  }
}

// ── Character Drawing ────────────────────────────────────────────
function drawChar(id, hasBall) {
  const p   = S.players[id];
  const f   = S.frame;
  const jy  = p.jumpY;
  const spr = sprites[id];
  const { anim } = p;

  ctx.save();
  ctx.translate(p.x, p.y + jy);

  // Depth scale: characters near the camera appear slightly larger
  const depth = Math.max(0, Math.min(1, (p.y - COURT_FAR_Y) / (COURT_NEAR_Y - COURT_FAR_Y)));
  const dsc = 0.85 + depth * 0.22;
  ctx.scale(dsc * (p.facing < 0 ? -1 : 1), dsc);

  let scX = 1, scY = 1, bobY = 0, lean = 0;
  if (anim === 'idle') {
    const phase = f * 0.05;
    bobY = Math.sin(phase) * 3.5;
    scX = 1 + Math.sin(phase) * 0.012;
    scY = 1 - Math.sin(phase) * 0.012;
  } else if (anim === 'run') {
    const phase = f * 0.20;
    const intensity = p.ai ? 0.75 : Math.min(1, Math.hypot(p.vx, p.vy) / 3.5);
    bobY = -Math.abs(Math.sin(phase)) * 5 * intensity;
    lean = Math.sin(phase) * 0.06 * intensity;
    const sq = Math.cos(phase);
    scX = 1 + sq * 0.03 * intensity;
    scY = 1 - sq * 0.02 * intensity;
  } else if (anim === 'jump') {
    scX = 0.87; scY = 1.16;
  } else if (anim === 'land') {
    const startF = p.landStartFrame > 0 ? p.landStartFrame : f;
    const age = Math.min(f - startF, 18);
    const t = age / 18;
    scX = 1 + (1 - t) * 0.22;
    scY = 1 - (1 - t) * 0.20;
    bobY = (1 - t) * 6;
  } else if (anim === 'celebrate') {
    const phase = f * 0.22;
    const lift = Math.abs(Math.sin(phase));
    bobY = -lift * 16;
    scX = 1 + (1 - lift) * 0.13 - lift * 0.04;
    scY = 1 - (1 - lift) * 0.09 + lift * 0.07;
  } else if (anim === 'shoot') {
    bobY = -10;
    scX = 0.92; scY = 1.10;
  } else if (anim === 'sad') {
    bobY = 6;
    scX = 1.05; scY = 0.92;
  }

  // Steal range ring flash
  if (p._stealRing > 0) {
    const age = 12 - p._stealRing;
    const rr2 = 30 + age * 3.5;
    ctx.save();
    ctx.globalAlpha = p._stealRing / 12 * 0.6;
    ctx.strokeStyle = '#FFD700';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, rr2, rr2 * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    p._stealRing--;
  }

  // Incoming pass glow
  if (S.ball._pass && S.ball._passTarget === id) {
    const pulse = 0.4 + Math.abs(Math.sin(S.frame * 0.3)) * 0.5;
    ctx.fillStyle = `rgba(255,215,0,${pulse * 0.25})`;
    ctx.beginPath(); ctx.ellipse(0, 0, 32, 32, 0, 0, Math.PI * 2); ctx.fill();
  }

  // Shadow
  ctx.save();
  const shadowW = (24 - Math.abs(jy) * 0.1) * scX;
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 4 - jy * 0.12, shadowW, 6, 0, 0, Math.PI * 2); ctx.fill();
  // Active player glow ring (offense and defense)
  if (id === S.activeHuman) {
    const pulse = 0.55 + Math.sin(f * 0.15) * 0.3;
    ctx.globalAlpha = pulse;
    // Hot hand: ring turns orange/red when on fire streak
    const onFire = S.streak >= 3;
    const ringColor = onFire
      ? (S.streak >= 5 ? '#FF3300' : '#FF8C00')
      : CHARS[id].hue;
    ctx.strokeStyle = ringColor;
    if (onFire) ctx.shadowColor = ringColor;
    ctx.lineWidth = onFire ? 4 : 3;
    ctx.beginPath(); ctx.ellipse(0, 4 - jy * 0.12, shadowW + 13, 10, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.shadowColor = 'transparent';
    ctx.globalAlpha = 1;
    // Small name tag
    ctx.save();
    ctx.scale(1 / (dsc * (p.facing < 0 ? -1 : 1)), 1 / dsc); // undo depth scale for text
    ctx.fillStyle = CHARS[id].hue;
    ctx.font = 'bold 8px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.letterSpacing = '0.08em';
    ctx.fillText(CHARS[id].name, 0, -185 / dsc);
    ctx.restore();
  }
  ctx.restore();

  ctx.translate(0, bobY);
  ctx.scale(scX, scY);
  if (lean) ctx.rotate(lean);

  if (spr && spr.complete && spr.naturalWidth > 0) {
    const H = 175;
    const W = H * spr.naturalWidth / spr.naturalHeight;
    ctx.drawImage(spr, -W / 2, -H, W, H);
  }
  drawCharOverlay(id);

  if (hasBall) {
    if (anim === 'shoot' || anim === 'jump') {
      drawBallAt(18, -175, 13);
    } else {
      // Dribble bounce: ball oscillates between hand (~-78) and floor (~-8)
      // abs-sin gives natural bounce arc: quick tap at floor, hang time at top
      const dribPct = Math.abs(Math.sin(f * 0.18));
      const handY = -78, floorY = -10;
      const by = handY + (floorY - handY) * (1 - dribPct);
      const bSize = 13 - (1 - dribPct) * 2;
      drawBallAt(30, by, bSize);
    }
  }

  ctx.restore();
}

function drawCharOverlay(id) {
  if (id === 'ethan') {
    // Neck skin patch (fixes any PIL transparency from old deployed sprite)
    ctx.fillStyle = '#C68642';
    ctx.beginPath(); ctx.ellipse(0, -126, 7, 5, 0, 0, Math.PI * 2); ctx.fill();

    // Straight shoulder-length brown hair panels covering original hippie hair
    ctx.fillStyle = '#3D2011';
    ctx.beginPath();
    ctx.moveTo(-8, -164); ctx.lineTo(-17, -162); ctx.lineTo(-19, -118); ctx.lineTo(-9, -118); ctx.lineTo(-9, -160);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(8, -164); ctx.lineTo(17, -162); ctx.lineTo(19, -118); ctx.lineTo(9, -118); ctx.lineTo(9, -160);
    ctx.closePath(); ctx.fill();
    // Subtle highlight stripe
    ctx.fillStyle = '#5C3520';
    ctx.beginPath();
    ctx.moveTo(-9, -162); ctx.lineTo(-11, -162); ctx.lineTo(-12, -120); ctx.lineTo(-10, -120);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(9, -162); ctx.lineTo(11, -162); ctx.lineTo(12, -120); ctx.lineTo(10, -120);
    ctx.closePath(); ctx.fill();

    // Backward black baseball cap
    ctx.fillStyle = '#0A0A0A';
    ctx.beginPath(); ctx.ellipse(0, -161, 15, 13, 0, Math.PI, 0); ctx.fill(); // dome
    ctx.fillRect(-15, -163, 30, 8); // cap band
    // Brim at back-of-head (left side when facing right)
    ctx.beginPath();
    ctx.moveTo(-12, -165); ctx.lineTo(-27, -166); ctx.lineTo(-28, -162); ctx.lineTo(-12, -161);
    ctx.closePath(); ctx.fill();
    // Snap tab at front
    ctx.fillStyle = '#2A2A2A';
    ctx.beginPath(); ctx.roundRect(13, -162, 5, 3, 1); ctx.fill();

    // Round dark sunglasses
    const eyeY = -150;
    ctx.fillStyle = 'rgba(5,5,5,0.88)';
    for (const ex of [-8, 8]) {
      ctx.beginPath(); ctx.arc(ex, eyeY, 5.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-2.5, eyeY); ctx.lineTo(2.5, eyeY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-13.5, eyeY); ctx.lineTo(-20, eyeY - 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13.5, eyeY); ctx.lineTo(20, eyeY - 1); ctx.stroke();
  }

  if (id === 'james') {
    // Dark camo bucket hat
    ctx.fillStyle = '#3A4A28';
    ctx.beginPath(); ctx.ellipse(0, -168, 14, 7, 0, 0, Math.PI * 2); ctx.fill(); // crown top
    ctx.fillRect(-14, -168, 28, 14); // crown body
    ctx.beginPath(); ctx.ellipse(0, -154, 22, 6, 0, 0, Math.PI * 2); ctx.fill(); // brim
    ctx.fillStyle = '#2A3318'; // brim underside
    ctx.beginPath(); ctx.ellipse(0, -153, 22, 4, 0, 0, Math.PI * 2); ctx.fill();
    // Camo blobs
    ctx.fillStyle = '#252E18';
    ctx.beginPath(); ctx.ellipse(-6, -163, 4, 3, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7, -159, 3, 2.5, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(1, -167, 2.5, 1.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#5A6A38';
    ctx.beginPath(); ctx.ellipse(-2, -161, 2.5, 2, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, -157, 2, 1.5, 0.4, 0, Math.PI * 2); ctx.fill();

    // Round amber-frame glasses
    const eyeYj = -149;
    ctx.strokeStyle = '#B87030'; ctx.lineWidth = 2;
    ctx.fillStyle = 'rgba(255,200,150,0.1)';
    for (const ex of [-8, 8]) {
      ctx.beginPath(); ctx.arc(ex, eyeYj, 5.5, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    }
    ctx.strokeStyle = '#B87030'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-2.5, eyeYj); ctx.lineTo(2.5, eyeYj); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-13.5, eyeYj); ctx.lineTo(-20, eyeYj - 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13.5, eyeYj); ctx.lineTo(20, eyeYj - 1); ctx.stroke();

    // 5 o'clock shadow
    ctx.fillStyle = 'rgba(65,35,15,0.42)';
    ctx.beginPath(); ctx.ellipse(0, -137, 11, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -144, 9, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  }

  if (id === 'brendan') {
    // Full reddish beard
    ctx.fillStyle = '#C03A15';
    ctx.beginPath(); ctx.ellipse(0, -131, 14, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -141, 11, 5, 0, 0, Math.PI * 2); ctx.fill(); // mustache
    ctx.fillStyle = '#E04A20';
    ctx.beginPath(); ctx.ellipse(0, -132, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#8A2510';
    ctx.beginPath(); ctx.ellipse(0, -122, 10, 5, 0, 0, Math.PI * 2); ctx.fill();

    // Curly hair — draw BEFORE beanie so hat sits on top; ringlet clusters zigzag down sides
    // Shadow pass
    ctx.fillStyle = '#0C0806';
    for (const [hx, hy, hr] of [
      [-15,-148,7],[-22,-144,6],[-17,-137,7],[-22,-131,6.5],[-16,-125,6.5],[-21,-119,6],
      [15,-148,7],[22,-144,6],[17,-137,7],[22,-131,6.5],[16,-125,6.5],[21,-119,6]
    ]) { ctx.beginPath(); ctx.arc(hx+1,hy+1,hr,0,Math.PI*2); ctx.fill(); }
    // Main curl body — alternating in/out positions = zigzag = looks wavy
    ctx.fillStyle = '#1C0E09';
    for (const [hx, hy, hr] of [
      [-15,-148,7],[-22,-144,6],[-17,-137,7],[-22,-131,6.5],[-16,-125,6.5],[-21,-119,6],
      [15,-148,7],[22,-144,6],[17,-137,7],[22,-131,6.5],[16,-125,6.5],[21,-119,6]
    ]) { ctx.beginPath(); ctx.arc(hx,hy,hr,0,Math.PI*2); ctx.fill(); }
    // Lighter midtone to separate individual curls
    ctx.fillStyle = '#3A1A0A';
    for (const [hx, hy, hr] of [
      [-15,-148,7],[-22,-144,6],[-17,-137,7],[-22,-131,6.5],[-16,-125,6.5],[-21,-119,6],
      [15,-148,7],[22,-144,6],[17,-137,7],[22,-131,6.5],[16,-125,6.5],[21,-119,6]
    ]) { ctx.beginPath(); ctx.arc(hx-hr*0.3,hy-hr*0.35,hr*0.45,0,Math.PI*2); ctx.fill(); }

    // Black beanie
    ctx.fillStyle = '#0F0F0F';
    ctx.beginPath(); ctx.ellipse(0, -163, 16, 13, 0, Math.PI, 0); ctx.fill(); // dome
    ctx.fillRect(-16, -165, 32, 13);
    ctx.fillStyle = '#0A0A0A';
    ctx.fillRect(-16, -154, 32, 5); // ribbed band
    ctx.strokeStyle = '#2A2A2A'; ctx.lineWidth = 0.8;
    for (let i = -14; i <= 14; i += 3) {
      ctx.beginPath(); ctx.moveTo(i, -155); ctx.lineTo(i, -150); ctx.stroke();
    }
  }
}

function drawFace(d, anim, hy, f) {
  const ey = hy - 2;
  let eyeW = 5, eyeH = 7;
  if (anim === 'celebrate') { eyeW = 7; eyeH = 10; }
  if (anim === 'sad')       { eyeH = 4; eyeW = 5; }
  if (anim === 'run')       { eyeH = 6; }

  for (const ex of [-6, 6]) {
    ctx.beginPath(); ctx.ellipse(ex, ey, eyeW, eyeH, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#FFF'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  const pupilOff = anim === 'sad' ? 0 : 1.5;
  for (const ex of [-6, 6]) {
    circle(ex + pupilOff, ey + 1, 2.5, '#000');
    circle(ex + pupilOff + 1, ey - 1, 1, '#FFF');
  }
  ctx.strokeStyle = d.brow; ctx.lineWidth = 2; ctx.lineCap = 'round';
  const browYOff = anim === 'celebrate' ? -4 : anim === 'sad' ? 0 : -2;
  const browSlant = anim === 'sad' ? 0.22 : anim === 'celebrate' ? -0.14 : 0;
  for (const [ex, sl] of [[-6, browSlant], [6, -browSlant]]) {
    ctx.save(); ctx.translate(ex, ey - eyeH - 2 + browYOff); ctx.rotate(sl);
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.lineTo(4, 0); ctx.stroke();
    ctx.restore();
  }
  if (d.hairStyle === 'glasses') {
    ctx.strokeStyle = '#222'; ctx.lineWidth = 2;
    for (const ex of [-6, 6]) {
      ctx.beginPath(); ctx.arc(ex, ey, eyeW + 2, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(-6 + eyeW + 2, ey); ctx.lineTo(6 - eyeW - 2, ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-6 - eyeW - 2, ey); ctx.lineTo(-6 - eyeW - 7, ey - 1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6 + eyeW + 2, ey); ctx.lineTo(6 + eyeW + 7, ey - 1); ctx.stroke();
  }
  const my = hy + 9;
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  if (anim === 'celebrate') {
    ctx.beginPath(); ctx.arc(0, my - 3, 7, 0.12, Math.PI - 0.12, false); ctx.stroke();
    rr(-6, my - 3, 12, 5, 3); ctx.fillStyle = '#FFFFFAe'; ctx.fill();
  } else if (anim === 'sad') {
    ctx.beginPath(); ctx.arc(0, my + 5, 6, Math.PI + 0.15, -0.15, false); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(0, my - 2, 4, 0.18, Math.PI - 0.18, false); ctx.stroke();
  }
  if (anim === 'celebrate' || d.name === 'NARA') {
    ctx.fillStyle = 'rgba(255,100,120,0.28)';
    ctx.beginPath(); ctx.ellipse(-10, my - 4, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, my - 4, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
  }
}

// ── Ball ─────────────────────────────────────────────────────────
function drawBallAt(x, y, r) {
  // Fire glow on streak (always visible when hot)
  if (S.streak >= 3) {
    const fireAlpha = 0.55 + Math.sin(S.frame * 0.18) * 0.25;
    ctx.save();
    ctx.globalAlpha = fireAlpha;
    ctx.shadowColor = S.streak >= 5 ? '#FF2200' : '#FF8800';
    ctx.shadowBlur = S.streak >= 5 ? 24 : 18;
    ctx.beginPath(); ctx.arc(x, y, r + (S.streak >= 5 ? 5 : 3), 0, Math.PI * 2);
    ctx.fillStyle = 'transparent'; ctx.fill();
    ctx.restore();
  }
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#E8751A'; ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = Math.max(1.5, r * 0.12); ctx.stroke();

  const sw = Math.max(2, r * 0.17);
  ctx.strokeStyle = '#111'; ctx.lineWidth = sw; ctx.lineCap = 'round';

  ctx.beginPath();
  for (let i = -r * 0.8; i <= r * 0.8; i += 2) {
    const wave = Math.sin(i * 0.4) * 3;
    const px = x - r * 0.3 + wave;
    const py = y + i;
    if (i === -r * 0.8) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.beginPath();
  for (let i = -r * 0.8; i <= r * 0.8; i += 2) {
    const wave = Math.sin(i * 0.4 + Math.PI) * 3;
    const px = x + r * 0.3 + wave;
    const py = y + i;
    if (i === -r * 0.8) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();

  ctx.beginPath();
  for (let i = -r; i <= r; i += 2) {
    const wave = Math.sin(i * 0.5) * 2;
    const px = x + i;
    const py = y + wave;
    if (i === -r) ctx.moveTo(px, py); else ctx.lineTo(px, py);
  }
  ctx.stroke();
}

function drawBall() {
  const b = S.ball;
  if (b.carrier) return;

  // Perfect shot trail
  if (b.inAir && b._perfect && S.frame % 2 === 0) {
    S.thoughts.push({
      x: b.x + (Math.random() - 0.5) * 10,
      y: b.y + (Math.random() - 0.5) * 10,
      text: '✨', ttl: 15, maxTtl: 15, dx: 0
    });
  }

  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.beginPath(); ctx.ellipse(b.x, FLOOR_Y + 4, 12 - (FLOOR_Y - b.y) * 0.04, 4, 0, 0, Math.PI * 2); ctx.fill();

  // Possession glow when ball is in air
  if (b.inAir && S.streak < 3) {
    const glowColor = S.possession === 'a' ? 'rgba(100,200,255,0.18)' : 'rgba(255,80,80,0.15)';
    ctx.save();
    ctx.shadowColor = S.possession === 'a' ? '#4ACFFF' : '#FF5555';
    ctx.shadowBlur = 10;
    ctx.fillStyle = glowColor;
    ctx.beginPath(); ctx.arc(b.x, b.y, 15, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // Draw with spin rotation
  ctx.save();
  ctx.translate(b.x, b.y);
  ctx.rotate(b.rot || 0);
  ctx.translate(-b.x, -b.y);
  drawBallAt(b.x, b.y, 12);
  ctx.restore();
}

function drawShotTrajectory() {
  if (!S.shootHeld || S.possession !== 'a') return;
  const ap = S.players[S.activeHuman];
  if (!ap.hasBall) return;

  const power = S.shootPower;
  const fromX = ap.x, fromY = ap.y + ap.jumpY - 55;
  const dx = HOOP_X - fromX;
  const dy = RIM_Y - fromY;
  const dist = Math.abs(fromX - HOOP_X);
  if (dist > SHOT_RANGE_3 + 30) return;

  // Check floater conditions (mirrors releaseShoot logic)
  const isFloaterArc = ap.vx > 2.0 && dist > SHOT_RANGE_LAY && dist < SHOT_RANGE_LAY + 62 &&
    TEAM_B_IDS.some(id => {
      const dp = S.players[id];
      return dp.x > HOOP_X - 70 && Math.abs(dp.y - ap.y) < 60;
    });

  const arcBonus = dist > SHOT_RANGE_2 ? 8 : dist > SHOT_RANGE_LAY ? 3 : 0;
  const tFly = 35 + dist * 0.08 + arcBonus + (isFloaterArc ? 14 : 0);
  const vx0 = dx / tFly;
  const vy0 = (dy - 0.225 * tFly * tFly) / tFly;

  const isChefCurry3 = (S._human3ptStreak || 0) >= 3 && dist > SHOT_RANGE_2;
  const greenLo3 = isChefCurry3 ? POWER_GREEN_LO - 8 : POWER_GREEN_LO;
  const greenHi3 = isChefCurry3 ? POWER_GREEN_HI + 8 : POWER_GREEN_HI;
  const inGreen = power >= greenLo3 && power <= greenHi3;
  const isPerfect = power >= 60 && power <= 68;

  // Color arc by power quality — floater gets a cyan/teal hue
  let arcColor;
  if (isFloaterArc && inGreen)  arcColor = 'rgba(0,220,200,0.55)';
  else if (isFloaterArc)        arcColor = 'rgba(0,180,180,0.35)';
  else if (isPerfect && !isChefCurry3) arcColor = 'rgba(0,255,136,0.55)';
  else if (inGreen && isChefCurry3) arcColor = 'rgba(255,215,0,0.55)';
  else if (inGreen)   arcColor = 'rgba(80,220,80,0.4)';
  else if (power < 5) arcColor = 'rgba(255,255,255,0.18)';
  else                arcColor = 'rgba(255,160,30,0.32)';

  ctx.save();
  ctx.setLineDash([4, 7]);
  ctx.strokeStyle = arcColor;
  ctx.lineWidth = inGreen ? 2 : 1.5;
  ctx.beginPath();
  let bx = fromX, by = fromY, bvy = vy0;
  ctx.moveTo(bx, by);
  for (let t = 1; t <= tFly; t++) {
    bvy += 0.45;
    bx += vx0;
    by += bvy;
    if (t % 2 === 0) ctx.lineTo(bx, by);
    if (by > FLOOR_Y) break;
  }
  ctx.stroke();
  ctx.setLineDash([]);
  // Endpoint dot at rim — brighter when in sweet spot
  ctx.beginPath(); ctx.arc(HOOP_X, RIM_Y, inGreen ? 5 : 3.5, 0, Math.PI * 2);
  ctx.fillStyle = isChefCurry3 && inGreen ? 'rgba(255,215,0,0.85)' : inGreen ? 'rgba(0,255,136,0.7)' : 'rgba(255,255,255,0.3)';
  ctx.fill();
  ctx.restore();
}

// ── Shot Type Label ───────────────────────────────────────────────
function drawShotTypeLabel() {
  if (!S.shootHeld || S.possession !== 'a') return;
  const ap = S.players[S.activeHuman];
  if (!ap.hasBall) return;
  const dist = Math.abs(ap.x - HOOP_X);
  // Floater: driving into paint with defender in lane
  const isFloaterLabel = ap.vx > 2.0 && dist > SHOT_RANGE_LAY && dist < SHOT_RANGE_LAY + 62 &&
    TEAM_B_IDS.some(id => {
      const dp = S.players[id];
      return dp.x > HOOP_X - 70 && Math.abs(dp.y - ap.y) < 60;
    });
  // Turnaround: player facing away from basket in mid-range
  const isTurnaround = ap.facing === -1 && dist > SHOT_RANGE_LAY && dist <= SHOT_RANGE_2;
  // Pull-up 3: driving toward basket and shooting from 3pt range
  const isPullUp3Label = ap.vx > 1.2 && dist > SHOT_RANGE_2 && dist <= SHOT_RANGE_3;
  let label, labelColor;
  if (isFloaterLabel)               { label = 'FLOATER'; labelColor = '#00DCC8'; }
  else if (dist <= SHOT_RANGE_LAY)  { label = 'LAYUP'; labelColor = CHARS[S.activeHuman].hue; }
  else if (isTurnaround)            { label = 'TURNAROUND'; labelColor = '#FF8C00'; }
  else if (dist <= SHOT_RANGE_2)    { label = 'MID RANGE'; labelColor = '#FFD700'; }
  else if (isPullUp3Label)          { label = 'PULL UP 3'; labelColor = '#00E5FF'; }
  else if (dist <= SHOT_RANGE_3)    { label = '3-POINTER'; labelColor = '#00CFFF'; }
  else return;
  const age = (S.shootPower < 5) ? S.shootPower / 5 : 1;
  ctx.save();
  ctx.globalAlpha = age * 0.7;
  ctx.font = 'bold 9px monospace'; ctx.letterSpacing = '0.12em';
  ctx.fillStyle = labelColor;
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(label, ap.x, ap.y + ap.jumpY - 190);
  ctx.restore();
}

// ── Power Indicator (hoop ring shows green zone) ──────────────────
function drawPowerIndicator() {
  if (S.possession !== 'a') return;
  const power = S.shootPower;
  if (power < 1) return;
  const isChefCurry2 = (S._human3ptStreak || 0) >= 3;
  const greenLo2 = isChefCurry2 ? POWER_GREEN_LO - 8 : POWER_GREEN_LO;
  const greenHi2 = isChefCurry2 ? POWER_GREEN_HI + 8 : POWER_GREEN_HI;
  const inGreen = power >= greenLo2 && power <= greenHi2;
  const alpha = 0.35 + (power / 100) * 0.5;
  const color = isChefCurry2 && inGreen ? `rgba(255,200,0,${alpha})` : inGreen ? `rgba(0,255,136,${alpha})` : `rgba(255,200,0,${alpha})`;

  ctx.beginPath(); ctx.arc(HOOP_X, RIM_Y, RIM_R + 10, 0, Math.PI * 2);
  ctx.strokeStyle = color; ctx.lineWidth = inGreen ? 4 : 2.5;
  ctx.stroke();

  if (inGreen) {
    ctx.strokeStyle = isChefCurry2 ? 'rgba(255,220,0,0.8)' : 'rgba(255,255,255,0.65)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(HOOP_X, RIM_Y, RIM_R + 16, 0, Math.PI * 2); ctx.stroke();
  }
}

// ── Thoughts / Popups ────────────────────────────────────────────
function spawnThought(id, text) {
  const p = S.players[id];
  // Color code by outcome
  const isGood = /PERFECT|GOOD|DUNK|LAYUP|ALLEY|FIRE|CLUTCH|SWISH|YES|LFG|NICE|MONEY|ONE/.test(text);
  const isBad  = /MISS|EARLY|LATE|AIR BALL|TOO FAR/.test(text);
  const bg = isGood ? '#E8FFE8EE' : isBad ? '#FFE8E8EE' : '#FFFFFAEE';
  S.thoughts.push({
    x: p.x, y: p.y + p.jumpY - 158,
    text, ttl: 90, maxTtl: 90,
    dx: (Math.random() - 0.5) * 0.5,
    bg,
  });
}

function drawThoughts() {
  for (const th of S.thoughts) {
    const alpha = Math.min(1, th.ttl / 20);
    const sc    = 1 + (1 - th.ttl / th.maxTtl) * 0.18;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(th.x, th.y);
    ctx.scale(sc, sc);

    const tw = ctx.measureText(th.text).width + 18;
    const th2 = 28;
    fillRR(-tw / 2, -th2 / 2, tw, th2, 12, th.bg || '#FFFFFAEE', '#000', 2);
    ctx.beginPath();
    ctx.moveTo(-5, th2 / 2); ctx.lineTo(5, th2 / 2); ctx.lineTo(0, th2 / 2 + 10);
    ctx.closePath(); ctx.fillStyle = '#FFFFFAEE'; ctx.fill();
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = '#111'; ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(th.text, 0, 0);
    ctx.restore();
  }
}

function drawOnboarding() {
  if (S.onboardingTimer <= 0) return;
  
  const alpha = Math.min(1, S.onboardingTimer / 30) * 0.7;
  ctx.save();
  ctx.globalAlpha = alpha;
  
  const cx = 90, cy = 650, r = 35;
  ctx.strokeStyle = '#FFFFFF';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Draw 4 arrows (Up, Down, Left, Right)
  const drawArr = (x, y, ang) => {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);
    ctx.beginPath();
    ctx.moveTo(-8, 5); ctx.lineTo(0, -5); ctx.lineTo(8, 5);
    ctx.stroke();
    ctx.restore();
  };

  drawArr(cx, cy - r, 0);          // Up
  drawArr(cx, cy + r, Math.PI);    // Down
  drawArr(cx - r, cy, -Math.PI/2); // Left
  drawArr(cx + r, cy, Math.PI/2);  // Right

  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('MOVE IN 3D', cx, cy + 70);
  
  ctx.restore();
}

// ── Animated crowd overlay (stand-goers bouncing in stands) ───────
const _crowdDots = Array.from({length: 55}, (_, i) => ({
  x: 8 + Math.random() * (GW - 16),
  y: 20 + Math.random() * 160,
  r: 2.5 + Math.random() * 2,
  phase: Math.random() * Math.PI * 2,
  spd: 0.03 + Math.random() * 0.04,
  color: ['#FF69B4','#FFD700','#00CFFF','#FF4444','#98FB98','#FFF','#FF8C00'][i % 7],
  alpha: 0.12 + Math.random() * 0.14,
}));

function drawAnimatedCrowd() {
  if (S.screen !== 'playing') return;
  const energyPct = (S._crowdEnergy || 0) / 100;
  const excited = S.shake > 0 || energyPct > 0.4 || S._deuceActive || S.streak >= 3;
  ctx.save();
  for (const d of _crowdDots) {
    const bobAmp = excited ? 2 + energyPct * 4 : 1.2;
    const bob = Math.sin(S.frame * d.spd + d.phase) * bobAmp;
    ctx.globalAlpha = d.alpha * (1 + energyPct * 0.8);
    // High energy: tint toward team colors
    if (energyPct > 0.6) {
      ctx.fillStyle = Math.random() < 0.3 ? CHARS.nara.hue : d.color;
    } else {
      ctx.fillStyle = d.color;
    }
    ctx.beginPath();
    ctx.arc(d.x, d.y + bob, d.r * (1 + energyPct * 0.3), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // Crowd chant text — pulses during exciting moments
  if (S.screen === 'playing') {
    let chant = null;
    if (S.streak >= 5)               chant = { text: 'NA-RA!  NA-RA!', color: CHARS.nara.hue, speed: 0.28 };
    else if (S.streak >= 3)          chant = { text: 'LET\'S  GO!  LET\'S  GO!', color: CHARS.nara.hue, speed: 0.22 };
    else if (S._deuceActive)         chant = { text: 'WIN  IT!  WIN  IT!', color: '#FFD700', speed: 0.20 };
    else if ((S._cpuStreak||0) >= 3) chant = { text: 'DE-FENSE!  DE-FENSE!', color: '#FF6060', speed: 0.18 };
    else if ((S._crowdEnergy||0) > 75) chant = { text: '🔥  CROWD  IS  HOT  🔥', color: '#FF8C00', speed: 0.15 };
    if (chant) {
      const beatPulse = 0.5 + Math.sin(S.frame * chant.speed) * 0.45;
      if (beatPulse > 0.1) {
        ctx.save();
        ctx.globalAlpha = beatPulse * 0.55;
        ctx.fillStyle = chant.color;
        ctx.font = 'bold 9px monospace';
        ctx.letterSpacing = '0.05em';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(chant.text, GW / 2, 16);
        ctx.restore();
      }
    }
  }
}

// ── Confetti + Trail + Switch Flash ─────────────────────────────
function drawBallTrail() {
  const trail = S.ballTrail;
  // Hot trail when on fire streak, rainbow 3pt trail
  const onFire = S.streak >= 3;
  const is3pt = S.ball._fromX !== undefined && Math.abs(S.ball._fromX - HOOP_X) > SHOT_RANGE_2;
  const isFastBreakBall = S._fastBreak > 80 && S.ball.inAir;
  const isFloaterBall = S.ball.inAir && (S.ball._floater || false);
  for (let i = 0; i < trail.length; i++) {
    const t = i / trail.length;
    const alpha = t * 0.42;
    const r = 3 + t * 5;
    ctx.beginPath(); ctx.arc(trail[i].x, trail[i].y, r, 0, Math.PI * 2);
    if (isFastBreakBall) {
      const hue = 180 + t * 60; // cyan → blue comet trail
      ctx.fillStyle = `hsla(${hue},100%,70%,${alpha * 1.3})`;
    } else if (isFloaterBall) {
      ctx.fillStyle = `rgba(0,220,200,${alpha})`;
    } else if (is3pt) {
      const hue = 200 + t * 160;
      ctx.fillStyle = `hsla(${hue},100%,65%,${alpha})`;
    } else if (onFire) {
      ctx.fillStyle = `rgba(255,${Math.floor(80 + t * 120)},0,${alpha})`;
    } else {
      ctx.fillStyle = `rgba(232,117,26,${alpha})`;
    }
    ctx.fill();
  }
}

function spawnCrowdBurst(colors) {
  // Left and right edge bursts
  for (let i = 0; i < 14; i++) {
    const side = i < 7 ? 0 : GW;
    const dir = i < 7 ? 1 : -1;
    S.confetti.push({
      x: side + (Math.random()-0.5)*20,
      y: 60 + Math.random() * (FLOOR_Y - 100),
      vx: dir * (3 + Math.random() * 5),
      vy: -2 - Math.random() * 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 5 + Math.random() * 5,
      ttl: 35 + Math.floor(Math.random() * 20),
      rot: Math.random() * Math.PI * 2,
      dRot: (Math.random()-0.5) * 0.25,
    });
  }
}

function updateAndDrawConfetti() {
  for (let i = S.confetti.length - 1; i >= 0; i--) {
    const c = S.confetti[i];
    c.vy += 0.4;
    c.x += c.vx; c.y += c.vy;
    c.rot += c.dRot;
    c.ttl--;
    if (c.ttl <= 0 || c.y > FLOOR_Y + 50) { S.confetti.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = Math.min(1, c.ttl / 20);
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color;
    ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
    ctx.restore();
  }
}

function drawSwitchFlash() {
  if (!S.switchFlash || S.switchFlash.ttl <= 0) return;
  const pct = S.switchFlash.ttl / 70;
  S.switchFlash.ttl--;
  ctx.save();
  ctx.globalAlpha = pct * 0.9;
  ctx.fillStyle = S.switchFlash.color;
  ctx.font = `bold ${14 + (1 - pct) * 8}px monospace`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.letterSpacing = '0.1em';
  ctx.fillText('NOW: ' + S.switchFlash.name, GW / 2, GH / 2 - 40);
  ctx.restore();
}

  '',

  '  Square pad — move in 3D',
  '  SHOOT — hold to charge, release',

];

function drawHUD() {
  ctx.fillStyle = '#1a0a3e';
  ctx.fillRect(0, 0, GW, 55);

  // Score glow on game point
  if (S.score[0] === WIN_SCORE - 1) {
    const gp = 0.4 + Math.sin(S.frame * 0.12) * 0.3;
    ctx.shadowColor = CHARS.nara.hue; ctx.shadowBlur = 14 * gp;
  }
  ctx.fillStyle = CHARS.nara.hue;
  ctx.font = 'bold 32px monospace';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(S.score[0], 80, 28);
  ctx.shadowBlur = 0;

  if (S.score[1] === WIN_SCORE - 1) {
    const gp = 0.4 + Math.sin(S.frame * 0.12) * 0.3;
    ctx.shadowColor = CHARS.brendan.hue; ctx.shadowBlur = 14 * gp;
  }
  ctx.fillStyle = CHARS.brendan.hue;
  ctx.fillText(S.score[1], GW - 80, 28);
  ctx.shadowBlur = 0;

  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(GW / 2 - 1, 8, 2, 38);

  ctx.font = '9px monospace'; ctx.letterSpacing = '0.08em';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('🎸 NARA\'S ROOM', 80, 47);
  ctx.fillText('ALL-STARS 🏅', GW - 80, 47);

  // Score differential / deuce indicator
  const diff = S.score[0] - S.score[1];
  if (S._deuceActive && diff === 0) {
    const dp = 0.6 + Math.sin(S.frame * 0.14) * 0.35;
    ctx.fillStyle = `rgba(255,215,0,${dp})`;
    ctx.font = 'bold 10px monospace';
    ctx.fillText('DEUCE', GW / 2, 28);
    ctx.font = 'bold 32px monospace';
  } else if (S._deuceActive && Math.abs(diff) === 1) {
    const advColor = diff > 0 ? CHARS.nara.hue : CHARS.brendan.hue;
    const dp = 0.7 + Math.sin(S.frame * 0.14) * 0.25;
    ctx.fillStyle = `rgba(255,215,0,${dp})`;
    ctx.font = 'bold 9px monospace';
    ctx.fillText('ADV', GW / 2, 28);
    ctx.font = 'bold 32px monospace';
  } else if (diff === 0) {
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillText('TIED', GW / 2, 28);
  } else {
    const leader = diff > 0 ? CHARS.nara.hue : CHARS.brendan.hue;
    ctx.fillStyle = leader;
    ctx.fillText((diff > 0 ? '+' : '') + diff, GW / 2, 28);
  }

  // Momentum bar — narrow strip just below HUD
  {
    const total = Math.max(1, S.score[0] + S.score[1]);
    const humanPct = S.score[0] / total;
    const barW = GW - 80, barX = 40, barY = 52, barH = 3;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(barX, barY, barW, barH);
    const fillW = barW * humanPct;
    const barGrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
    barGrad.addColorStop(0, CHARS.nara.hue);
    barGrad.addColorStop(1, CHARS.brendan.hue);
    ctx.fillStyle = barGrad;
    ctx.fillRect(barX, barY, fillW, barH);

    // Crowd energy indicator (right side of HUD, 2px tall)
    const ce = (S._crowdEnergy || 0) / 100;
    if (ce > 0) {
      const ceW = (barW * ce) | 0;
      ctx.globalAlpha = 0.55;
      ctx.fillStyle = ce > 0.7 ? '#FF69B4' : ce > 0.4 ? '#FFD700' : CHARS.nara.hue;
      ctx.fillRect(barX, barY + 4, ceW, 2);
      ctx.globalAlpha = 1;
    }
  }

  // Shot clock
  if (S.screen === 'playing') {
    const secs = Math.ceil(S.shotClock / 60);
    const urgent = secs <= 3;
    const warning = secs <= 5;
    if (urgent && S.possession === 'a') {
      const pulse = 0.3 + Math.sin(S.frame * 0.6) * 0.22;
      ctx.save();
      ctx.fillStyle = `rgba(255,40,40,${pulse})`;
      ctx.fillRect(GW / 2 - 22, 32, 44, 18);
      ctx.restore();
    }
    ctx.font = `bold ${urgent ? '13' : '11'}px monospace`; ctx.letterSpacing = '0';
    ctx.fillStyle = urgent && S.possession === 'a' ? '#FF2222' : warning && S.possession === 'a' ? '#FF9900' : 'rgba(255,255,255,0.45)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(secs + 's', GW / 2, 44);
    // Big countdown pop when each second ticks
    if (S.possession === 'a' && S.shotClock % 60 === 59 && secs <= 4 && secs > 0) {
      S.thoughts.push({ x: GW / 2, y: 200, text: `⏰ ${secs}!`, ttl: 35, maxTtl: 35, dx: 0, bg: '#FF2222CC' });
    }
  }

  // ON FIRE / fast break banners
  if (S.screen === 'playing' && S._fastBreak > 0) {
    const pct = S._fastBreak / 150;
    ctx.save();
    ctx.globalAlpha = Math.min(1, pct * 3);
    ctx.fillStyle = 'rgba(255,140,0,0.18)';
    ctx.fillRect(0, 55, GW, 20);
    ctx.font = 'bold 11px monospace'; ctx.letterSpacing = '0.08em';
    ctx.fillStyle = '#FFB300';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('⚡ FAST BREAK ⚡', GW / 2, 65);
    ctx.restore();
  } else if (S.screen === 'playing' && S._fireMode) {
    // Fire mode banner (overrides streak display when active)
    const fPct = S._fireModeFrames / 480;
    const pulse = 0.75 + Math.sin(S.frame * 0.28) * 0.2;
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.fillStyle = 'rgba(255,69,0,0.18)';
    ctx.fillRect(0, 55, GW * fPct, 20);
    ctx.font = 'bold 11px monospace'; ctx.letterSpacing = '0.06em';
    ctx.fillStyle = '#FF4500';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('🔥 FIRE MODE — ' + S._hotHand + ' IN A ROW', 14, 65);
    ctx.restore();
  } else if (S.screen === 'playing' && S.streak >= 3) {
    ctx.save();
    ctx.font = 'bold 10px monospace'; ctx.letterSpacing = '0';
    ctx.fillStyle = S.streak >= 5 ? '#FF4500' : '#FF8C00';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    const fireLabel = S.streak >= 5 ? '🔥🔥 UNSTOPPABLE ×' + S.streak : '🔥 ON FIRE ×' + S.streak;
    ctx.fillText(fireLabel, 18, 12);
    ctx.restore();
  }

  // Human timeout indicator (top left, tiny) — pulses urgently during a CPU run
  if (S.screen === 'playing') {
    const toAvail = (S._humanTimeouts || 0) > 0;
    const cpuOnRun = (S._cpuStreak || 0) >= 3;
    const pulse = toAvail && cpuOnRun ? (0.55 + Math.sin(S.frame * 0.22) * 0.4) : toAvail ? 0.75 : 0.2;
    const borderCol = toAvail && cpuOnRun ? '#FF4444' : toAvail ? '#00CFFF' : '#555';
    ctx.save();
    ctx.globalAlpha = pulse;
    fillRR(6, 6, 26, 12, 4, 'rgba(0,0,0,0.6)', borderCol, toAvail && cpuOnRun ? 1.5 : 1);
    ctx.fillStyle = borderCol;
    ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '0';
    ctx.fillText('T/O', 19, 12);
    ctx.restore();
  }

  // Zone defense indicator (shows when CPU in zone)
  if (S.screen === 'playing' && S._cpuInZone) {
    const zp = 0.65 + Math.sin(S.frame * 0.15) * 0.2;
    ctx.save();
    ctx.globalAlpha = zp;
    fillRR(36, 6, 28, 12, 4, 'rgba(0,0,0,0.6)', CHARS.brendan.hue, 1.5);
    ctx.fillStyle = CHARS.brendan.hue;
    ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.letterSpacing = '0';
    ctx.fillText('ZONE', 50, 12);
    ctx.restore();
  }

  // Difficulty badge (tiny, top right area)
  {
    const diff = S._difficulty || 'normal';
    const diffColors = { easy: '#32CD32', normal: '#FFD700', hard: '#FF4444' };
    const diffLabels = { easy: 'EASY', normal: 'NOR', hard: 'HARD' };
    ctx.save();
    ctx.globalAlpha = 0.55;
    fillRR(341, 6, 28, 12, 4, 'rgba(0,0,0,0.6)', diffColors[diff], 1);
    ctx.fillStyle = diffColors[diff];
    ctx.font = 'bold 7px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.letterSpacing = '0';
    ctx.globalAlpha = 0.75;
    ctx.fillText(diffLabels[diff], 355, 12);
    ctx.restore();
  }

  // Info button
  ctx.letterSpacing = '0';
  circle(374, 14, 11, '#1a0a3e', 'rgba(255,255,255,0.3)', 1.5);
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.font = 'bold 12px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('i', 374, 15);

  // Info panel
  if (S.showInfo) {
    ctx.save();
    ctx.fillStyle = 'rgba(15,5,40,0.95)';
    fillRR(20, 60, GW - 40, INFO_LINES.length * 18 + 24, 10, 'rgba(15,5,40,0.95)', 'rgba(255,255,255,0.2)', 1.5);
    ctx.font = '11px monospace'; ctx.letterSpacing = '0';
    let iy = 78;
    for (const line of INFO_LINES) {
      const isBold = !line.startsWith('  ') && line.length > 0;
      ctx.font = (isBold ? 'bold ' : '') + '11px monospace';
      ctx.fillStyle = line.startsWith('  ') ? 'rgba(255,255,255,0.7)' : '#FFF';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(line, 34, iy);
      iy += 18;
    }
    ctx.restore();
  }

  if (S.scoreFlash && S.scoreFlash.ttl > 0) {
    const pct = S.scoreFlash.ttl / 70;
    ctx.save();
    ctx.globalAlpha = pct;
    ctx.font = `bold ${36 + (1 - pct) * 20}px monospace`;
    ctx.fillStyle = S.scoreFlash.color;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(S.scoreFlash.text, GW / 2, 130);
    ctx.restore();
  }
}

// ── Controls UI ──────────────────────────────────────────────────
function drawControls() {
  const isAttacking = S.possession === 'a';
  const power  = isAttacking ? S.shootPower : S.blockPower;
  const isHeld = isAttacking ? S.shootHeld  : S.blockHeld;

  // Joystick zone (left) — square pad
  const JOY_SZ = 110; // side length
  const JOY_CX = 90, JOY_CY = 650;
  if (!S.joy.active) {
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(JOY_CX - JOY_SZ / 2, JOY_CY - JOY_SZ / 2, JOY_SZ, JOY_SZ, 12);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.font = '10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('MOVE', JOY_CX, JOY_CY);
  } else {
    const hw = JOY_SZ / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.06)';
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(S.joy.ox - hw, S.joy.oy - hw, JOY_SZ, JOY_SZ, 12);
    ctx.fill(); ctx.stroke();
    const kx = S.joy.ox + S.joy.dx, ky = S.joy.oy + S.joy.dy;
    circle(kx, ky, 26, 'rgba(255,255,255,0.2)', 'rgba(255,255,255,0.4)', 2);
  }

  // Main action button (SHOOT / BLOCK) — hold to charge
  const actionLabel = isAttacking ? 'SHOOT' : 'BLOCK';
  const actionColor = isAttacking ? CHARS.nara.hue : '#00BFFF';
  const inGreen = isAttacking && power >= POWER_GREEN_LO && power <= POWER_GREEN_HI;
  const btnAlpha = isHeld ? 0.6 : 0.35;

  circle(300, 640, 42, `rgba(0,0,0,${btnAlpha})`, actionColor, 2.5);

  // AC-style: shrinking circle that fills as power builds
  if (isHeld && power > 0) {
    const t = power / 100;
    const maxR = 70, btnR = 44;
    const r = maxR - (maxR - btnR) * t;
    const startA = -Math.PI / 2;
    const fillA  = startA + t * Math.PI * 2;

    // Green target band (the radii where the sweet spot lives)
    if (isAttacking) {
      const rLo = maxR - (maxR - btnR) * (POWER_GREEN_LO / 100);
      const rHi = maxR - (maxR - btnR) * (POWER_GREEN_HI / 100);
      ctx.beginPath();
      ctx.arc(300, 640, (rLo + rHi) / 2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0,255,136,0.35)';
      ctx.lineWidth = rLo - rHi + 5;
      ctx.stroke();
    }

    // Background ring
    ctx.beginPath(); ctx.arc(300, 640, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 7; ctx.stroke();

    // Filled pie sector
    ctx.save();
    ctx.globalAlpha = 0.38;
    ctx.fillStyle = inGreen ? '#00FF88' : actionColor;
    ctx.beginPath();
    ctx.moveTo(300, 640);
    ctx.arc(300, 640, r, startA, fillA);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Bright arc edge on the fill
    ctx.beginPath(); ctx.arc(300, 640, r, startA, fillA);
    ctx.strokeStyle = inGreen ? '#00FF88' : actionColor;
    ctx.lineWidth = 3; ctx.stroke();

    // Dim circle outline
    ctx.beginPath(); ctx.arc(300, 640, r, 0, Math.PI * 2);
    ctx.strokeStyle = inGreen ? 'rgba(0,255,136,0.45)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1.5; ctx.stroke();

    // Green zone pulse glow
    if (inGreen) {
      const gpulse = 0.45 + Math.sin(S.frame * 0.55) * 0.35;
      ctx.save();
      ctx.globalAlpha = gpulse;
      ctx.beginPath(); ctx.arc(300, 640, r + 8, 0, Math.PI * 2);
      ctx.strokeStyle = '#00FF88';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#00FF88'; ctx.shadowBlur = 16;
      ctx.stroke();
      ctx.restore();
    }
  }

  ctx.fillStyle = inGreen ? '#00FF88' : actionColor;
  ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(actionLabel, 300, 640);

  // Pass / Steal button (below)
  const passLabel  = isAttacking ? 'PASS' : 'STEAL';
  const passColor  = '#FFD700';
  circle(300, 710, 28, 'rgba(0,0,0,0.25)', passColor, 2);
  ctx.fillStyle = passColor;
  ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(passLabel, 300, 710);

  // Hold hint when button not pressed
  if (!isHeld) {
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.font = '8px monospace'; ctx.textAlign = 'center';
    ctx.fillText(isAttacking ? 'HOLD' : 'HOLD', 300, 658);
  }
}

function drawCharSelect() {

  bg.addColorStop(0, '#1a0a3e'); bg.addColorStop(1, '#0a0a30');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, GW, GH);

  const step     = S._charSelectStep || 1;
  const chosen   = S._selectedPlayer;
  const teammate = S._selectedTeammate;

  // Header
  ctx.save();
  ctx.translate(GW / 2, 72);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (step === 1) {
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 13px monospace'; ctx.letterSpacing = '0.2em';
    ctx.fillText('PICK YOUR PLAYER', 0, 0);
  } else {
    ctx.fillStyle = CHARS[chosen].hue;
    ctx.font = 'bold 11px monospace'; ctx.letterSpacing = '0.15em';
    ctx.fillText(CHARS[chosen].name + '  ✓', 0, -11);
    ctx.fillStyle = '#FFD700';
    ctx.font = 'bold 12px monospace'; ctx.letterSpacing = '0.2em';
    ctx.fillText('PICK TEAMMATE', 0, 7);
  }
  ctx.restore();

  const all = ['nara', 'ethan', 'brendan', 'james'];
  const CX  = [50, 148, 246, 344];
  const CY  = 330;

  for (let i = 0; i < 4; i++) {
    const id  = all[i];
    const cx  = CX[i];
    const d   = CHARS[id];
    const isChosen = id === chosen;
    const isTm     = id === teammate;
    const isGrayed = step === 2 && isChosen;
    const bob = Math.sin(S.frame * 0.04 + i * 1.2) * 4;

    ctx.save();
    if (isGrayed) ctx.globalAlpha = 0.4;
    if (isChosen || isTm) { ctx.shadowColor = d.hue; ctx.shadowBlur = 20; }
    ctx.translate(cx, CY + bob);
    if (i >= 2) ctx.scale(-1, 1);
    drawCharSprite(id, 'idle', S.frame + i * 30);
    ctx.restore();

    const isSel = isChosen || isTm;
    fillRR(cx - 32, CY + 8, 64, 52, 6,
      isSel ? d.hue : (isGrayed ? 'rgba(40,30,70,0.5)' : 'rgba(0,0,0,0.65)'),
      isSel ? '#FFF' : d.hue, isSel ? 2 : 1);
    ctx.fillStyle = isSel ? '#111' : (isGrayed ? 'rgba(255,255,255,0.3)' : d.hue);
    ctx.font = 'bold 9px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.letterSpacing = '0';
    ctx.fillText(d.name, cx, CY + 20);
    ctx.fillStyle = isSel ? '#222' : 'rgba(255,255,255,0.5)';
    ctx.font = '7px monospace';
    ctx.fillText((d.abilityEmoji || '') + ' ' + (d.ability || '').split(' ')[0], cx, CY + 31);
    if (isChosen) {
      ctx.fillStyle = '#111'; ctx.font = 'bold 8px monospace';
      ctx.fillText('YOU', cx, CY + 44);
    } else if (isTm) {
      ctx.fillStyle = '#111'; ctx.font = 'bold 7px monospace';
      ctx.fillText('TEAMMATE', cx, CY + 44);
    }
  }

  // Team divider on step 1
  if (step === 1) {
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(GW / 2 - 1, 150, 2, 200);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.font = '8px monospace'; ctx.textAlign = 'center'; ctx.letterSpacing = '0';
    ctx.fillText('YOUR TEAM', GW / 4, 148);
    ctx.fillText('CPU TEAM', GW * 3 / 4, 148);
  }

  // Tap hint
  const tapAlpha = 0.5 + Math.sin(S.frame * 0.07) * 0.35;
  ctx.fillStyle = `rgba(255,255,255,${tapAlpha * 0.65})`;
  ctx.font = '9px monospace'; ctx.textAlign = 'center'; ctx.letterSpacing = '0.1em';

function startGameWithSelection() {
  const player   = S._selectedPlayer   || 'nara';
  const teammate = S._selectedTeammate || 'ethan';
  const all      = ['nara', 'ethan', 'brendan', 'james'];
  const cpu      = all.filter(id => id !== player && id !== teammate);

  TEAM_A_IDS = [player, teammate];
  TEAM_B_IDS = cpu;

  const posA = [[80, 1], [150, 1]];
  const posB = [[260, -1], [320, -1]];
  for (let i = 0; i < 2; i++) {
    S.players[TEAM_A_IDS[i]] = mkPlayer(TEAM_A_IDS[i], 'a', posA[i][0], posA[i][1]);
  }
  for (let i = 0; i < 2; i++) {
    S.players[TEAM_B_IDS[i]] = mkPlayer(TEAM_B_IDS[i], 'b', posB[i][0], posB[i][1]);
  }

  S.activeHuman = player;
  S.ball.carrier = player;
  S.players[player].hasBall = true;
  S.possession = 'a';
  S._playerScores = { [TEAM_A_IDS[0]]: 0, [TEAM_A_IDS[1]]: 0 };
  S.screen = 'playing';
}

function drawCharSprite(id, anim, f) {
  const spr = sprites[id];
  const phase = f * 0.05;
  const bob = Math.sin(phase) * 4;
  const scX = 1 + Math.sin(phase) * 0.015;
  const scY = 1 - Math.sin(phase) * 0.015;
  ctx.translate(0, bob);
  ctx.scale(scX, scY);
  if (spr && spr.complete && spr.naturalWidth > 0) {
    const H = 175;
    const W = H * spr.naturalWidth / spr.naturalHeight;
    ctx.drawImage(spr, -W / 2, -H, W, H);
  }
  drawCharOverlay(id);
}

// ── Game Over Screen ─────────────────────────────────────────────
function drawGameOver() {
  const bg = ctx.createLinearGradient(0, 0, 0, GH);
  bg.addColorStop(0, '#1a0a3e'); bg.addColorStop(1, '#0a2060');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, GW, GH);

  // Ambient confetti on win screen
  if (S.confetti.length < 20 && S.frame % 3 === 0) {
    const won2 = S.score[0] > S.score[1];
    const colors2 = won2 ? [CHARS[TEAM_A_IDS[0]].hue, CHARS[TEAM_A_IDS[1]].hue, '#FFD700', '#FFF'] : [CHARS[TEAM_B_IDS[0]].hue, '#FF4444', '#FFF'];
    S.confetti.push({
      x: Math.random() * GW, y: -10,
      vx: (Math.random() - 0.5) * 3,
      vy: 1 + Math.random() * 2,
      color: colors2[Math.floor(Math.random() * colors2.length)],
      size: 4 + Math.random() * 4, ttl: 300, rot: 0, dRot: (Math.random() - 0.5) * 0.15,
    });
  }
  updateAndDrawConfetti();

  const won = S.score[0] > S.score[1];
  const color = won ? '#FFD700' : '#FF4444';
  const text  = won ? 'NARA\'S ROOM WINS!' : 'ALL-STARS WIN!';
  let sub;
  if (!won) sub = '😤 BLOCKED!';
  else if (S._deuceActive) sub = '⚖️ DEUCE SURVIVOR! 🏆';
  else if ((S._maxDeficit || 0) >= 4) sub = `💪 DOWN ${S._maxDeficit}, CAME BACK!`;
  else sub = '🏀 GAME! 🎸';

  ctx.shadowColor = color; ctx.shadowBlur = 30;
  ctx.fillStyle = color;
  ctx.font = 'bold 26px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, GW / 2, 200);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#FFF';
  ctx.font = 'bold 28px monospace';
  ctx.fillText(sub, GW / 2, 255);

  ctx.font = 'bold 56px monospace';
  ctx.fillStyle = CHARS.nara.hue; ctx.fillText(S.score[0], GW / 2 - 60, 340);
  ctx.fillStyle = 'rgba(255,255,255,0.4)'; ctx.fillText('-', GW / 2, 340);
  ctx.fillStyle = CHARS.brendan.hue; ctx.fillText(S.score[1], GW / 2 + 60, 340);

  const ids = [...TEAM_A_IDS, ...TEAM_B_IDS];
  const xs   = [60, 145, 245, 330];
  for (let i = 0; i < 4; i++) {
    const isWinner = (won && i < 2) || (!won && i >= 2);
    const fakePlayer = {
      ...S.players[ids[i]],
      anim: isWinner ? 'celebrate' : 'sad',
      jumpY: 0, x: xs[i], y: COURT_FAR_Y + 20,
      facing: i < 2 ? 1 : -1
    };
    const orig = S.players[ids[i]];
    S.players[ids[i]] = fakePlayer;
    drawChar(ids[i], false);
    S.players[ids[i]] = orig;
  }

  // Stats panel
  const st = S.stats;
  const pct = st.shots > 0 ? Math.round(st.made / st.shots * 100) : 0;
  let best = {};
  try { best = JSON.parse(localStorage.getItem('hch_best') || '{}'); } catch(e) {}
  const twosMade = st.twos || 0;
  const statLines = [
    ['FG  2PT / 3PT', `${twosMade} / ${st.threes || 0}`, `${pct}% FG`],
    ['FG %', `${st.made}/${st.shots}`, best.fgPct ? `BEST ${best.fgPct}%` : ''],
    st.assists > 0 ? ['ASSISTS', `${st.assists}`, '🤝'] : null,
    st.alleyOops > 0 ? ['ALLEY-OOPS', `${st.alleyOops}`, '🙌'] : null,
    (st.floaters || 0) > 0 ? ['FLOATERS', `${st.floaters}`, '🎩'] : null,
    st.steals > 0 ? ['STEALS', `${st.steals}`, '🏃'] : null,
    st.blocks > 0 ? ['BLOCKS', `${st.blocks}`, '🛡'] : null,
    S._stoppedRun ? ['RUN STOPPER', '🛑', 'BROKE THE RUN!'] : null,
    S.streak > 1 ? ['HOT STREAK', `×${S.streak}`, best.streak ? `BEST ×${best.streak}` : ''] : null,
    (S._hotHand || 0) >= 3 ? ['HOT HAND', `${S._hotHand} IN A ROW`, '🔥'] : null,
    (S._maxDeficit || 0) >= 2 && won ? [`COMEBACK +${S._maxDeficit}`, '💪', best.maxComeback ? `BEST +${best.maxComeback}` : ''] : null,
    (S._maxLead || 0) >= 4 ? [`BIGGEST LEAD`, `+${S._maxLead}`, '📈'] : null,
    S._deuceActive && won ? ['DEUCE WIN', '⚖️', best.deuceWins ? `×${best.deuceWins}` : ''] : null,
    (best.wins || best.losses) ? ['RECORD', `${best.wins || 0}W - ${best.losses || 0}L`, '🏆'] : null,
    won && pct === 100 && st.shots >= 5 ? ['PERFECT GAME', '🎯', '100% FG!'] : null,
    won && (st.steals || 0) >= 3 ? ['LOCKDOWN D', `${st.steals} STEALS`, '🔒'] : null,
    won && (st.threes || 0) >= 4 ? ['COLD BLOODED', `${st.threes}x 3PT`, '🧊'] : null,
    won && (st.alleyOops||0) + (st.assists||0) >= 4 ? ['SHOWTIME', `${(st.alleyOops||0)+(st.assists||0)} PLAYS`, '🎬'] : null,
    (() => {
      const ps = S._playerScores || {};
      const mvpId = (ps[TEAM_A_IDS[0]] || 0) >= (ps[TEAM_A_IDS[1]] || 0) ? TEAM_A_IDS[0] : TEAM_A_IDS[1];
      const mvpPts = ps[mvpId] || 0;
      if (mvpPts > 0) return [`MVP: ${CHARS[mvpId].name}`, `${mvpPts} PTS`, '⭐'];
      return null;
    })(),
  ].filter(Boolean);
  fillRR(GW/2 - 145, 415, 290, statLines.length * 24 + 20, 10, 'rgba(0,0,0,0.4)', 'rgba(255,255,255,0.1)', 1);
  ctx.font = '10px monospace'; ctx.letterSpacing = '0';
  for (let i = 0; i < statLines.length; i++) {
    const [label, val, bestVal] = statLines[i];
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.textAlign = 'left';
    ctx.fillText(label, GW/2 - 130, 432 + i * 24);
    ctx.fillStyle = '#FFF'; ctx.textAlign = 'right';
    ctx.fillText(val, GW/2 + 70, 432 + i * 24);
    if (bestVal) {
      ctx.fillStyle = '#FFD700'; ctx.font = '8px monospace';
      ctx.fillText(bestVal, GW/2 + 130, 432 + i * 24);
      ctx.font = '10px monospace';
    }
  }

  const tapAlpha = 0.5 + Math.sin(S.frame * 0.07) * 0.4;
  ctx.fillStyle = `rgba(255,255,255,${tapAlpha})`;
  ctx.font = 'bold 14px monospace'; ctx.textAlign = 'center';
  ctx.fillText('TAP TO PLAY AGAIN', GW / 2, 660);
}

// ── Input ────────────────────────────────────────────────────────
function toGameCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  if (!_rotated) {
    return {
      x: (clientX - rect.left) / _scale,
      y: (clientY - rect.top)  / _scale,
    };
  }
  // Canvas rotated 90° CW: center is always at (lw/2, lh/2) since we positioned it that way
  const cx = window.innerWidth  / 2;
  const cy = window.innerHeight / 2;
  return {
    x: GW / 2 - (clientY - cy) / _scale,
    y: GH / 2 + (clientX - cx) / _scale,
  };
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const { x, y } = toGameCoords(t.clientX, t.clientY);

    // Pause button (top-left)
    if (x < 38 && y < 30 && S.screen === 'playing') {
      S.paused = !S.paused;
      continue;
    }
    // Resume on tap when paused
    if (S.paused) { S.paused = false; continue; }

    // Info button always tappable
    if (Math.hypot(x - 374, y - 14) < 18) {
      S.showInfo = !S.showInfo;
      continue;
    }
    // Timeout button (top-left T/O badge: x=6-32, y=6-18)
    if (S.screen === 'playing' && x >= 4 && x <= 36 && y >= 4 && y <= 22) {
      if ((S._humanTimeouts || 0) > 0 && !S.paused) {
        S._humanTimeouts--;
        S.paused = true;
        S.scoreFlash = { text: '⏸ TIMEOUT!', color: CHARS.nara.hue, ttl: 180 };
        spawnThought(S.activeHuman, '💬 HUDDLE UP!');
        setTimeout(() => { S.paused = false; }, 2500);
      }
      continue;
    }
    // Tap anywhere else closes info panel
    if (S.showInfo) { S.showInfo = false; continue; }

    if (S.screen === 'title') {
      // Difficulty buttons: drawn at bx=90, bx=162, bx=234 each 64px wide
      if (y >= 405 && y <= 440) {
        if (x >= 85  && x < 158) { S._difficulty = 'easy';   continue; }
        if (x >= 158 && x < 230) { S._difficulty = 'normal'; continue; }
        if (x >= 230 && x < 305) { S._difficulty = 'hard';   continue; }
      }
      S._charSelectStep = 1; S.screen = 'charselect'; return;
    }
    if (S.screen === 'charselect') {
      const _all = ['nara','ethan','brendan','james'];
      const _CX  = [50, 148, 246, 344];
      // PLAY button (visible once both chosen)
      if (S._selectedPlayer && S._selectedTeammate && y >= GH - 39 && y <= GH - 11 && Math.abs(x - GW/2) <= 55) {
        startGameWithSelection(); return;
      }
      for (let _i = 0; _i < 4; _i++) {
        if (Math.abs(x - _CX[_i]) <= 48 && y >= 140 && y <= 405) {
          const _id = _all[_i];
          if ((S._charSelectStep || 1) === 1) {
            S._selectedPlayer = _id; S._selectedTeammate = null; S._charSelectStep = 2;
          } else if (_id !== S._selectedPlayer) {
            S._selectedTeammate = _id; startGameWithSelection();
          }
          return;
        }
      }
      return;
    }
    if (S.screen === 'gameover') {
      initState(); S._charSelectStep = 1; S.screen = 'charselect'; return;
    }
    if (S.screen !== 'playing') return;

    const dShoot = Math.hypot(x - 300, y - 640);
    const dPass  = Math.hypot(x - 300, y - 710);

    if (dShoot < 52) {
      if (S.possession === 'a') {
        S.shootHeld = true;
        S.shootPower = 0;
        const ap = S.players[S.activeHuman];
        if (ap.hasBall) ap.anim = 'shoot';
      } else {
        S.blockHeld = true;
        S.blockPower = 0;
      }
      continue;
    }
    if (dPass < 38) {
      if (S.possession === 'a') {
        handlePassAction();
      } else {
        handleStealAction();
      }
      continue;
    }

    // Defense: tap near teammate to switch control
    if (S.possession === 'b') {
      const tmId = TEAM_A_IDS.find(id => id !== S.activeHuman);
      const tm = S.players[tmId];
      if (Math.hypot(x - tm.x, y - tm.y) < 55) {
        S.activeHuman = tmId;
        S.switchFlash = { name: CHARS[tmId].name, color: CHARS[tmId].hue, ttl: 50 };
        continue;
      }
    }

    // Left+centre area → joystick
    if (x < GW * 0.65 && !S.joy.active) {
      S.joy = { active: true, id: t.identifier, ox: x, oy: y, dx: 0, dy: 0 };
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === S.joy.id) {
      const { x, y } = toGameCoords(t.clientX, t.clientY);
      const maxR = 55;
      let dx = x - S.joy.ox, dy = y - S.joy.oy;
      const len = Math.hypot(dx, dy);
      if (len > maxR) { dx = dx / len * maxR; dy = dy / len * maxR; }
      S.joy.dx = dx; S.joy.dy = dy;
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === S.joy.id) {
      S.joy = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
    }
    const { x, y } = toGameCoords(t.clientX, t.clientY);
    if (Math.hypot(x - 300, y - 640) < 52) {
      if (S.possession === 'a' && S.shootHeld) releaseShoot();
      else if (S.possession === 'b' && S.blockHeld) releaseBlock();
      S.shootHeld = false;
      S.blockHeld = false;
    }
  }
}, { passive: false });

const KEYS = {};
window.addEventListener('keydown', e => {
  const wasDown = KEYS[e.code];

  if (S.screen === 'title' || S.screen === 'gameover') {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (S.screen === 'gameover') initState();

    }
    return;
  }
  if (S.screen === 'charselect') {
    if (e.code === 'Space' || e.code === 'Enter') {
      if (S._selectedPlayer && S._selectedTeammate) startGameWithSelection();
    }
    return;
  }
  if (S.screen !== 'playing') return;

  if (e.code === 'Space' && !wasDown) {
    e.preventDefault();
    if (S.possession === 'a') {
      S.shootHeld = true; S.shootPower = 0;
      const ap = S.players[S.activeHuman];
      if (ap.hasBall) ap.anim = 'shoot';
    } else {
      S.blockHeld = true; S.blockPower = 0;
    }
  }
  if (e.code === 'Enter' && !wasDown) {
    if (S.possession === 'a') {
      handlePassAction();
    } else {
      handleStealAction();
    }
  }
});

window.addEventListener('keyup', e => {

    if (S.possession === 'a' && S.shootHeld) releaseShoot();
    else if (S.possession === 'b' && S.blockHeld) releaseBlock();
    S.shootHeld = false;
    S.blockHeld = false;
  }
});

// Apply keyboard arrows to joystick each frame
function applyKeyboard() {

  const right = KEYS['ArrowRight'] || KEYS['KeyD'];
  const up    = KEYS['ArrowUp']    || KEYS['KeyW'];
  const down  = KEYS['ArrowDown']  || KEYS['KeyS'];
  if (left || right || up || down) {
    S.joy = {
      active: true, id: -2,
      ox: 0, oy: 0,
      dx: right ? 55 : left ? -55 : 0,
      dy: down  ? 55 : up   ? -55 : 0
    };
  } else if (S.joy.id === -2) {
    S.joy = { active: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
  }
}

// ── Action Functions ──────────────────────────────────────────────
function releaseShoot() {
  if (!S.shootHeld) return;
  S.shootHeld = false;
  const ap = S.players[S.activeHuman];
  if (!ap.hasBall) { S.shootPower = 0; return; }
  const power = S.shootPower;
  S.shootPower = 0;
  if (power < 8) { ap.anim = 'idle'; return; } // too light, abort

  // Pump fake: very quick release (<13 frames) — freeze nearby defenders
  if (power < 13) {
    ap.anim = 'shoot';
    spawnThought(ap.id, '👀 PUMP FAKE!');
    S._possessionMoves = (S._possessionMoves || 0) + 1;
    for (const def of TEAM_B_IDS) {
      const dp = S.players[def];
      if (Math.hypot(ap.x - dp.x, ap.y - dp.y) < 72 && dp._jumpVy === 0 && dp.jumpY === 0) {
        dp._jumpVy = -7;
        dp.anim = 'jump';
        spawnThought(def, '😅');
      }
    }
    setTimeout(() => { if (S.players[ap.id] && S.players[ap.id].anim === 'shoot') S.players[ap.id].anim = 'idle'; }, 350);
    return;
  }

  const dist = Math.abs(ap.x - HOOP_X);
  if (dist > SHOT_RANGE_3 + 20) { ap.anim = 'idle'; return; }

  // Chef Curry mode: wider green zone when on 3pt hot streak
  const isChefCurry = (S._human3ptStreak || 0) >= 3 && dist > SHOT_RANGE_2;
  const greenLo = isChefCurry ? POWER_GREEN_LO - 8 : POWER_GREEN_LO;
  const greenHi = isChefCurry ? POWER_GREEN_HI + 8 : POWER_GREEN_HI;
  const inGreen = power >= greenLo && power <= greenHi;
  const isPerfect = power >= 60 && power <= 68;

  let acc, timingText;
  if (isPerfect)        { acc = 0.95; timingText = isChefCurry ? '🍳 PERFECT!' : '🎯 PERFECT!'; }
  else if (inGreen)     { acc = 0.88; timingText = isChefCurry ? '🍳 COOKING!' : '💚 GOOD!'; }
  else if (power < POWER_GREEN_LO) { acc = 0.12 + power * 0.006; timingText = '⬆ EARLY'; }
  else                  { acc = 0.32; timingText = '⬇ LATE'; }

  // Layup / dunk near basket — higher accuracy, override text
  if (dist < 70) {
    const isDunk = dist < 38 && power >= 40;
    // Breakaway dunk: fast break, open lane, no defenders nearby
    const breakawayOpen = S._fastBreak > 60 && TEAM_B_IDS.every(id => Math.hypot(S.players[id].x - ap.x, S.players[id].y - ap.y) > 100);
    // Poster dunk: dunk OVER a defender who's in the paint
    const defInPaint = TEAM_B_IDS.find(id => Math.abs(S.players[id].x - HOOP_X) < 50 && Math.hypot(S.players[id].x - ap.x, 0) < 48);
    const isPoster = isDunk && defInPaint && Math.abs(ap.vx) > 1.8 && Math.random() < 0.45;
    if (breakawayOpen && isDunk) {
      acc = 1.0; timingText = '🚀 BREAKAWAY DUNK!';
      S.shake = 14;
      spawnCrowdBurst([CHARS.nara.hue, '#FFD700', '#00CFFF', '#FFF']);
    } else if (isPoster) {
      acc = 0.99; timingText = '💥 POSTER DUNK!';
      spawnThought(defInPaint, '😱 POSTERIZED!');
      S.shake = 18;
    } else if (isDunk) {
      acc = 0.97; timingText = '💥 DUNK!';
    } else {
      // Euro Step: driving hard AND moving laterally (around defender)
      const defInLane = TEAM_B_IDS.some(id => S.players[id].x > HOOP_X - 80 && Math.abs(S.players[id].y - ap.y) < 55);
      const isEuroStep = Math.abs(ap.vx) > 2.2 && Math.abs(ap.vy) > 0.9 && defInLane;
      acc = Math.min(acc + 0.24, 0.96);
      if (isEuroStep) {
        acc = Math.min(acc + 0.06, 0.98);
        timingText = '🪄 EURO STEP!';
        S._possessionMoves = (S._possessionMoves || 0) + 1;
        // Sparkle at feet
        for (let ei = 0; ei < 5; ei++) {
          S.confetti.push({ x: ap.x + (Math.random()-0.5)*20, y: ap.y, vx: (Math.random()-0.5)*3, vy: -1.5-Math.random()*2, color: '#A0FFD0', size: 3+Math.random()*2, ttl: 14, rot: 0, dRot: 0.3 });
        }
      } else if (timingText !== '⬆ EARLY') {
        timingText = '🏃 LAYUP!';
      }
    }
  }

  // Hot hand bonus — on fire streak gives +8% accuracy
  if (S.streak >= 3) acc = Math.min(acc + 0.08, 0.99);

  // Jump shot bonus — slightly better release point when airborne
  if (ap.jumpY < -20) acc = Math.min(acc + 0.05, 0.99);

  // Wide open / contested bonus
  const closestDef = Math.min(...TEAM_B_IDS.map(id => Math.hypot(S.players[id].x - ap.x, S.players[id].y - ap.y)));
  const wideOpen = closestDef > 85;
  const contested = closestDef < 38;
  // Brendan's PAINT BEAST: extra contest penalty in the paint
  const brendanClose = Math.hypot(S.players[TEAM_B_IDS[0]].x - ap.x, S.players[TEAM_B_IDS[0]].y - ap.y) < 42;
  const paintBeastPenalty = brendanClose && dist < SHOT_RANGE_2 && CHARS.brendan._paintBlock ? 0.06 : 0;
  if (wideOpen && dist > SHOT_RANGE_LAY) {
    acc = Math.min(acc + 0.06, 0.99);
    if (inGreen || isPerfect) spawnThought(ap.id, '🎯 WIDE OPEN!');
  } else if (contested) {
    acc = Math.max(0.05, acc - 0.12 - paintBeastPenalty);
    if (dist > SHOT_RANGE_LAY) {
      if (paintBeastPenalty > 0) spawnThought(ap.id, '💪 PAINT BEAST!');
      else spawnThought(ap.id, '🙅 CONTESTED!');
    }
  } else if (paintBeastPenalty > 0) {
    acc = Math.max(0.08, acc - paintBeastPenalty);
  }

  // Put-back bonus: shooting after offensive rebound
  if (ap._putbackBonus && dist <= SHOT_RANGE_2) {
    ap._putbackBonus = false;
    acc = Math.min(acc + 0.15, 0.96);
    timingText = dist <= SHOT_RANGE_LAY ? '🔃 PUT BACK!' : '🔃 AND AGAIN!';
  }

  // Catch-and-shoot bonus: shooting within 90 frames of catching a pass
  const isCatchShoot = ap._catchFrame && (S.frame - ap._catchFrame) < 90 && (S.frame - ap._catchFrame) > 0;
  if (isCatchShoot && dist > SHOT_RANGE_LAY) {
    acc = Math.min(acc + 0.05, 0.99);
    if (inGreen || isPerfect) spawnThought(ap.id, '⚡ CATCH & SHOOT!');
  }

  // Step-back 3: moving away from basket while shooting a 3
  const movingBack = ap.vx < -1.5 && dist > SHOT_RANGE_2;
  if (movingBack && (inGreen || isPerfect)) {
    acc = Math.min(acc + 0.04, 0.99);
    spawnThought(ap.id, '👟 STEP BACK!');
    S._possessionMoves = (S._possessionMoves || 0) + 1;
  }

  // Pull-up 3: driving toward basket and pulling up from 3pt range
  const isPullUp3 = ap.vx > 1.2 && dist > SHOT_RANGE_2;
  if (isPullUp3 && (inGreen || isPerfect)) {
    acc = Math.min(acc + 0.03, 0.99);
    timingText = '🏃 PULL UP 3!';
    S._possessionMoves = (S._possessionMoves || 0) + 1;
  }

  // Fadeaway mid-range: moving backward in 2pt zone
  const isFadeaway = ap.vx < -1.5 && dist > SHOT_RANGE_LAY && dist <= SHOT_RANGE_2;
  if (isFadeaway && (inGreen || isPerfect)) {
    acc = Math.min(acc + 0.03, 0.99);
    spawnThought(ap.id, '💨 FADEAWAY!');
  }

  // Turnaround jumper: facing away from basket in mid-range
  const isTurnaround = ap.facing === -1 && dist > SHOT_RANGE_LAY && dist <= SHOT_RANGE_2;
  if (isTurnaround && (inGreen || isPerfect)) {
    acc = Math.min(acc + 0.04, 0.99);
    spawnThought(ap.id, '🔄 TURNAROUND!');
    S._possessionMoves = (S._possessionMoves || 0) + 1;
  }

  // Floater: one-handed scoop while driving into paint with a lane defender
  const isFloater = ap.vx > 2.0 && dist > SHOT_RANGE_LAY && dist < SHOT_RANGE_LAY + 62 &&
    TEAM_B_IDS.some(id => {
      const dp = S.players[id];
      return dp.x > HOOP_X - 70 && Math.abs(dp.y - ap.y) < 60;
    });
  if (isFloater) {
    if (inGreen || isPerfect) {
      acc = Math.min(acc + 0.10, 0.88);
      timingText = '🎩 FLOATER!';
    } else if (timingText !== '⬆ EARLY') {
      acc = Math.max(acc, 0.42);
      timingText = '🎩 FLOATER!';
    }
  }

  // Character ability bonus
  const charData = CHARS[ap.id];
  if (charData._3ptBonus > 0 && dist > SHOT_RANGE_2) {
    acc = Math.min(acc + charData._3ptBonus, 0.99);
  }

  // Fire mode: on-fire accuracy bonus
  if (S._fireMode) {
    acc = Math.min(acc + 0.10, 0.99);
    if (inGreen || isPerfect) timingText = '🔥 ' + timingText.replace(/^🎯 |^💚 |^🍳 /, '');
  }

  spawnThought(ap.id, timingText);
  if (timingText.includes('DUNK')) {
    sfxDunk();
    spawnCrowdBurst([CHARS.nara.hue, '#FFD700', '#FF8C00', '#FFF']);
    ap._jumpVy = -13;
    ap.anim = 'jump';
  } else if (isFloater) {
    sfxFloater();
  } else if (isTurnaround) {
    sfxTurnaround();
  } else if (isPullUp3) {
    sfxPullUp3();
  } else sfxShoot();
  S.shotClock = 600;
  S.stats.shots++;

  // Game winner shot: big moment label
  const isGamePointShot = !S._deuceActive && S.score[0] === WIN_SCORE - 1;
  const isDeuceMatchPt = S._deuceActive && S.score[0] > S.score[1];
  if ((isGamePointShot || isDeuceMatchPt) && (inGreen || isPerfect)) {
    S.thoughts.push({ x: GW / 2, y: 380, text: '🏆 FOR THE WIN!', ttl: 55, maxTtl: 55, dx: 0, bg: '#FFD700CC' });
  }

  const made = Math.random() < acc;
  ap.anim = 'shoot';
  ap.hasBall = false;
  S.ball.carrier = null;
  fireBallShot(ap.x, ap.y + ap.jumpY - 55, made, dist, isFloater);
  if (isFloater) S.stats.floaters = (S.stats.floaters || 0) + 1;
  if (isPerfect) S.ball._perfect = true;
  S.ball._fromX = ap.x;
  // Flash ring at release point based on timing quality
  if (isPerfect || inGreen) {
    const flashColor = isPerfect ? '#00FF88' : '#80FF80';
    for (let i = 0; i < 6; i++) {
      S.confetti.push({ x: ap.x + (Math.random()-0.5)*20, y: ap.y - 30 + (Math.random()-0.5)*20, vx: (Math.random()-0.5)*4, vy: -2 - Math.random()*2, color: flashColor, size: 3 + Math.random()*3, ttl: 18, rot: 0, dRot: 0.3 });
    }
    // Perfect timing: brief screen overlay flash
    if (isPerfect) {
      S._perfectFlash = { alpha: 0.18, color: '#00FF88' };
    }
  }
  setTimeout(() => {
    if (S.players[ap.id] && S.players[ap.id].anim === 'shoot')
      S.players[ap.id].anim = 'idle';
  }, 400);
}

function releaseBlock() {
  if (!S.blockHeld) return;
  S.blockHeld = false;
  const ap = S.players[S.activeHuman];
  const power = S.blockPower;
  S.blockPower = 0;
  if (power < 5) return;

  // Jump height proportional to hold duration
  ap._jumpVy = -(4.5 + power * 0.085);
  ap.jumpY = 0;
  ap.anim = 'jump';
  spawnThought(S.activeHuman, '✋');

  // Attempt block at jump peak
  setTimeout(() => { tryBlock(); }, 260);
}

function handlePassAction() {
  if (S.possession !== 'a') return;
  const ap = S.players[S.activeHuman];
  if (!ap.hasBall) return;
  const teammate = TEAM_A_IDS.find(id => id !== S.activeHuman);
  const tp = S.players[teammate];

  ap.hasBall = false;
  S.ball.carrier = null;
  S.ball.inAir = true;
  S.ball.x = ap.x; S.ball.y = ap.y - 50;

  // Pass with slight arc
  const dx = tp.x - ap.x, dy = (tp.y - 55) - (ap.y - 50);
  const passDist = Math.hypot(dx, dy);
  const tPass = Math.max(10, passDist / 14);
  // Detect alley-oop: teammate near basket, no defender right on them
  const nearBasket = tp.x > HOOP_X - 75;
  const defClose = TEAM_B_IDS.some(id => Math.hypot(S.players[id].x - tp.x, S.players[id].y - tp.y) < 55);
  const isAlleyOop = nearBasket && !defClose;

  // Arc: short passes are flat (-0.5), long passes have more height (-2.5)
  const arcBonus = isAlleyOop ? 4 : Math.min(2.5, passDist / 80);

  S.ball.vx = dx / tPass;
  S.ball.vy = (dy - 0.225 * tPass * tPass) / tPass - arcBonus;

  // Behind-the-back pass: teammate is behind the passer (relative to facing)
  const isBehindBack = (ap.facing * dx) < -30;
  if (navigator.vibrate) navigator.vibrate(15);
  S.ball._pass = true;
  S.ball._passTarget = teammate;
  if (isAlleyOop) S.ball._alleyOop = true;
  if (isBehindBack && !isAlleyOop) {
    spawnThought(ap.id, '🔄 BEHIND BACK!');
    S._possessionMoves = (S._possessionMoves || 0) + 1;
    S.ball.vy -= 1; // slightly higher arc for style
  }

  // Passer cuts to open position (toward the hoop, offset from receiver)
  const cutX = tp.x > 180 ? HOOP_X - 140 : HOOP_X - 60;
  const cutY = (COURT_FAR_Y + COURT_NEAR_Y) / 2 + (Math.random() - 0.5) * 30;
  ap._cutting = true;
  ap._cutTarget = { x: cutX, y: cutY };
  ap.anim = 'run';

  S._lastPasser = ap.id;
  S.activeHuman = teammate;
  spawnThought(teammate, isAlleyOop ? '🙌' : '🏀');
  S.switchFlash = { name: CHARS[teammate].name, color: CHARS[teammate].hue, ttl: 70 };

  // Team chemistry: Nara↔Ethan passes build chemistry
  if (TEAM_A_IDS.includes(ap.id) && !isAlleyOop) {
    S._teamChemistry = (S._teamChemistry || 0) + 1;
    if (S._teamChemistry >= 3) {
      S._teamChemistry = 0;
      S.scoreFlash = { text: '✨ TEAM CHEMISTRY!', color: '#FF69B4', ttl: 70 };
      // Both players get brief speed boost (via _fastBreak proxy)
      S._fastBreak = Math.max(S._fastBreak, 80);
      sfxCrowd(0.4);
    }
  }
}

function handleStealAction() {
  const ap = S.players[S.activeHuman];
  // Cooldown to prevent spamming
  if (ap._stealCooldown > 0) return;
