<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Band — Nara's Room</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #0a0018; overflow: hidden; font-family: 'Courier New', monospace; }
  #stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #cv { display: block; cursor: pointer; }
  .title { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); text-align: center; pointer-events: none; z-index: 2; }
  .title-top { font-size: clamp(10px, 2vw, 14px); letter-spacing: 0.35em; color: #FFD700; }
  .title-main { font-size: clamp(18px, 4vw, 28px); font-weight: 900; letter-spacing: 0.15em; color: #ffffff; margin-top: 4px; }
  .hint { display: none; }
  .back-btn {
    position: absolute;
    top: 24px;
    left: 24px;
    z-index: 3;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 118px;
    height: 42px;
    padding: 0 18px;
    border: 2px solid #FFD700;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.72);
    box-shadow: 0 0 18px rgba(255, 215, 0, 0.24);
    color: #FFD700;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 0.12em;
    text-decoration: none;
    transition: background 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .back-btn:hover {
    background: #FFD700;
    box-shadow: 0 0 22px rgba(255, 215, 0, 0.42);
    color: #12001d;
    transform: translateY(-1px);
  }
</style>
</head>
<body>
<div id="stage">
  <div class="title">
    <div class="title-top">NARA'S ROOM</div>
    <div id="title-main" class="title-main">THE BAND</div>
  </div>
  <canvas id="cv"></canvas>
  <a id="back-btn" class="back-btn" href="/">← PLAY!</a>
  <div class="hint"></div>
</div>

<script>
const ASSET_VERSION = 'e2c1317';
const CHARS = [
  {
    id: 'nara', name: 'NARA', fullName: 'NARA AVAKIAN', role: 'VOCALS · GUITAR',
    ability: '3PT SHOOTER · SPEED BOOST',
    summary: 'Deep shot confidence with wing-assisted lift.',
    hue: '#FF1493', sprite: '../assets/nara_sprite.png', face: [120, 0, 340, 350],
  },
  {
    id: 'ethan', name: 'ETHAN', fullName: 'ETHAN NASH', role: 'BASS',
    ability: 'LOCKDOWN · +20% STEAL RANGE',
    summary: 'Stretch arms for blocks, boards, and poke steals.',
    hue: '#32CD32', sprite: '../assets/ethan_sprite.png', face: [55, 0, 265, 360],
  },
  {
    id: 'brendan', name: 'BRENDAN', fullName: 'BRENDAN JONES', role: 'DRUMS',
    ability: 'PAINT BEAST · IN THE PAINT',
    summary: 'Controls rebounds and contests everything near the rim.',
    hue: '#FF6B35', sprite: '../assets/brendan_sprite.png', face: [28, 0, 264, 370],
  },
  {
    id: 'will', name: 'WILL', fullName: 'WILL FISHER', role: 'KEYS',
    ability: 'DEEP RANGE · +8% THREE POINT',
    summary: 'Long-range touch with a bucket-hat headbutt finish.',
    hue: '#9B59B6', sprite: '../assets/will_sprite.png', face: [40, 0, 350, 345],
  },
];

// ── Picker mode detection ───────────────────────────────────────
const _params   = new URLSearchParams(window.location.search);
const _fromPlay = _params.get('from') === 'play';
const _difficulty = _params.get('difficulty') || 'normal';

let _pickerStep   = 1;   // 1 = pick player, 2 = pick teammate
let _pickedPlayer = null;

if (_fromPlay) {
  document.getElementById('title-main').textContent = 'PICK YOUR PLAYER';
  document.getElementById('back-btn').href = '/';
  document.getElementById('back-btn').textContent = '← BACK';
}

const canvas = document.getElementById('cv');
const ctx    = canvas.getContext('2d');
let W = 0, H = 0;
let frame = 0;
let selected = 0;
let zoomed = false;
let hot = null;

CHARS.forEach(c => {
  c.img = new Image();
  c.img.src = `${c.sprite}?v=${ASSET_VERSION}`;
});

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const vw = window.innerWidth, vh = window.innerHeight;
  canvas.width  = Math.floor(vw * dpr);
  canvas.height = Math.floor(vh * dpr);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  W = canvas.width;
  H = canvas.height;
}
window.addEventListener('resize', resize);
resize();

function activeChar(offset = 0) {
  return CHARS[(selected + offset + CHARS.length) % CHARS.length];
}

function roundedRect(x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

function next(delta) {
  let newSel = (selected + delta + CHARS.length) % CHARS.length;
  // In picker step 2, skip the already-picked player
  if (_fromPlay && _pickerStep === 2 && CHARS[newSel].id === _pickedPlayer) {
    newSel = (newSel + delta + CHARS.length) % CHARS.length;
  }
  selected = newSel;
  zoomed = false;
}

function layout() {
  const dpr = window.devicePixelRatio || 1;
  const isWide = W / H > 1.2;
  const dotW = Math.min(120 * dpr, W * 0.17);
  const gap = Math.max(14 * dpr, W * 0.025);
  const dotY = H - 66 * dpr;
  const summaryH = 74 * dpr;
  const summaryY = dotY - 118 * dpr;
  const labelY = summaryY - 108 * dpr;
  const characterTop = isWide ? H * 0.22 : H * 0.12;

  // In picker mode, reserve extra space at bottom for the action button
  const pickerOffset = _fromPlay ? 60 * dpr : 0;
  const characterBottom = labelY - (isWide ? 150 : 90) * dpr;
  const maxBodyH = Math.max(150 * dpr, characterBottom - characterTop);
  const bodyH = isWide
    ? Math.min(H * 0.28, W * 0.32, maxBodyH)
    : Math.min(H * 0.42, W * 0.65, maxBodyH);
  const floor = characterTop + bodyH;
  const sideY = floor + 8 * dpr;

  // Action button (picker mode)
  const actionBtnH = 52 * dpr;
  const actionBtnY = H - 20 * dpr - actionBtnH;
  const actionBtnW = Math.min(W * 0.72, 340 * dpr);

  return {
    dpr,
    cx: W * 0.5,
    floor,
    sideY,
    bodyH,
    sideH: isWide ? Math.min(H * 0.25, W * 0.13) : Math.min(H * 0.26, W * 0.18),
    leftX: W * 0.18,
    rightX: W * 0.82,
    labelY,
    summaryY: _fromPlay ? summaryY - pickerOffset * 0.5 : summaryY,
    summaryH,
    dotY: _fromPlay ? dotY - pickerOffset : dotY,
    dotW,
    dotH: 38 * dpr,
    gap,
    actionBtnY,
    actionBtnH,
    actionBtnW,
  };
}

function eventPoint(e) {
  const r = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  return [(e.clientX - r.left) * dpr, (e.clientY - r.top) * dpr];
}

function hitTestPicker(x, y) {
  const l = layout();
  // Action button hit test
  const bx = W / 2 - l.actionBtnW / 2;
  if (x >= bx && x <= bx + l.actionBtnW &&
      y >= l.actionBtnY && y <= l.actionBtnY + l.actionBtnH) {
    return { type: 'action' };
  }
  // Arrow hit test
  if (x < W * 0.28 && y > H * 0.18 && y < H * 0.86) return { type: 'prev' };
  if (x > W * 0.72 && y > H * 0.18 && y < H * 0.86) return { type: 'next' };
  // Center sprite tap
  if (x > W * 0.28 && x < W * 0.72 && y > H * 0.18 && y < H * 0.86) return { type: 'action' };
  return null;
}

function hitTest(x, y) {
  if (_fromPlay) return hitTestPicker(x, y);

  const l = layout();
  const { dotW, dotH, gap } = l;
  const total = CHARS.length * dotW + (CHARS.length - 1) * gap;
  const start = W / 2 - total / 2;

  for (let i = 0; i < CHARS.length; i++) {
    const dx = start + i * (dotW + gap);
    if (x >= dx && x <= dx + dotW && y >= l.dotY - dotH / 2 && y <= l.dotY + dotH / 2) {
      return { type: 'select', index: i };
    }
  }
  if (x < W * 0.28 && y > H * 0.18 && y < H * 0.86) return { type: 'prev' };
  if (x > W * 0.72 && y > H * 0.18 && y < H * 0.86) return { type: 'next' };
  if (x > W * 0.28 && x < W * 0.72 && y > H * 0.18 && y < H * 0.86) return { type: 'toggle' };
  return null;
}

function handlePickerAction() {
  const c = activeChar(0);
  if (_pickerStep === 1) {
    // Pick player
    _pickedPlayer = c.id;
    _pickerStep = 2;
    document.getElementById('title-main').textContent = 'PICK TEAMMATE';
    // Move to a different character if current is the picked one
    const nextIdx = CHARS.findIndex(ch => ch.id !== _pickedPlayer);
    selected = nextIdx >= 0 ? nextIdx : 0;
    zoomed = false;
  } else {
    // Pick teammate — navigate to game
    if (c.id === _pickedPlayer) return; // can't pick same player
    window.location.href = `/?player=${_pickedPlayer}&teammate=${c.id}&difficulty=${_difficulty}`;
  }
}

function handle(action) {
  if (!action) return;
  if (action.type === 'prev') next(-1);
  if (action.type === 'next') next(1);
  if (action.type === 'action') handlePickerAction();
  if (action.type === 'toggle') zoomed = !zoomed;
  if (action.type === 'select') {
    zoomed = action.index === selected ? !zoomed : false;
    selected = action.index;
  }
}

canvas.addEventListener('mousemove', e => {
  const [x, y] = eventPoint(e);
  hot = hitTest(x, y);
  canvas.style.cursor = hot ? 'pointer' : 'default';
});

canvas.addEventListener('click', e => {
  const [x, y] = eventPoint(e);
  handle(hitTest(x, y));
});

canvas.addEventListener('touchend', e => {
  const t = e.changedTouches[0];
  const [x, y] = eventPoint(t);
  handle(hitTest(x, y));
  e.preventDefault();
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') next(-1);
  if (e.key === 'ArrowRight') next(1);
  if (_fromPlay && (e.key === 'Enter' || e.key === ' ')) handlePickerAction();
  if (!_fromPlay && (e.key === 'Enter' || e.key === ' ')) zoomed = !zoomed;
});

function drawSprite(c, cx, floor, h, alpha = 1, glow = false) {
  if (!c.img.complete || c.img.naturalWidth <= 0) return;
  const w = h * c.img.naturalWidth / c.img.naturalHeight;
  const bob = Math.sin(frame * 0.045 + selected) * H * 0.006;

  ctx.save();
  ctx.globalAlpha = alpha;
  if (glow) {
    ctx.shadowColor = c.hue;
    ctx.shadowBlur = 28 * (window.devicePixelRatio || 1);
  }
  ctx.drawImage(c.img, cx - w / 2, floor - h + bob, w, h);
  ctx.restore();
  return { x: cx - w / 2, y: floor - h + bob, w, h };
}

function drawFace(c) {
  if (!c.img.complete || c.img.naturalWidth <= 0) return;
  const l = layout();
  const [sx, sy, sw, sh] = c.face;
  const maxW = Math.min(W * 0.6, 520 * l.dpr);
  const maxH = H * 0.55;
  const sc = Math.min(maxW / sw, maxH / sh);
  const dw = sw * sc;
  const dh = sh * sc;
  const x = W / 2 - dw / 2;
  const y = H * 0.46 - dh / 2;

  ctx.save();
  ctx.shadowColor = c.hue;
  ctx.shadowBlur = 34 * l.dpr;
  roundedRect(x, y, dw, dh, 24 * l.dpr);
  ctx.fillStyle = '#100820';
  ctx.fill();
  ctx.clip();
  ctx.drawImage(c.img, sx, sy, sw, sh, x, y, dw, dh);
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = c.hue;
  ctx.lineWidth = 3 * l.dpr;
  roundedRect(x, y, dw, dh, 24 * l.dpr);
  ctx.stroke();
  ctx.restore();
}

function drawName(c, y, selectedStyle = true) {
  const dpr = window.devicePixelRatio || 1;
  const nameText = c.fullName || c.name;
  const nameSize = Math.min(34 * dpr, (W * 0.82) / (nameText.length * 0.62));
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 ${nameSize}px Courier New, monospace`;
  ctx.shadowColor = 'rgba(0,0,0,0.75)';
  ctx.shadowBlur = 8 * dpr;
  ctx.fillStyle = selectedStyle ? c.hue : '#ffffff75';
  ctx.fillText(nameText, W / 2, y, W * 0.86);
  ctx.shadowBlur = 0;
  ctx.font = `900 ${15 * dpr}px Courier New, monospace`;
  ctx.fillStyle = '#ffffffB8';
  ctx.fillText(c.role, W / 2, y + 32 * dpr);
  ctx.restore();
}

function drawSummary(c, y) {
  const dpr = window.devicePixelRatio || 1;
  const l = layout();
  const boxW = Math.min(W * 0.82, 560 * dpr);
  const boxH = l.summaryH;
  const x = W / 2 - boxW / 2;
  const top = y - boxH / 2;

  ctx.save();
  roundedRect(x, top, boxW, boxH, 10 * dpr);
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.strokeStyle = c.hue;
  ctx.lineWidth = 2 * dpr;
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 10 * dpr;
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = `900 ${16 * dpr}px Courier New, monospace`;
  ctx.fillStyle = c.hue;
  ctx.fillText(c.ability, W / 2, y - 17 * dpr, boxW - 28 * dpr);

  ctx.font = `800 ${12.5 * dpr}px Courier New, monospace`;
  ctx.fillStyle = 'rgba(255,255,255,0.86)';
  ctx.fillText(c.summary, W / 2, y + 17 * dpr, boxW - 28 * dpr);
  ctx.restore();
}

function drawDots() {
  const l = layout();
  const { dotW, dotH, gap } = l;
  const total = CHARS.length * dotW + (CHARS.length - 1) * gap;
  const start = W / 2 - total / 2;

  CHARS.forEach((c, i) => {
    const x = start + i * (dotW + gap);
    const isActive = i === selected;
    const isPickedPlayer = _fromPlay && _pickerStep === 2 && c.id === _pickedPlayer;
    ctx.save();
    if (isPickedPlayer) ctx.globalAlpha = 0.35;
    roundedRect(x, l.dotY - dotH / 2, dotW, dotH, 6 * l.dpr);
    ctx.fillStyle = isActive ? c.hue : 'rgba(0,0,0,0.65)';
    ctx.strokeStyle = c.hue;
    ctx.lineWidth = 1.5 * l.dpr;
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = isActive ? '#12001d' : c.hue;
    ctx.font = `900 ${13 * l.dpr}px Courier New, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(c.name, x + dotW / 2, l.dotY);
    ctx.restore();
  });
}

function drawPickerBadge() {
  if (!_fromPlay || _pickerStep !== 2 || !_pickedPlayer) return;
  const l = layout();
  const dpr = l.dpr;
  const pc = CHARS.find(c => c.id === _pickedPlayer);
  if (!pc) return;

  // Small "YOU: NAME" badge in top-right area
  const badgeW = 130 * dpr;
  const badgeH = 32 * dpr;
  const bx = W - badgeW - 12 * dpr;
  const by = 16 * dpr;

  ctx.save();
  roundedRect(bx, by, badgeW, badgeH, 8 * dpr);
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.strokeStyle = pc.hue;
  ctx.lineWidth = 1.5 * dpr;
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = pc.hue;
  ctx.font = `900 ${11 * dpr}px Courier New, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('YOU: ' + pc.name, bx + badgeW / 2, by + badgeH / 2);
  ctx.restore();
}

function drawActionButton() {
  if (!_fromPlay) return;
  const l = layout();
  const dpr = l.dpr;
  const c = activeChar(0);
  const isDisabled = _pickerStep === 2 && c.id === _pickedPlayer;

  const bx = W / 2 - l.actionBtnW / 2;
  const by = l.actionBtnY;
  const pulse = 0.88 + Math.sin(frame * 0.07) * 0.12;

  ctx.save();
  if (isDisabled) {
    ctx.globalAlpha = 0.3;
  } else {
    ctx.globalAlpha = pulse;
    ctx.shadowColor = c.hue;
    ctx.shadowBlur = 18 * dpr;
  }

  roundedRect(bx, by, l.actionBtnW, l.actionBtnH, 12 * dpr);
  ctx.fillStyle = isDisabled ? 'rgba(60,50,80,0.8)' : c.hue;
  ctx.fill();

  if (!isDisabled) {
    ctx.shadowBlur = 0;
    const label = _pickerStep === 1
      ? 'PLAY AS  ' + c.name
      : 'TEAM UP WITH  ' + c.name;
    ctx.fillStyle = '#111';
    ctx.font = `900 ${17 * dpr}px Courier New, monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, W / 2, by + l.actionBtnH / 2, l.actionBtnW - 20 * dpr);
  }
  ctx.restore();
}

function drawArrows() {
  const l = layout();
  const y = H * 0.48;
  const sz = 18 * l.dpr;
  const alphaL = hot && hot.type === 'prev' ? 0.95 : 0.42;
  const alphaR = hot && hot.type === 'next' ? 0.95 : 0.42;

  ctx.save();
  ctx.fillStyle = `rgba(255,255,255,${alphaL})`;
  ctx.beginPath();
  ctx.moveTo(l.leftX - sz, y);
  ctx.lineTo(l.leftX + sz * 0.45, y - sz);
  ctx.lineTo(l.leftX + sz * 0.45, y + sz);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = `rgba(255,255,255,${alphaR})`;
  ctx.beginPath();
  ctx.moveTo(l.rightX + sz, y);
  ctx.lineTo(l.rightX - sz * 0.45, y - sz);
  ctx.lineTo(l.rightX - sz * 0.45, y + sz);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawFrame() {
  ctx.clearRect(0, 0, W, H);
  const l = layout();
  const c = activeChar(0);
  const isGrayedOut = _fromPlay && _pickerStep === 2 && c.id === _pickedPlayer;

  const grd = ctx.createRadialGradient(W / 2, H * 0.54, 0, W / 2, H * 0.54, H * 0.72);
  grd.addColorStop(0, (isGrayedOut ? '#888888' : c.hue) + '22');
  grd.addColorStop(0.5, '#1b0630');
  grd.addColorStop(1, '#080014');
  ctx.fillStyle = grd;
  ctx.fillRect(0, 0, W, H);

  // Side sprites (dim picked player in step 2)
  const prevC = activeChar(-1);
  const nextC = activeChar(1);
  const prevAlpha = (_fromPlay && _pickerStep === 2 && prevC.id === _pickedPlayer) ? 0.1 : 0.28;
  const nextAlpha = (_fromPlay && _pickerStep === 2 && nextC.id === _pickedPlayer) ? 0.1 : 0.28;
  drawSprite(prevC, l.leftX, l.sideY, l.sideH, prevAlpha, false);
  drawSprite(nextC, l.rightX, l.sideY, l.sideH, nextAlpha, false);

  if (zoomed && !_fromPlay) {
    drawFace(c);
    drawName(c, l.labelY, true);
    drawSummary(c, l.summaryY);
  } else {
    ctx.save();
    if (isGrayedOut) ctx.globalAlpha = 0.35;
    ctx.translate(l.cx, l.floor + 10 * l.dpr);
    ctx.scale(0.82, 0.18);
    ctx.beginPath();
    ctx.arc(0, 0, l.bodyH * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.fill();
    ctx.restore();
    drawSprite(c, l.cx, l.floor, l.bodyH, isGrayedOut ? 0.35 : 1, !isGrayedOut);
    drawName(c, l.labelY, !isGrayedOut);
    drawSummary(c, l.summaryY);
  }

  drawArrows();
  if (_fromPlay) {
    drawActionButton();
    drawPickerBadge();
  } else {
    drawDots();
  }
}

function tick() {
  frame++;
  drawFrame();
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
